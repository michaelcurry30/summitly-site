<!doctype html>
<html><head><meta charset="utf-8"><title>If-Then Plans</title>
<script src="variant.js"></script>
<script src="kit/stick.js"></script>
</head>
<body><div id="stage"></div>
<script>
// STICK NINJA — "IF-THEN PLANS" (planner channel). Short (≈15.8 s). Built from gen_short.py template. Ending: lesson + FOLLOW FOR MORE (no planner card).
const EC0 = 14.25, DUR = 15.8;
const A = {"hook": 0, "prob": 2.96, "roof": 5.59, "fix": 6.89, "pay": 12.05};
const K = {"TH": 6.49, "land": 5.72, "EC0": 14.25, "DUR": 15.8, "h1": 1.6, "pk": 5.06, "f1": 7.39, "f2": 9.39};
const SCENES = { hook: [0, A.prob], prob: [A.prob, A.roof], roof: [A.roof, A.fix], fix: [A.fix, A.pay], pay: [A.pay, DUR] };
const S = Stick, { seg, oC, io, oBack, lerp, clamp, tri, hash } = S;
const stage = S.stage();
const E = { e1: S.env(stage, 'bedroom'), e2: S.env(stage, 'hall'), roof: S.env(stage, 'rooftop'), e4: S.env(stage, 'mountain'), mtn: S.env(stage, 'mountain') };
const W = S.world(stage);
const hookH = S.kin(stage, '<div data-max="140">“I’LL WORK OUT MORE.”</div><div data-max="140">YOU SAY IT <i class="pk">EVERY</i> <i class="pk">WEEK.</i></div>', { top: 262 });
const probH = S.kin(stage, '<div data-max="130">BUT “MORE” IS NOT A PLAN.</div><div data-max="140">SO IT <i class="pk">NEVER</i> <i class="pk">HAPPENS.</i></div>', { top: 262 });
const ninH = S.kin(stage, '<div data-max="170"><i class="cy">BE</i> <i class="cy">SPECIFIC.</i></div>', { top: 262 });
const fixH = S.kin(stage, '<div data-max="130">“IF IT’S 7 A.M.,</div><div data-max="130">THEN I <i class="cy">PUT</i> <i class="cy">ON</i> <i class="cy">MY</i> <i class="cy">SHOES.</i>”</div>', { top: 262 });
const pay1 = S.kin(stage, '<div data-max="140">A CLEAR PLAN BEATS</div>', { top: 290 });
const pay2 = S.kin(stage, '<div data-max="160"><i class="or">A</i> <i class="or">VAGUE</i> <i class="or">WISH.</i></div>', { top: 450 });
const follow = S.chip(stage, 'FOLLOW FOR <b>MORE</b>', { top: 640, cls: 'dark', size: 48 });
S.safeGuide(stage);
const D = S.ninja.draw, nin = (t, J, o) => S.ninja.pose(t, Object.assign({ J }, o));
const sk = n => S.ninja.skel(n), W2 = (n, p) => S.ninja.toWorld(n, p), hand = n => W2(n, sk(n).armF[2]);
function glow(ctx, x, y, r, col, k) {
  if (k <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col.replace('A', (.5 * k).toFixed(3))); g.addColorStop(1, col.replace('A', '0'));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
const EW = { color: '#ff9ec7', color2: '#ff6fae', side: '#6a1736', depth: 16 };
const HA = -64, TS = K.TH - S.ninja.SLASH.uAt(HA);
const roofTr = S.track([[A.roof, 160, 1500, 1.2, 0], [K.land, 200, 1500, 1.2, 0], [TS - .02, 200, 1500, 1.2, 0], [TS + .62, 640, 1500, 1.2, 260], [99, 640, 1500, 1.2, 0]]);
const roofTL = S.ninja.timeline([[A.roof, 'jump', { ph: .5 }], [K.land, 'crouch', {}, .1], [TS, 'slash', {}, .08], [TS + 1.25, 'ready', {}, .25]]);
const hitN = nin(K.TH, roofTL(K.TH), roofTr(K.TH)), RC = S.ninja.reach(hitN);
const WC = S.wordcut(Object.assign({ text: 'SOMEDAY', x: RC.cx + RC.R * Math.cos(HA * Math.PI / 180), y: RC.cy + RC.R * Math.sin(HA * Math.PI / 180), size: 160, angle: HA + 90, seed: 7 }, EW));
const payTL = S.ninja.timeline([[A.pay, 'walk'], [A.pay + .5, 'idle', {}, .2], [A.pay + .6, 'flourish', { aim: -8 }, .1], [12.8 + .4, 'proud', {}, .25], [EC0, 'wave', {}, .2]]);
const payTr = S.track([[A.pay, 250, 1500, 1.15, 0], [A.pay + .5, 470, 1500, 1.15, 0]]);

const hookTL = S.ninja.timeline([[0, 'point', { ang: -30 }], [.9, 'proud', {}, .15], [K.h1, 'shrug', {}, .15]]);
function drawHook(ctx, t) { S.calPage(ctx, 800, 1060, .6 * oBack(seg(t, .2, .5), 2), 'MORE?', { rot: 6, col: '#ff6fae' });
  D(ctx, nin(t, hookTL(t), { x: 440, y: 1500, s: 1 })); }
const probTL = S.ninja.timeline([[A.prob, 'sitBack'], [A.prob + 1.0, 'slump', {}, .2], [K.pk, 'facepalm', {}, .12]]);
function drawProb(ctx, t) { ['MON', 'TUE', 'WED', 'THU'].forEach((w, i) => { const a = A.prob + .3 + i * .3, k = oBack(seg(t, a, a + .2), 2); if (k <= 0) return;
    S.calPage(ctx, 620 + (i % 2) * 190, 980 + Math.floor(i / 2) * 190, .4 * k, w, { rot: (i - 1.5) * 5, op: .55 }); });
  D(ctx, nin(t, probTL(t), { x: 330, y: 1500, s: 1 })); }
const fixTL = S.ninja.timeline([[A.fix, 'point', { ang: -30 }], [K.f1 + 1.0, 'run', {}, .12], [K.f2, 'cheer', {}, .12]]);
const fixTr = S.track([[A.fix, 330, 1500, 1, 0], [K.f1 + 1.0, 330, 1500, 1, 0], [K.f2, 600, 1500, 1, 0]]);
function drawFix(ctx, t) { S.wallClock(ctx, 800, 1000, 1.0, t, { speed: 0 });
  S.calPage(ctx, 960, 1180, .4 * oBack(seg(t, K.f1, K.f1 + .3), 2), '7:00', { rot: 6, col: '#3ee6ff' });
  D(ctx, nin(t, fixTL(t), Object.assign({ vx: t > K.f1 + 1 && t < K.f2 ? 300 : 0 }, fixTr(t))));
  S.check(ctx, 960, 1180, .5, seg(t, K.f2, K.f2 + .35));
  S.sparks(ctx, t, K.f2, 960, 1150, { n: 12, seed: 14, speed: 500, dir: -Math.PI / 2, spread: 2.4, life: .4, g: 900 }); }

const span = (k, a, b) => seg(k, a, b);
const SC = [
  { a: 0, b: A.prob, env: E.e1, envOpt: () => ({ lamp: .6 }), cam: t => ({ x: lerp(560, 620, seg(t, 0, A.prob)), y: 1150, z: lerp(1.3, 1.42, io(seg(t, 0, A.prob))) + .03 * tri(t, K.h1, K.h1 + .3) }), draw: drawHook },
  { a: A.prob, b: A.roof, env: E.e2, whip: 'left', envOpt: () => ({}), cam: t => ({ x: lerp(540, 600, seg(t, A.prob, A.roof)), y: 1120, z: lerp(1.18, 1.28, io(seg(t, A.prob, A.roof))) + .04 * tri(t, K.pk, K.pk + .3), r: -1.5 }), draw: drawProb },
  { a: A.roof, b: A.fix, env: E.roof, whip: 'up', cam: t => { const push = io(seg(t, A.roof + .1, K.TH)) * .07, punch = .05 * tri(t, K.TH, K.TH + .25);
      return { x: lerp(545, 575, seg(t, A.roof, A.fix)), y: lerp(900, 880, seg(t, A.roof, A.fix)), z: 1.2 + push + punch }; },
    draw(ctx, t) { WC.draw(ctx, t, { in: A.roof + .05, mode: 'drop', h: 240, cut: K.TH, wob: .6, kick: 1.2, fadeAt: A.fix - .1 }); D(ctx, nin(t, roofTL(t), Object.assign({ ground: 1500 }, roofTr(t)))); } },
  { a: A.fix, b: A.pay, env: E.e4, whip: 'left', envOpt: t => ({ rise: .3 + .5 * io(seg(t, A.fix, A.pay)) }), cam: t => ({ x: lerp(560, 620, seg(t, A.fix, A.pay)), y: 1120, z: lerp(1.25, 1.33, io(seg(t, A.fix, A.pay))) + .03 * tri(t, K.f2, K.f2 + .3) }), draw: drawFix },
  { a: A.pay, b: DUR + 1, env: E.mtn, whip: 'left', cam: t => ({ x: 540, y: lerp(960, 985, seg(t, A.pay, DUR)), z: lerp(1.16, 1.24, io(seg(t, A.pay, DUR))) + .03 * tri(t, 12.8, 12.8 + .3) }),
    envOpt: t => ({ rise: .3 + .6 * io(seg(t, A.pay, EC0 - .2)) }),
    draw(ctx, t) { D(ctx, nin(t, payTL(t), Object.assign({ vx: t < A.pay + .5 ? 300 : 0 }, payTr(t)))); S.sparks(ctx, t, 12.8, 470, 1000, { n: 14, seed: 9, speed: 700, dir: -Math.PI / 2, spread: 2.6, life: .5, g: 900 }); } },
];
function seek(t) {
  const sh = WC.shake(t, K.TH), imp = (a, amp) => t >= a && t < a + .22 ? Math.round(amp * (1 - (t - a) / .22) * Math.sin(t * 120)) : 0;
  W.seek(t, SC, { shake: [sh[0], sh[1] + imp(K.pk, 6) + imp(K.f2, 4)], flash: WC.flash(t, K.TH), flashColor: '#ff6fae' });
  S.kinShow(hookH, t, 0, A.prob - .15, { hold0: true, beats: [0, 0, 0, 0, 1.61, 1.77, 1.94, 2.1, 2.26] });
  S.kinShow(probH, t, 3.08, A.roof - .3, { beats: [3.08, 3.29, 3.49, 3.7, 3.91, 4.11, 4.32, 4.53, 4.73, 4.94] });
  S.kinShow(ninH, t, 5.81, K.TH + -0.1, { beats: [5.81, 6.5], style: 'slam' });
  S.kinShow(fixH, t, 7.32, A.pay - .15, { beats: [7.32, 7.71, 8.11, 8.5, 8.89, 9.29, 9.68, 10.07, 10.46, 10.86, 11.25] });
  S.kinShow(pay1, t, 12.27, DUR + 1, { beats: [12.27, 12.35, 12.42, 12.5], style: 'slam' });
  S.kinShow(pay2, t, 12.8, DUR + 1, { beats: [12.8, 12.95, 13.1], style: 'slam' });
  S.show(follow, t, EC0, DUR + 1, { pop: true });
  S.hideInvisible(stage);
}
S.boot({ duration: DUR, fps: 30, seek });
</script></body></html>
