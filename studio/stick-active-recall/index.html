<!doctype html>
<html><head><meta charset="utf-8"><title>Test Yourself</title>
<script src="variant.js"></script>
<script src="kit/stick.js"></script>
</head>
<body><div id="stage"></div>
<script>
// STICK NINJA — "TEST YOURSELF" (planner channel). Short (≈15.35 s). Built from gen_short.py template. Ending: lesson + FOLLOW FOR MORE (no planner card).
const EC0 = 13.8, DUR = 15.35;
const A = {"hook": 0, "prob": 3.34, "roof": 5.73, "fix": 7.03, "pay": 11.41};
const K = {"TH": 6.63, "land": 5.86, "EC0": 13.8, "DUR": 15.35, "h1": 1.8, "pk": 5.04, "f1": 7.53, "f2": 9.63};
const SCENES = { hook: [0, A.prob], prob: [A.prob, A.roof], roof: [A.roof, A.fix], fix: [A.fix, A.pay], pay: [A.pay, DUR] };
const S = Stick, { seg, oC, io, oBack, lerp, clamp, tri, hash } = S;
const stage = S.stage();
const E = { e1: S.env(stage, 'library', { day: true }), e2: S.env(stage, 'bedroom'), roof: S.env(stage, 'rooftop'), e4: S.env(stage, 'hall'), mtn: S.env(stage, 'mountain') };
const W = S.world(stage);
const hookH = S.kin(stage, '<div data-max="130">YOU READ YOUR NOTES 5 TIMES,</div><div data-max="140">THEN <i class="pk">BLANK</i> ON THE TEST.</div>', { top: 262 });
const probH = S.kin(stage, '<div data-max="130">REREADING FEELS EASY.</div><div data-max="150">THAT’S THE <i class="pk">TRAP.</i></div>', { top: 262 });
const ninH = S.kin(stage, '<div data-max="180"><i class="cy">NOT</i> <i class="cy">AGAIN.</i></div>', { top: 262 });
const fixH = S.kin(stage, '<div data-max="120">CLOSE THE BOOK. WRITE WHAT</div><div data-max="130">YOU <i class="cy">REMEMBER.</i> THEN <i class="cy">CHECK.</i></div>', { top: 262 });
const pay1 = S.kin(stage, '<div data-max="150">TEST YOURSELF.</div>', { top: 290 });
const pay2 = S.kin(stage, '<div data-max="160"><i class="or">DON’T</i> <i class="or">JUST</i> <i class="or">REREAD.</i></div>', { top: 450 });
const follow = S.chip(stage, 'FOLLOW FOR <b>MORE</b>', { top: 640, cls: 'dark', size: 48 });
S.safeGuide(stage);
const D = S.ninja.draw, nin = (t, J, o) => S.ninja.pose(t, Object.assign({ J }, o));
const sk = n => S.ninja.skel(n), W2 = (n, p) => S.ninja.toWorld(n, p), hand = n => W2(n, sk(n).armF[2]);
function glow(ctx, x, y, r, col, k) {
  if (k <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col.replace('A', (.5 * k).toFixed(3))); g.addColorStop(1, col.replace('A', '0'));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
const EW = { color: '#ff9ec7', color2: '#ff6fae', side: '#6a1736', depth: 16 };
const HA = -64, TS = K.TH - S.ninja.SLASH.uAt(HA);
const roofTr = S.track([[A.roof, 160, 1500, 1.2, 0], [K.land, 200, 1500, 1.2, 0], [TS - .02, 200, 1500, 1.2, 0], [TS + .62, 640, 1500, 1.2, 260], [99, 640, 1500, 1.2, 0]]);
const roofTL = S.ninja.timeline([[A.roof, 'jump', { ph: .5 }], [K.land, 'crouch', {}, .1], [TS, 'slash', {}, .08], [TS + 1.25, 'ready', {}, .25]]);
const hitN = nin(K.TH, roofTL(K.TH), roofTr(K.TH)), RC = S.ninja.reach(hitN);
const WC = S.wordcut(Object.assign({ text: 'REREAD', x: RC.cx + RC.R * Math.cos(HA * Math.PI / 180), y: RC.cy + RC.R * Math.sin(HA * Math.PI / 180), size: 170, angle: HA + 90, seed: 7 }, EW));
const payTL = S.ninja.timeline([[A.pay, 'walk'], [A.pay + .5, 'idle', {}, .2], [A.pay + .6, 'flourish', { aim: -8 }, .1], [12.16 + .4, 'proud', {}, .25], [EC0, 'wave', {}, .2]]);
const payTr = S.track([[A.pay, 250, 1500, 1.15, 0], [A.pay + .5, 470, 1500, 1.15, 0]]);

const hookTL = S.ninja.timeline([[0, 'read'], [K.h1, 'shrug', {}, .15]]);
function drawHook(ctx, t) { const k = oBack(seg(t, K.h1 - .2, K.h1 + .1), 2);
  if (k > 0) { S.calPage(ctx, 800, 1050, .6 * k, 'TEST', { rot: 6, col: '#ff6fae' }); S.qmark(ctx, 810, 1080, .8, seg(t, K.h1 + .1, K.h1 + .3)); }
  D(ctx, nin(t, hookTL(t), { x: 440, y: 1500, s: 1 })); }
const probTL = S.ninja.timeline([[A.prob, 'read'], [K.pk, 'slump', {}, .15]]);
function drawProb(ctx, t) { for (let i = 0; i < 3; i++) { const a = A.prob + .2 + i * .4, k = oBack(seg(t, a, a + .25), 2); if (k > 0) S.note(ctx, 660 + i * 130, 1040 + (i % 2) * 60, .5 * k, (i - 1) * 9, '', { col: '#ffe36b' }); }
  D(ctx, nin(t, probTL(t), { x: 380, y: 1500, s: 1, face: 'g' })); }
const fixTL = S.ninja.timeline([[A.fix, 'throw'], [A.fix + .6, 'type', { face: 'f', dx: 130, dy: -236 }, .15], [K.f2, 'cheer', {}, .12]]);
function drawFix(ctx, t) {
  ctx.fillStyle = '#2a2f55'; ctx.fillRect(640, 1262, 380, 20); ctx.fillRect(660, 1282, 20, 218); ctx.fillRect(980, 1282, 20, 218);
  S.book(ctx, 900, 1240, .6, 4, { open: 1 - seg(t, A.fix + .1, A.fix + .4) });
  const k = oBack(seg(t, A.fix + .5, K.f1 + .4), 2);
  if (k > 0) { ctx.save(); ctx.translate(780, 1240); ctx.scale(k, k); ctx.fillStyle = '#fff6e8'; ctx.beginPath(); ctx.roundRect(-110, -230, 220, 220, 12); ctx.fill();
    ctx.lineCap = 'round'; const n = Math.floor(5 * seg(t, K.f1 + .2, K.f2)); for (let i = 0; i < 5; i++) { const y = -195 + i * 38;
      ctx.strokeStyle = i < n ? '#141b3a' : '#d8cfbf'; ctx.lineWidth = i < n ? 6 : 4; ctx.beginPath(); ctx.moveTo(-85, y); ctx.lineTo(-85 + (i < n ? 120 + 40 * hash(i * 2.3) : 170), y); ctx.stroke(); }
    ctx.restore(); }
  D(ctx, nin(t, fixTL(t), { x: 520, y: 1500, s: 1 }));
  S.check(ctx, 900, 1000, .55, seg(t, K.f2, K.f2 + .35));
  S.sparks(ctx, t, K.f2, 900, 1000, { n: 12, seed: 14, speed: 500, dir: -Math.PI / 2, spread: 2.4, life: .4, g: 900 }); }

const span = (k, a, b) => seg(k, a, b);
const SC = [
  { a: 0, b: A.prob, env: E.e1, envOpt: () => ({ lamp: .6 }), cam: t => ({ x: lerp(560, 620, seg(t, 0, A.prob)), y: 1150, z: lerp(1.3, 1.42, io(seg(t, 0, A.prob))) + .03 * tri(t, K.h1, K.h1 + .3) }), draw: drawHook },
  { a: A.prob, b: A.roof, env: E.e2, whip: 'left', envOpt: () => ({}), cam: t => ({ x: lerp(540, 600, seg(t, A.prob, A.roof)), y: 1120, z: lerp(1.18, 1.28, io(seg(t, A.prob, A.roof))) + .04 * tri(t, K.pk, K.pk + .3), r: -1.5 }), draw: drawProb },
  { a: A.roof, b: A.fix, env: E.roof, whip: 'up', cam: t => { const push = io(seg(t, A.roof + .1, K.TH)) * .07, punch = .05 * tri(t, K.TH, K.TH + .25);
      return { x: lerp(545, 575, seg(t, A.roof, A.fix)), y: lerp(900, 880, seg(t, A.roof, A.fix)), z: 1.2 + push + punch }; },
    draw(ctx, t) { WC.draw(ctx, t, { in: A.roof + .05, mode: 'drop', h: 240, cut: K.TH, wob: .6, kick: 1.2, fadeAt: A.fix - .1 }); D(ctx, nin(t, roofTL(t), Object.assign({ ground: 1500 }, roofTr(t)))); } },
  { a: A.fix, b: A.pay, env: E.e4, whip: 'left', envOpt: () => ({}), cam: t => ({ x: lerp(560, 620, seg(t, A.fix, A.pay)), y: 1120, z: lerp(1.25, 1.33, io(seg(t, A.fix, A.pay))) + .03 * tri(t, K.f2, K.f2 + .3) }), draw: drawFix },
  { a: A.pay, b: DUR + 1, env: E.mtn, whip: 'left', cam: t => ({ x: 540, y: lerp(960, 985, seg(t, A.pay, DUR)), z: lerp(1.16, 1.24, io(seg(t, A.pay, DUR))) + .03 * tri(t, 12.16, 12.16 + .3) }),
    envOpt: t => ({ rise: .3 + .6 * io(seg(t, A.pay, EC0 - .2)) }),
    draw(ctx, t) { D(ctx, nin(t, payTL(t), Object.assign({ vx: t < A.pay + .5 ? 300 : 0 }, payTr(t)))); S.sparks(ctx, t, 12.16, 470, 1000, { n: 14, seed: 9, speed: 700, dir: -Math.PI / 2, spread: 2.6, life: .5, g: 900 }); } },
];
function seek(t) {
  const sh = WC.shake(t, K.TH), imp = (a, amp) => t >= a && t < a + .22 ? Math.round(amp * (1 - (t - a) / .22) * Math.sin(t * 120)) : 0;
  W.seek(t, SC, { shake: [sh[0], sh[1] + imp(K.pk, 6) + imp(K.f2, 4)], flash: WC.flash(t, K.TH), flashColor: '#ff6fae' });
  S.kinShow(hookH, t, 0, A.prob - .15, { hold0: true, beats: [0, 0, 0, 0, 0, 0, 1.99, 2.15, 2.31, 2.48, 2.64] });
  S.kinShow(probH, t, 3.46, A.roof - .3, { beats: [3.46, 3.78, 4.11, 4.43, 4.76, 5.08] });
  S.kinShow(ninH, t, 5.95, K.TH + -0.1, { beats: [5.95, 6.44], style: 'slam' });
  S.kinShow(fixH, t, 7.26, A.pay - .15, { beats: [7.26, 7.68, 8.1, 8.52, 8.94, 9.35, 9.77, 10.19, 10.61] });
  S.kinShow(pay1, t, 11.63, DUR + 1, { beats: [11.63, 11.86], style: 'slam' });
  S.kinShow(pay2, t, 12.16, DUR + 1, { beats: [12.16, 12.31, 12.46], style: 'slam' });
  S.show(follow, t, EC0, DUR + 1, { pop: true });
  S.hideInvisible(stage);
}
S.boot({ duration: DUR, fps: 30, seek });
</script></body></html>
