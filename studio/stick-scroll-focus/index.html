<!doctype html>
<html><head><meta charset="utf-8"><title>Boredom Builds Focus</title>
<script src="variant.js"></script>
<script src="kit/stick.js"></script>
</head>
<body><div id="stage"></div>
<script>
// STICK NINJA — "BOREDOM BUILDS FOCUS" (planner channel). Short (≈17.64 s). Built from gen_short.py template. Ending: lesson + endCardPlanner (CTA e).
const EC0 = 11.8, DUR = 17.64;
const A = {"hook": 0, "prob": 2.85, "roof": 5.8, "fix": 7.1, "pay": 9.85};
const K = {"TH": 6.7, "land": 5.93, "EC0": 11.8, "DUR": 17.64, "h1": 2.1, "pk": 4.95, "f1": 7.8, "f2": 9.1};
const SCENES = { hook: [0, A.prob], prob: [A.prob, A.roof], roof: [A.roof, A.fix], fix: [A.fix, A.pay], pay: [A.pay, DUR] };
const S = Stick, { seg, oC, io, oBack, lerp, clamp, tri, hash } = S;
const stage = S.stage();
const E = { e1: S.env(stage, 'bedroom'), e2: S.env(stage, 'feed'), roof: S.env(stage, 'rooftop'), e4: S.env(stage, 'library', { day: true }), mtn: S.env(stage, 'mountain') };
const W = S.world(stage);
const hookH = S.kin(stage, '<div data-max="130">SCROLLED FOR AN HOUR?</div><div data-max="130">NOW YOU CAN’T READ <i class="pk">ONE</i> <i class="pk">PAGE?</i></div>', { top: 262 });
const probH = S.kin(stage, '<div data-max="120">YOUR BRAIN GOT USED TO</div><div data-max="120"><i class="or">SOMETHING</i> <i class="or">NEW</i> EVERY FEW SECONDS.</div>', { top: 262 });
const ninH = S.kin(stage, '<div data-max="180"><i class="cy">RESET.</i></div>', { top: 262 });
const fixH = S.kin(stage, '<div data-max="130">PUT IT DOWN. LET IT BE</div><div data-max="140"><i class="cy">BORING</i> FOR A FEW MINUTES.</div>', { top: 262 });
const pay1 = S.kin(stage, '<div data-max="150">BOREDOM BUILDS</div>', { top: 290 });
const pay2 = S.kin(stage, '<div data-max="170"><i class="or">FOCUS.</i></div>', { top: 470 });
S.safeGuide(stage);
const endCard = S.endCardPlanner(stage, { dur: +(DUR - EC0).toFixed(2), head: '<div data-max="120">STOP WASTING</div><div data-max="140"><i class="cy">YOUR</i> <i class="cy">POTENTIAL</i></div>', beats: [0.35, 0.6, 0.9, 1.15], chip: '<span class="chip dark" style="font-size:34px">FREE PLANNER PAGES · LINK IN <b>BIO</b></span>' });
const D = S.ninja.draw, nin = (t, J, o) => S.ninja.pose(t, Object.assign({ J }, o));
const sk = n => S.ninja.skel(n), W2 = (n, p) => S.ninja.toWorld(n, p), hand = n => W2(n, sk(n).armF[2]);
function glow(ctx, x, y, r, col, k) {
  if (k <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col.replace('A', (.5 * k).toFixed(3))); g.addColorStop(1, col.replace('A', '0'));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
const EW = { color: '#ff9ec7', color2: '#ff6fae', side: '#6a1736', depth: 16 };
const HA = -64, TS = K.TH - S.ninja.SLASH.uAt(HA);
const roofTr = S.track([[A.roof, 160, 1500, 1.2, 0], [K.land, 200, 1500, 1.2, 0], [TS - .02, 200, 1500, 1.2, 0], [TS + .62, 640, 1500, 1.2, 260], [99, 640, 1500, 1.2, 0]]);
const roofTL = S.ninja.timeline([[A.roof, 'jump', { ph: .5 }], [K.land, 'crouch', {}, .1], [TS, 'slash', {}, .08], [TS + 1.25, 'ready', {}, .25]]);
const hitN = nin(K.TH, roofTL(K.TH), roofTr(K.TH)), RC = S.ninja.reach(hitN);
const WC = S.wordcut(Object.assign({ text: 'SCROLL', x: RC.cx + RC.R * Math.cos(HA * Math.PI / 180), y: RC.cy + RC.R * Math.sin(HA * Math.PI / 180), size: 130, angle: HA + 90, seed: 7 }, EW));
const payTL = S.ninja.timeline([[A.pay, 'walk'], [A.pay + .5, 'idle', {}, .2], [A.pay + .6, 'flourish', { aim: -8 }, .1], [10.6 + .4, 'proud', {}, .25]]);
const payTr = S.track([[A.pay, 250, 1500, 1.15, 0], [A.pay + .5, 470, 1500, 1.15, 0]]);

const hookTL = S.ninja.timeline([[0, 'scroll', { swipes: [.05, .4, .75, 1.1] }], [1.5, 'read', {}, .15], [K.h1, 'slump', {}, .12]]);
function drawHook(ctx, t) { S.laptop(ctx, 820, 1262, 1, { on: false, lines: 0 });
  D(ctx, nin(t, hookTL(t), { x: 420, y: 1500, s: 1, face: t < 1.5 ? 'g' : (t < K.h1 ? 'd' : 'x') }));
  S.sparks(ctx, t, K.h1, 440, 1060, { n: 8, seed: 3, speed: 300, dir: -Math.PI / 2, spread: 2, life: .3, g: 900 }); }
const probTL = S.ninja.timeline([[A.prob, 'idle', { }], [A.prob + 1.0, 'look', {}, .15], [K.pk, 'facepalm', {}, .12]]);
function drawProb(ctx, t) {
  const u = t - A.prob; S.goblin.draw(ctx, { x: 780, y: 1500 - 30 * Math.abs(Math.sin(u * 7)), s: 1.1, t, face: 'grin', fx: -1, squash: .2 * Math.max(0, Math.sin(u * 7)) });
  D(ctx, nin(t, probTL(t), { x: 330, y: 1500, s: 1, face: 'x' })); }
const fixTL = S.ninja.timeline([[A.fix, 'reach', { x: 200, y: -60, face: 'f' }], [K.f1 + .1, 'chin', { face: 'd' }, .2], [K.f2, 'read', { sit: true, face: 'f' }, .2]]);
function drawFix(ctx, t) {
  glow(ctx, 520, 1250, 260, 'rgba(62,230,255,A)', .7 * seg(t, K.f2, K.f2 + .6));
  ctx.fillStyle = '#2a2f55'; ctx.fillRect(400, 1390, 150, 18); ctx.fillRect(420, 1408, 16, 92); ctx.fillRect(514, 1408, 16, 92);
  if (t < K.f1) S.phone(ctx, lerp(640, 760, seg(t, A.fix + .1, K.f1 - .1)), lerp(1250, 1440, seg(t, A.fix + .1, K.f1 - .1)), .6, 90 * seg(t, A.fix + .1, K.f1), {});
  S.box(ctx, 780, 1500, .9, 1 - seg(t, K.f1 - .1, K.f1 + .1));
  D(ctx, nin(t, fixTL(t), { x: 470, y: 1500, s: 1 }));
  S.sparks(ctx, t, K.f1, 780, 1430, { n: 10, seed: 13, speed: 400, dir: -Math.PI / 2, spread: 2.4, life: .35, g: 900 });
  S.sparks(ctx, t, K.f2, 560, 1150, { n: 12, seed: 14, speed: 500, dir: -Math.PI / 2, spread: 2.4, life: .4, g: 900 }); }

const span = (k, a, b) => seg(k, a, b);
const SC = [
  { a: 0, b: A.prob, env: E.e1, envOpt: () => ({ lamp: .6 }), cam: t => ({ x: lerp(560, 620, seg(t, 0, A.prob)), y: 1150, z: lerp(1.3, 1.42, io(seg(t, 0, A.prob))) + .03 * tri(t, K.h1, K.h1 + .3) }), draw: drawHook },
  { a: A.prob, b: A.roof, env: E.e2, whip: 'left', envOpt: t => ({ scroll: 900 * (t - A.prob) + 600 * (t - A.prob) * (t - A.prob) }), cam: t => ({ x: lerp(540, 600, seg(t, A.prob, A.roof)), y: 1120, z: lerp(1.18, 1.28, io(seg(t, A.prob, A.roof))) + .04 * tri(t, K.pk, K.pk + .3), r: -1.5 }), draw: drawProb },
  { a: A.roof, b: A.fix, env: E.roof, whip: 'up', cam: t => { const push = io(seg(t, A.roof + .1, K.TH)) * .07, punch = .05 * tri(t, K.TH, K.TH + .25);
      return { x: lerp(545, 575, seg(t, A.roof, A.fix)), y: lerp(900, 880, seg(t, A.roof, A.fix)), z: 1.2 + push + punch }; },
    draw(ctx, t) { WC.draw(ctx, t, { in: A.roof + .05, mode: 'drop', h: 240, cut: K.TH, wob: .6, kick: 1.2, fadeAt: A.fix - .1 }); D(ctx, nin(t, roofTL(t), Object.assign({ ground: 1500 }, roofTr(t)))); } },
  { a: A.fix, b: A.pay, env: E.e4, whip: 'left', envOpt: () => ({}), cam: t => ({ x: lerp(560, 620, seg(t, A.fix, A.pay)), y: 1120, z: lerp(1.25, 1.33, io(seg(t, A.fix, A.pay))) + .03 * tri(t, K.f2, K.f2 + .3) }), draw: drawFix },
  { a: A.pay, b: DUR + 1, env: E.mtn, whip: 'left', cam: t => ({ x: 540, y: lerp(960, 985, seg(t, A.pay, EC0)), z: lerp(1.16, 1.24, io(seg(t, A.pay, EC0))) + .03 * tri(t, 10.6, 10.6 + .3) }),
    envOpt: t => ({ rise: .3 + .6 * io(seg(t, A.pay, EC0 - .2)) }),
    draw(ctx, t) { D(ctx, nin(t, payTL(t), Object.assign({ vx: t < A.pay + .5 ? 300 : 0 }, payTr(t)))); S.sparks(ctx, t, 10.6, 470, 1000, { n: 14, seed: 9, speed: 700, dir: -Math.PI / 2, spread: 2.6, life: .5, g: 900 }); } },
];
function seek(t) {
  const sh = WC.shake(t, K.TH), imp = (a, amp) => t >= a && t < a + .22 ? Math.round(amp * (1 - (t - a) / .22) * Math.sin(t * 120)) : 0;
  W.seek(t, SC, { shake: [sh[0], sh[1] + imp(K.pk, 6) + imp(K.f2, 4)], flash: WC.flash(t, K.TH), flashColor: '#ff6fae' });
  S.kinShow(hookH, t, 0, A.prob - .15, { hold0: true, beats: [0, 0, 0, 0, 1.78, 1.91, 2.04, 2.17, 2.3, 2.43] });
  S.kinShow(probH, t, 2.97, A.roof - .3, { beats: [2.97, 3.23, 3.49, 3.75, 4.01, 4.26, 4.52, 4.78, 5.04, 5.3] });
  S.kinShow(ninH, t, 6.02, K.TH + .1, { beats: [6.02], style: 'slam' });
  S.kinShow(fixH, t, 7.27, A.pay - .15, { beats: [7.27, 7.46, 7.64, 7.83, 8.02, 8.21, 8.39, 8.58, 8.77, 8.95, 9.14] });
  S.kinShow(pay1, t, 10.07, EC0 - .3, { beats: [10.07, 10.3], style: 'slam' });
  S.kinShow(pay2, t, 10.6, EC0 - .3, { beats: [10.6], style: 'slam' });
  endCard(t, EC0);
  S.hideInvisible(stage);
}
S.boot({ duration: DUR, fps: 30, seek });
</script></body></html>
