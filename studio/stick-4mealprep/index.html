{ const k = [[0, 'qCross', { face: 'n' }]];

// ---- props
function counter(ctx, x0, x1, fl, h) { ctx.fillStyle = '#2b3048'; F.rr(ctx, x0, fl - h, x1 - x0, 18, 6); ctx.fill(); ctx.fillStyle = '#1e2236'; ctx.fillRect(x0 + 8, fl - h + 18, x1 - x0 - 16, h - 18);

  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(zz, zz);

    case 3: ctx.fillStyle = '#2ed27a'; ctx.beginPath(); ctx.arc(-8, -6, 12, 0, TAU); ctx.arc(8, -8, 12, 0, TAU); ctx.arc(0, 6, 12, 0, TAU); ctx.fill(); break;               // broccoli

function flame(ctx, x, y, zz, t, k) { if (k <= 0) return; ctx.save(); ctx.translate(x, y); ctx.scale(zz * k, zz * k);

    ctx.moveTo(-w, 0); ctx.quadraticCurveTo(-w, -h * .6, Math.sin(t * 11 + j) * 8, -h); ctx.quadraticCurveTo(w, -h * .6, w, 0); ctx.fill(); }); ctx.restore(); }
function smoke(ctx, x, y, t, k, zz, col = '#5a5e74', top) { if (k <= 0) return;
  for (let i = 0; i < 7; i++) { const p = (t * .5 + i / 7) % 1, yy = Math.max(top, y - 380 * p * zz);

function draw(ctx, i, t, q) {

  let pos = { x: q.x0 + 150, y: q.fl, s, fx: 1 };

    flame(ctx, q.x0 + 440, ct - 30, z * .6, t + 1, live ? seg(t, T.fFire + .5, T.fFire + 1.1) * (t > T.fBoom ? 1.5 : 1) : 0);

    for (let k = 0; k < nb; k++) { const c = k % 3, rw = Math.floor(k / 3), drop = 1 - oC(seg(t, T.mBox(k), T.mBox(k) + .2));

  F.neon(ctx, n, q, Gl, o);

    F.bubble(ctx, q.x0 + 320, q.y0 + 240, 'FANCY!', seg(t, T.go + .1, T.go + 1.5), { size: 50, rot: .05 });
