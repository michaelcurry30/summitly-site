function bed(ctx, x, y, s, part) {          // part 'back' (frame+mattress) or 'front' (blanket)

function seek(t) {
  const sh = WC.shake(t, T.TH), imp = (a, amp) => t >= a && t < a + .22 ? Math.round(amp * (1 - (t - a) / .22) * Math.sin(t * 120)) : 0;

  S.kinShow(cl2, t, 25.8, 27.75, { beats: [25.8, 26.0, 26.2, 26.9], style: 'slam' });

  S.show(endC, t, 29.6, DUR + 1, { pop: true });
