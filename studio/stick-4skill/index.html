<!doctype html>
<html><head><meta charset="utf-8"><title>4 Ways To Learn A Skill</title>
<script src="kit/stick.js"></script>
<script src="kit/fourpanel.js"></script>
</head>
<body><div id="stage"></div>
<script>
// "4 WAYS TO LEARN A NEW SKILL. ONLY 1 WORKS." (guitar) — FOURPANEL_BIBLE.md format, no VO, loops.
const S = Stick, F = FourPanel, { seg, oC, iC, io, oBack, lerp, clamp, tri, hash } = S;
const PI = Math.PI, TAU = 2 * PI;
const T = {
  dur: 22.3, go: 1.0, POWER: 15.0,
  // play all day once: frantic strumming, day -> night, bandages, strings snap, falls off the stool
  aDay: 2.0, aSweat: 3.4, aTape: [4.6, 5.6, 6.6], aShake: 7.4, aSnap: 8.6, aFall: 9.0, aWreck: 9.4, aNever: 10.6,
  // watch tutorials: video cards pile up, glazed, nods, asleep; the guitar on the floor gets a cobweb
  vCard: k => 1.0 + k * .7, vChin: 6.4, vNod: 7.6, vSleep: 9.0,
  // wait to feel ready: reach, pull back, "not yet", calendar flips, beard grows
  rReach: [1.0, 4.0, 6.8], rBack: [1.5, 4.5, 7.3], rNot: 2.0, rFlip: k => 5.0 + k * .45, rBeard: 6.0, rFail: 9.0,
  // a little every day: short session, tick, calendar check; notes get better
  pDay: k => 1.0 + k * 1.5, pLong: 13.0,
  stamps: [15.94, 16.41, 16.88, 17.34], hookOut: 17.55, les0: 17.81, cta: 19.4, lesOut: 21.55, reset: 21.57, hookIn: 21.8,
};
const ND = 8;
const FP = F.create({
  labels: ['PLAY|ALL DAY ONCE', 'WATCH|TUTORIALS', 'WAIT TO|FEEL READY', 'A LITTLE|EVERY DAY'], s: 1.3,
  hook: ['4 WAYS TO LEARN A NEW SKILL.', '<i class="fp-hl" style="font-style:normal">ONLY 1</i> WORKS.'], hookMax: [80, 100],
  lesson: ['PRACTICE <i class="fp-hl">A LITTLE</i>', '<i class="fp-hl">EVERY</i> DAY.'], lessonMax: [100, 104], T,
  cta: 'FOLLOW FOR <b>MORE</b>',
});
const Q = FP.Q, s = FP.s, z = s / .8, RS = T.reset, TOP = -200;
const TL = S.ninja.timeline, W2 = (n, p) => S.ninja.toWorld(n, p), resetK = FP.resetK, shk = F.shk;
const P = S.ninja.POSE;
const seat = o => Object.assign({ hip: [0, -104], lean: .1, tilt: .1, hr: [124, -238], hl: [98, -238], fr: [88, 0], fl: [70, 0], tail: .2, face: 'n', kneeUp: 1 }, o);
// guitar across the lap: body at [60,-150], neck to [230,-270] (body units); hr strums, hl on the neck
P.gPlay = (u, a) => { const r = a.rate || 14, st = Math.sin(u * r), j = a.shake ? Math.sin(u * 47) * a.shake : 0;
  return seat({ hip: [j, -104], lean: .14 + (a.lean || 0), tilt: .18, hr: [72 + j, -176 + 22 * st], hl: [196 + j, -248], face: a.face || 'h', elbowOut: 0 }); };
P.gRest = (u, a) => { const b = Math.sin(u * 2.2); return seat({ lean: .02, tilt: -.05, hr: [70, -150 + b], hl: [150, -210 + b], face: a.face || 'h' }); };
P.gUp = u => { const k = oBack(seg(u, 0, .22)); return seat({ lean: -.04, tilt: -.12, hr: [lerp(72, 40, k), lerp(-170, -400, k)], hl: [196, -248], face: 'h' }); };
P.vWatch = (u, a) => { const b = Math.sin(u * 1.6); return seat({ lean: .32 + .02 * b, tilt: .3, hr: [130, -214], hl: [104, -212], face: a.face || 'g' }); };
const GB = [60, -150], GN = [232, -272];

const tl = [
  TL([[0, 'gRest', { face: 'n' }], [T.go, 'gPlay', { rate: 30, face: 'h' }, .12], [T.aSweat, 'gPlay', { rate: 34, face: 'd' }, .1], [T.aTape[1], 'gPlay', { rate: 30, face: 'w' }, .1],
      [T.aShake, 'gPlay', { rate: 26, face: 'w', shake: 5 }, .1], [T.aSnap, 'gPlay', { rate: 0.01, face: 's', shake: 2 }, .05], [T.aFall, 'fall', {}, .12], [T.aWreck, 'qWreck', {}, .08], [RS, 'gRest', { face: 'n' }, .45]]),
  TL([[0, 'vWatch', { face: 'n' }], [T.go, 'vWatch', { face: 'h' }, .15], [3.0, 'vWatch', { face: 'g' }, .3], [T.vChin, 'qChin', { face: 'g' }, .3], [T.vNod, 'qNod', { per: .9 }, .2], [T.vSleep, 'qSleep', {}, .3], [RS, 'vWatch', { face: 'n' }, .45]]),
  null, null,
];
const k2 = [[0, 'gRest', { face: 'n' }]];
T.rReach.forEach((a, k) => k2.push([a, 'qGrab', { x: 195, y: -200, face: 'h' }, .12], [T.rBack[k], 'qStare', {}, .15]));
k2.push([3.0, 'qChin', { face: 'w' }, .3], [5.4, 'qChin', { face: 'b' }, .3], [8.0, 'qChin', { face: 'b' }, .3], [T.rFail, 'qChin', { face: 'z' }, .3], [RS, 'gRest', { face: 'n' }, .45]);
k2.sort((a, b) => a[0] - b[0]);
tl[2] = TL(k2);
const k3 = [[0, 'gRest', { face: 'n' }]];
for (let k = 0; k < ND; k++) { const a = T.pDay(k); k3.push([a, 'gPlay', { rate: 14 + k, face: k < 2 ? 'd' : 'h' }, .12], [a + 1.0, 'gUp', {}, .1], [a + 1.3, 'gRest', {}, .15]); }
k3.push([T.pLong, 'gPlay', { rate: 26, face: 'h' }, .12], [T.POWER - .1, 'gUp', {}, .12], [15.6, 'gPlay', { rate: 30, face: 'h' }, .15], [17.4, 'gUp', {}, .2], [18.9, 'gPlay', { rate: 30, face: 'h' }, .2], [20.0, 'gUp', {}, .2], [21.0, 'gRest', {}, .2], [RS, 'gRest', { face: 'n' }, .4]);
tl[3] = TL(k3);
const failT = [T.aWreck, T.vSleep, T.rFail];
const glowOf = (i, t) => FP.glow(i, t, { fail: failT[i], power: T.POWER, build: [2, 13] });

// ---- props
function stool(ctx, x, y, ss) { ctx.save(); ctx.translate(x, y); ctx.scale(ss, ss); ctx.fillStyle = '#262a3e'; F.rr(ctx, -46, -100, 92, 14, 6); ctx.fill(); ctx.fillRect(-34, -88, 10, 88); ctx.fillRect(24, -88, 10, 88); ctx.restore(); }
function guitar(ctx, b, nk, zz, o = {}) {        // body centre b, neck end nk (world px)
  const ang = Math.atan2(nk[1] - b[1], nk[0] - b[0]), L = Math.hypot(nk[0] - b[0], nk[1] - b[1]) / zz;
  ctx.save(); ctx.translate(b[0], b[1]); ctx.rotate(ang); ctx.scale(zz, zz);
  if (!o.noNeck) { ctx.fillStyle = '#6a3f22'; ctx.fillRect(0, -7, L, 14); ctx.fillStyle = '#3a2414'; F.rr(ctx, L - 6, -12, 30, 24, 5); ctx.fill(); }
  ctx.fillStyle = o.col || '#d9893a'; ctx.beginPath(); ctx.ellipse(-26, 0, 42, 46, 0, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.ellipse(28, 0, 30, 34, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2a1608'; ctx.beginPath(); ctx.arc(14, 0, 13, 0, TAU); ctx.fill(); ctx.fillRect(-44, -12, 10, 24);
  if (!o.noNeck) { ctx.strokeStyle = '#f2f4ff'; ctx.lineWidth = 1.6; for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(-40, k * 4); ctx.lineTo(L, k * 4); ctx.stroke(); } }
  if (o.snap) { ctx.strokeStyle = '#f2f4ff'; ctx.lineWidth = 2; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(14, -4 + k * 4); for (let j = 0; j < 8; j++) ctx.lineTo(14 + j * 6, -4 + k * 4 - 30 * o.snap * Math.sin(j * 1.3 + k) * (j / 8)); ctx.stroke(); } }
  ctx.restore();
}
function note(ctx, x, y, sz, col, a, rot = 0) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = clamp(a); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sz, sz); ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(0, 0, 10, 7, -.4, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.moveTo(8, -3); ctx.lineTo(8, -34); ctx.lineTo(20, -26); ctx.stroke(); ctx.restore(); }
function notes(ctx, x, y, t, k, good, seed = 0, top = 0) {   // stream of rising notes (good 0 = sour grey / wobbly, 1 = colourful)
  if (k <= 0) return; const C = ['#4dff9a', '#ffd23f', '#ff7ab8', '#8fe9ff'];
  for (let j = 0; j < 4; j++) { const p = ((t * 1.3 + j / 4 + seed) % 1); const yy = Math.max(top, y - 200 * p);
    note(ctx, x + 40 * j - 50 + 16 * Math.sin(t * 4 + j), yy, 1.5, good > .5 ? C[j] : '#8a8fa8', k * Math.sin(PI * p), (1 - good) * Math.sin(t * 9 + j) * .6); }
}
function card(ctx, x, y, zz, rot, col) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(zz, zz); ctx.fillStyle = '#f2f4ff'; F.rr(ctx, -40, -24, 80, 48, 8); ctx.fill();
  ctx.fillStyle = col; F.rr(ctx, -34, -18, 68, 36, 5); ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(-8, -10); ctx.lineTo(12, 0); ctx.lineTo(-8, 10); ctx.fill(); ctx.restore(); }
function cobweb(ctx, x, y, R, k, flip = 1) {
  if (k <= 0) return; ctx.save(); ctx.globalAlpha = .7 * clamp(k); ctx.strokeStyle = '#d8dcf0'; ctx.lineWidth = 2.5; ctx.translate(x, y); ctx.scale(flip, 1);
  for (let a = 0; a <= 4; a++) { const an = a / 4 * PI / 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(an) * R * k, -Math.sin(an) * R * k); ctx.stroke(); }
  for (let rI = 1; rI <= 3; rI++) { const r2 = R * k * rI / 3.3; ctx.beginPath(); for (let a = 0; a <= 4; a++) { const an = a / 4 * PI / 2; ctx.lineTo(Math.cos(an) * r2, -Math.sin(an) * r2); } ctx.stroke(); }
  ctx.restore();
}
const VC = ['#ff3b4e', '#3fa9ff', '#ffd23f', '#4dff9a', '#ff7ab8', '#ff7a59'];

function draw(ctx, i, t, q) {
  const Gl = glowOf(i, t), J = tl[i](t), live = t < RS;
  const o = { seed: i * .7 };
  let pos = { x: q.x0 + 150, y: q.fl, s, fx: 1 }, D = null;
  if (i === 0) { F.window2(ctx, q.x0 + 300, q.labBot + 30, 170, 110, live ? io(seg(t, T.aDay, 8.0)) : 0); }
  if (i === 1) { D = F.desk(ctx, q, q.fx, q.fl, s, { top: TOP }); pos.x = q.fx; F.laptopGlow(ctx, q, q.fx, q.fl, s, live && t < T.vSleep ? .9 : .4, TOP);
    guitar(ctx, [q.x0 + 270, q.fl - 30], [q.x0 + 470, q.fl - 40], z * .8); cobweb(ctx, q.x0 + 494, q.fl, 170, live ? seg(t, T.vSleep, T.vSleep + 3) : 0, -1); }
  if (i === 2) {
    F.calendar(ctx, q.x0 + 300, q.labBot + 30, 170, 130, 1, 1, () => '', null, { col: q.col });
    if (live) for (let k = 0; k < 14; k++) { const a = T.rFlip(k), u = seg(t, a, a + .5); if (u > 0 && u < 1) { ctx.save(); ctx.globalAlpha = 1 - u; ctx.fillStyle = '#f4f2ff'; ctx.translate(q.x0 + 385 + 120 * u, q.labBot + 95 + 140 * u * u); ctx.rotate(u * 3); F.rr(ctx, -70, -45, 140, 90, 10); ctx.fill(); ctx.restore(); } }
    ctx.save(); ctx.translate(q.x0 + 400, q.fl); ctx.strokeStyle = '#5a6080'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(0, -60); ctx.lineTo(30, 0); ctx.moveTo(0, -60); ctx.lineTo(0, -120); ctx.stroke(); ctx.restore();
    guitar(ctx, [q.x0 + 400, q.fl - 70], [q.x0 + 400, q.fl - 300], z * .8);
    cobweb(ctx, q.x0 + 494, q.labBot + 200, 1, 0);
  }
  if (i === 3) {
    F.calendar(ctx, q.x0 + 290, q.labBot + 30, 180, 130, 4, 2, k => live && t > T.pDay(k) + 1.0 ? 'v' : '', k => seg(t, T.pDay(k) + 1.0, T.pDay(k) + 1.25), { col: q.col });
  }
  if (i !== 1) stool(ctx, pos.x, q.fl, s);
  const n = S.ninja.pose(t, Object.assign({ J }, pos));
  if (i === 0 && t >= T.aWreck && t < RS + .3) { n.fx = -1; n.y = q.fl - 6; n.x = q.x0 + 300; }
  const sk = S.ninja.skel(n), hand = W2(n, sk.armF[2]), handB = W2(n, sk.armB[2]), hc = W2(n, sk.hc);
  const gB = W2(n, GB), gN = W2(n, GN);
  // the guitar sits behind the strumming arm
  const holds = i === 0 ? !(t >= T.aFall && t < RS) : i === 3 || (i === 2 && false);
  if (i === 0 && live && t >= T.aFall) {          // broken guitar on the floor
    const u = seg(t, T.aFall, T.aFall + .35); guitar(ctx, [lerp(gB[0], q.x0 + 380, u), lerp(gB[1], q.fl - 40, iC(u))], [0, 0], z * .8, { noNeck: true, snap: 1 });
    ctx.save(); ctx.translate(lerp(gN[0], q.x0 + 120, u), lerp(gN[1], q.fl - 14, iC(u))); ctx.rotate(u * 5); ctx.fillStyle = '#6a3f22'; ctx.fillRect(-60, -7, 120, 14); ctx.restore(); }
  if (holds) guitar(ctx, gB, gN, z * .8, { snap: i === 0 ? seg(t, T.aSnap, T.aSnap + .2) : 0, col: i === 3 ? '#c78bff' : '#d9893a' });
  if (i === 0 && t >= T.aWreck && t < RS) o.face = 'x';
  if (i === 3 && t >= T.POWER && t < RS) o.face = null;
  F.neon(ctx, n, q, Gl, o);
  // ---- in front
  if (i === 0) {
    notes(ctx, gB[0] + 80, gB[1] - 120, t, live && t > T.go && t < T.aSnap ? 1 : 0, t < 5 ? 1 : 0, 0, q.labBot + 60);
    F.bubble(ctx, q.x0 + 330, q.labBot + 120, 'ALL DAY!', seg(t, 1.2, 2.5), { size: 52, rot: .05 });
    if (live && t > T.aSweat && t < T.aFall) F.sweat(ctx, hc, t, 1, 0, z);
    T.aTape.forEach((a, k) => { if (live && t > a && t < T.aFall) { const e = oBack(seg(t, a, a + .2)); ctx.save(); ctx.translate(handB[0] + (k - 1) * 12, handB[1] - 8 + k * 6); ctx.rotate(.5); ctx.scale(e, e); ctx.fillStyle = '#ffe0b0'; F.rr(ctx, -16, -7, 32, 14, 5); ctx.fill(); ctx.restore(); } });
    F.impact(ctx, gB[0] + 30, gB[1] - 20, t, T.aSnap, '#ffffff', z, .4, 8);
    F.impact(ctx, hc[0], q.fl - 40, t, T.aWreck, '#ffffff', z, .4, 8);
    F.bubble(ctx, q.x0 + 330, q.labBot + 120, 'NEVER AGAIN', seg(t, T.aNever, T.aNever + 2), { size: 46, bg: '#ff3b4e', col: '#ffffff', rot: .05 });
    if (live && t > T.aWreck + .3) for (let k = 0; k < 3; k++) { const a = t * 3 + k * TAU / 3; F.sparkle(ctx, hc[0] + 50 * Math.cos(a), hc[1] - 60 + 14 * Math.sin(a), 13, '#ffd23f', .9); }
  }
  if (i === 1) {
    const nc = live ? Array.from({ length: 12 }, (_, k) => k).filter(k => t > T.vCard(k)).length : 0;
    for (let k = 0; k < nc; k++) { const a = T.vCard(k), e = oBack(seg(t, a, a + .25)), top = k === nc - 1 && t < a + .5;
      if (top) card(ctx, D.spot(240), D.top - 200, z * .9 * e, 0, VC[k % 6]);
      else card(ctx, D.spot(250 + (k % 2) * 40), D.top - 20 - k * 22, z * .6, (hash(k) - .5) * .4, VC[k % 6]); }
    if (live && t > T.vSleep + .3) F.zzz(ctx, hc[0] + 20, Math.max(q.labBot + 150, hc[1] - 40), t, 1, z);
  }
  if (i === 2) {
    F.bubble(ctx, q.x0 + 330, q.labBot + 230, 'NOT YET...', seg(t, T.rNot, T.rNot + 1.4), { size: 46, rot: .05 });
    T.rBack.forEach(a => { if (live && t > a && t < a + .8) F.sweat(ctx, hc, t, 1, 0, z); });
    const bl = live ? seg(t, T.rBeard, 12) : 0;                // beard grows
    if (bl > 0) { const chin = W2(n, [sk.hc[0] + 10, sk.hc[1] + 22]), L = Math.min(q.fl - 10 - chin[1], 40 + 360 * bl), sw = 4 * Math.sin(t * 2);
      ctx.save(); ctx.fillStyle = '#eef0ff'; ctx.strokeStyle = '#9aa0bf'; ctx.lineWidth = 3; ctx.beginPath();
      ctx.moveTo(chin[0] - 36, chin[1] - 16); ctx.quadraticCurveTo(chin[0] + 10, chin[1] + 4, chin[0] + 50, chin[1] - 20);
      ctx.lineTo(chin[0] + 46 + 20 * bl + sw, chin[1] + L * .6); ctx.lineTo(chin[0] + 36 + 26 * bl + sw, chin[1] + L);
      for (let j = 1; j <= 4; j++) ctx.lineTo(chin[0] + 36 + 26 * bl + sw - j * (16 + 10 * bl), chin[1] + L - (j % 2 ? 16 : 0));
      ctx.lineTo(chin[0] - 30, chin[1] + L * .5); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
    cobweb(ctx, q.x0 + 20, q.fl, 220, live ? seg(t, T.rFail, T.rFail + 3) : 0, 1);
    if (live && t > T.rFail + .3) F.zzz(ctx, hc[0] + 40, Math.max(q.labBot + 210, hc[1] - 40), t, 1, z);
  }
  if (i === 3) {
    for (let k = 0; k < ND; k++) { const a = T.pDay(k); notes(ctx, gB[0] + 80, gB[1] - 120, t, live && t > a && t < a + 1.0 ? 1 : 0, k >= 2 ? 1 : 0, k * .3, q.labBot + 60);
      if (t > a + 1.0 && t < a + 1.9) F.tick(ctx, hc[0] + 80, hc[1] - 60, seg(t, a + 1.0, a + 1.9), z * .8); }
    notes(ctx, gB[0] + 80, gB[1] - 120, t, live && t > T.pLong ? 1 : 0, 1, .5, q.labBot + 60);
    F.power(ctx, q, n.x + 60, q.fl + 40, t, T.POWER, RS, z);
  }
}
function seek(t) {
  FP.frame(t, {
    glow: glowOf, draw,
    shake: (i, t) => (i === 0 ? shk(t, T.aSnap, .3, 8) + shk(t, T.aWreck, .35, 10) : 0) + (i === 3 ? shk(t, T.POWER, .3, 9) : 0),
    flash: (i, t) => i === 3 ? tri(t, T.POWER, T.POWER + .5) : 0,
  });
}
S.boot({ duration: T.dur, fps: 30, seek, ready: FP.ready });
</script></body></html>
