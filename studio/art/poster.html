<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BS;src:url(../kit/fonts/big-shoulders-display-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:HG;src:url(../kit/fonts/hanken-grotesk-latin-600-normal.woff2);font-weight:600}
html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script src="posters.js"></script>
<script>
(async()=>{const P=new URLSearchParams(location.search);const id=P.get('id'),W=+(P.get('w')||1000),H=W*1.5;const c=document.getElementById('c');c.width=W;c.height=H;
await document.fonts.load('800 40px BS');await document.fonts.load('600 30px HG');const g=c.getContext('2d');
const b=P.get('ball');drawPoster(g,id,W,H,b!=null?{ball:+b}:{});window.DONE=1;})();
</script></body></html>
