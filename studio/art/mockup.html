<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BS;src:url(../kit/fonts/big-shoulders-display-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:PF;src:url(../kit/fonts/playfair-display-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:PFI;src:url(../kit/fonts/playfair-display-latin-400-italic.woff2);font-style:italic;font-weight:400}
@font-face{font-family:HG;src:url(../kit/fonts/hanken-grotesk-latin-600-normal.woff2);font-weight:600}
html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="2000" height="2000"></canvas>
<script src="posters.js"></script>
<script>
// Store mockup: the poster framed on a wall above a sofa. mockup.html?id=net&wall=%23d9d2c5
(async()=>{const P=new URLSearchParams(location.search);const id=P.get('id');const g=document.getElementById('c').getContext('2d');
await document.fonts.load('800 40px BS');await document.fonts.load('600 30px HG');await document.fonts.load('700 40px PF');await document.fonts.load('italic 400 30px PFI');
const wall=P.get('wall')||'#e4ddd1';g.fillStyle=wall;g.fillRect(0,0,2000,2000);
// soft light falloff
let lg=g.createRadialGradient(1000,700,100,1000,800,1400);lg.addColorStop(0,'rgba(255,250,240,.35)');lg.addColorStop(1,'rgba(0,0,0,.25)');g.fillStyle=lg;g.fillRect(0,0,2000,2000);
// floor
g.fillStyle='#8a6a4a';g.fillRect(0,1720,2000,280);g.fillStyle='rgba(0,0,0,.12)';for(let x=0;x<2000;x+=140)g.fillRect(x,1720,4,280);
// frame shadow + frame + mat + poster
const fw=720,fh=1080,fx=(2000-fw)/2,fy=200;
g.save();g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=60;g.shadowOffsetY=30;g.fillStyle='#151515';g.fillRect(fx-34,fy-34,fw+68,fh+68);g.restore();
g.fillStyle='#151515';g.fillRect(fx-34,fy-34,fw+68,fh+68);g.fillStyle='#f6f3ec';g.fillRect(fx-8,fy-8,fw+16,fh+16);
g.save();g.translate(fx,fy);drawPoster(g,id,fw,fh);g.restore();
// glass sheen
const sh=g.createLinearGradient(fx,fy,fx+fw,fy+fh);sh.addColorStop(0,'rgba(255,255,255,.10)');sh.addColorStop(.4,'rgba(255,255,255,0)');g.fillStyle=sh;g.fillRect(fx,fy,fw,fh);
// sofa
g.fillStyle='#3b4a55';g.beginPath();g.roundRect(380,1360,1240,300,60);g.fill();g.fillStyle='#45566a';g.beginPath();g.roundRect(330,1480,1340,240,50);g.fill();
g.fillStyle='#34424c';g.beginPath();g.roundRect(300,1420,150,320,50);g.fill();g.beginPath();g.roundRect(1550,1420,150,320,50);g.fill();
g.fillStyle='#e9b44c';g.beginPath();g.roundRect(520,1390,240,200,40);g.fill();g.fillStyle='#d65a3a';g.beginPath();g.roundRect(1240,1390,240,200,40);g.fill();
g.fillStyle='#2a2a2a';g.fillRect(420,1720,24,60);g.fillRect(1556,1720,24,60);
// plant
g.fillStyle='#c9a27a';g.beginPath();g.moveTo(1760,1560);g.lineTo(1900,1560);g.lineTo(1880,1740);g.lineTo(1780,1740);g.fill();
g.fillStyle='#2f6b3a';for(let i=0;i<9;i++){g.save();g.translate(1830,1560);g.rotate(-1.2+i*.3);g.beginPath();g.ellipse(0,-160,34,170,0,0,7);g.fill();g.restore();}
window.DONE=1;})();
</script></body></html>
