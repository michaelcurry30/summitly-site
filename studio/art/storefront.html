<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BS;src:url(../kit/fonts/big-shoulders-display-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:PF;src:url(../kit/fonts/playfair-display-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:PFI;src:url(../kit/fonts/playfair-display-latin-400-italic.woff2);font-style:italic;font-weight:400}
@font-face{font-family:HG;src:url(../kit/fonts/hanken-grotesk-latin-600-normal.woff2);font-weight:600}
html,body{margin:0;background:transparent}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script src="posters.js"></script>
<script>
// storefront.html?kind=hero|logo|favicon
(async()=>{const P=new URLSearchParams(location.search);const kind=P.get('kind')||'hero';const c=document.getElementById('c');const g=c.getContext('2d');
await document.fonts.load('800 40px BS');await document.fonts.load('600 30px HG');await document.fonts.load('700 40px PF');await document.fonts.load('italic 400 30px PFI');
function frame(id,x,y,w){const h=w*1.5;g.save();g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=50;g.shadowOffsetY=26;g.fillStyle='#0d0d0d';g.fillRect(x-18,y-18,w+36,h+36);g.restore();
 g.fillStyle='#0d0d0d';g.fillRect(x-18,y-18,w+36,h+36);g.fillStyle='#f3efe6';g.fillRect(x-6,y-6,w+12,h+12);g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.translate(x,y);drawPoster(g,id,w,h);g.restore();
 const sh=g.createLinearGradient(x,y,x+w,y+h);sh.addColorStop(0,'rgba(255,255,255,.10)');sh.addColorStop(.45,'rgba(255,255,255,0)');g.fillStyle=sh;g.fillRect(x,y,w,h);}
if(kind==='hero'){c.width=2400;c.height=1200;
 // warm charcoal gallery wall
 g.fillStyle='#1c1916';g.fillRect(0,0,2400,1200);
 for(const [sx] of [[300],[580],[1820],[2100]]){const l=g.createRadialGradient(sx,-80,40,sx,380,760);l.addColorStop(0,'rgba(255,214,150,.42)');l.addColorStop(1,'rgba(255,214,150,0)');g.fillStyle=l;g.fillRect(0,0,2400,1200);}
 // floor line + bench shadow
 g.fillStyle='#120f0d';g.fillRect(0,1080,2400,120);
 frame('city',90,390,250);frame('golden',420,340,290);frame('moon',1690,340,290);frame('net',2060,390,250);
 // darken left-bottom for headline readability
 const v=g.createRadialGradient(1200,600,80,1200,600,620);v.addColorStop(0,'rgba(0,0,0,.45)');v.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=v;g.fillRect(0,0,2400,1200);

}
if(kind==='logo'){c.width=900;c.height=300;
 // drip mark
 const mx=70,my=60;g.fillStyle='#f2b544';g.beginPath();g.roundRect(mx,my,150,150,22);g.fill();
 g.fillStyle='#1c1916';g.beginPath();g.moveTo(mx+30,my+150);g.lineTo(mx+30,my+190);g.arc(mx+45,my+190,15,Math.PI,0,true);g.lineTo(mx+60,my+150);g.fill();
 g.fillStyle='#f2b544';g.beginPath();g.moveTo(mx+88,my+140);g.lineTo(mx+88,my+215);g.arc(mx+103,my+215,15,Math.PI,0,true);g.lineTo(mx+118,my+140);g.fill();
 g.beginPath();g.moveTo(mx+30,my+140);g.lineTo(mx+30,my+190);g.arc(mx+45,my+190,15,Math.PI,0,true);g.lineTo(mx+60,my+140);g.fill();
 g.fillStyle='#1c1916';g.font='800 104px BS';g.textAlign='center';g.textBaseline='middle';g.fillText('W',mx+75,my+80);
 g.textAlign='left';g.fillStyle='#ffffff';g.font='800 112px BS';g.fillText('WALL DROP',260,128);
 g.fillStyle='#f2b544';g.font='italic 400 58px PFI';g.fillText('studio',264,222);
}
if(kind==='favicon'){c.width=512;c.height=512;g.fillStyle='#f2b544';g.beginPath();g.roundRect(0,0,512,512,90);g.fill();
 g.fillStyle='#1c1916';g.font='800 400px BS';g.textAlign='center';g.textBaseline='middle';g.fillText('W',256,240);}
window.DONE=1;})();
</script></body></html>
