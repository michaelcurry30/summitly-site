<!doctype html><html><head><meta charset="utf-8">
<script src="kit/stick.js"></script>
<style>
@font-face{font-family:BS;src:url(kit/fonts/big-shoulders-display-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:HG;src:url(kit/fonts/hanken-grotesk-latin-600-normal.woff2);font-weight:600}
html,body{margin:0;overflow:hidden;background:#0c0418}
canvas{display:block}
</style></head><body><canvas id="c"></canvas>
<script>
/* Habit Dojo "behind the scenes": top = 3D body (frames from f3d/NNNN.jpg), bottom = the ninja doing the same move.
   window.render(t) draws one frame. Timings come from TL (VO line starts). */
const W=1080,H=1920,FPS=30;
const c=document.getElementById('c');c.width=W;c.height=H;const ctx=c.getContext('2d');
const DOJO={ink:'#17785a',ink2:'#11593f',rim:'#ffb36b',tail:'#ff8a2b',belt:'#ff8a2b',scab:'#0d3b2c',band:'#ff8a2b',band2:'#c9661b',mouth:'#0d3b2c',mouthIn:'#05060a'};
const S=Stick;
const TL=JSON.parse(new URLSearchParams(location.search).get('tl')||'{"lines":[[0.3,4.14],[4.59,9.27],[9.72,12.1],[12.55,15.96],[16.41,19.17]],"total":20.52}');
const L=TL.lines;
const P1={y:280,h:780},P2={y:1110,h:770};
function hash(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);}
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const oBack=x=>{const s=1.70158;x=cl(x)-1;return 1+x*x*((s+1)*x+s);};
const ease=x=>{x=cl(x);return 1-Math.pow(1-x,3);};

function city(){const y0=P2.y,y1=P2.y+P2.h;ctx.save();ctx.beginPath();ctx.rect(0,y0,W,P2.h);ctx.clip();
  const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,'#1a0b3a');g.addColorStop(.35,'#6a1f7a');g.addColorStop(.6,'#ff4f8b');g.addColorStop(.75,'#ff9a4a');g.addColorStop(1,'#ffcf6a');ctx.fillStyle=g;ctx.fillRect(0,y0,W,P2.h);
  for(let i=0;i<70;i++){ctx.fillStyle='rgba(255,255,255,'+(0.25+hash(i)*0.5)+')';ctx.fillRect(hash(i*7)*W,y0+hash(i*11)*P2.h*.3,2,2);}
  const G=y0+560;
  // sun
  const sx=W*.5,sy=G-120,r=200;const sg=ctx.createLinearGradient(0,sy-r,0,sy+r);sg.addColorStop(0,'#ffe36b');sg.addColorStop(1,'#ff4f8b');
  ctx.save();ctx.shadowColor='#ff8ab0';ctx.shadowBlur=90;ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.fillStyle='#6a1f7a';for(let i=0;i<6;i++){const yy=sy+r*.15+i*r*.14;ctx.globalAlpha=.85;ctx.fillRect(sx-r,yy,r*2,r*.035+i*r*.01);}ctx.globalAlpha=1;
  const sky=(base,sc,col,seed,dens,HM)=>{ctx.fillStyle=col;let x=-20,i=0;while(x<W+20){const w=(40+hash(seed+i)*90)*sc,h=(60+hash(seed+i*3)*HM)*sc;ctx.fillRect(x,base-h,w,h+2);
    if(dens){ctx.fillStyle='rgba(255,207,106,.55)';for(let k=0;k<dens;k++){if(hash(seed+i*13+k)>.55)ctx.fillRect(x+6+hash(k+i)*(w-14),base-h+12+hash(k*7+i)*(h-30),5,7);}ctx.fillStyle=col;}
    x+=w+4*sc;i++;}};
  sky(G-30,.9,'#4a1a5c',1,0,170);sky(G,1,'#2a0c42',50,8,150);
  ctx.fillStyle='#0c0418';ctx.fillRect(0,G,W,y1-G);
  ctx.fillStyle='#3ee6ff';ctx.globalAlpha=.7;ctx.fillRect(0,G,W,4);ctx.globalAlpha=1;
  const gr=ctx.createLinearGradient(0,G,0,y1);gr.addColorStop(0,'rgba(255,79,139,.3)');gr.addColorStop(1,'rgba(255,79,139,0)');ctx.fillStyle=gr;ctx.fillRect(0,G+4,W,y1-G);
  // perspective grid on the floor
  ctx.strokeStyle='rgba(62,230,255,.25)';ctx.lineWidth=2;for(let i=-8;i<=8;i++){ctx.beginPath();ctx.moveTo(W/2+i*40,G+4);ctx.lineTo(W/2+i*260,y1);ctx.stroke();}
  for(let k=1;k<5;k++){const yy=G+4+(y1-G)*Math.pow(k/5,1.6);ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke();}
  ctx.restore();return G;}

function frame(y,h,on,col){ctx.save();ctx.lineWidth=6;ctx.strokeStyle=col;ctx.globalAlpha=.35+.65*on;ctx.shadowColor=col;ctx.shadowBlur=30*on;
  ctx.beginPath();ctx.roundRect(14,y+3,W-28,h-6,22);ctx.stroke();ctx.restore();}
function chip(txt,x,y,k,bg,fg,size){if(k<=0)return;const s=oBack(k);ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=cl(k*3);
  ctx.font=`800 ${size}px BS`;ctx.letterSpacing=(size*.04)+'px';const w=ctx.measureText(txt).width+size*1.1,hh=size*1.45;
  ctx.fillStyle=bg;ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=18;ctx.beginPath();ctx.roundRect(-w/2,-hh/2,w,hh,hh/2);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,0,size*.06);ctx.restore();}
function header(t){ctx.save();ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.font='800 104px BS';ctx.letterSpacing='2px';
  const k1=1,k2=1;
  ctx.globalAlpha=cl(k1*2);ctx.fillStyle='#ffffff';ctx.fillText('HOW I ANIMATE A NINJA',W/2,130-20*(1-k1));
  ctx.globalAlpha=cl(k2*2);ctx.shadowColor='#3ee6ff';ctx.shadowBlur=26;ctx.fillStyle='#3ee6ff';ctx.fillText('WITHOUT DRAWING A FRAME',W/2,240-20*(1-k2));ctx.restore();}

const imgs={};function img(i){const n=String(Math.min(i,TL.nframes||9999)).padStart(4,'0');if(!imgs[n]){const im=new Image();im.src='f3d/'+n+'.jpg';imgs[n]=im;}return imgs[n];}
async function loadImg(i){const im=img(i);if(!im.complete||!im.naturalWidth)await new Promise(r=>{im.onload=r;im.onerror=r;});return im;}

window.render=async function(t){const fi=Math.round(t*FPS);
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#0c0418';ctx.fillRect(0,0,W,H);
  header(t);
  // panel 1: the 3D body
  const im=await loadImg(fi);ctx.save();ctx.beginPath();ctx.roundRect(14,P1.y+3,W-28,P1.h-6,22);ctx.clip();if(im.naturalWidth)ctx.drawImage(im,0,P1.y);ctx.restore();
  // panel 2: neon city + ninja doing the same push-up (3D period 2.4 s; ninja pushup cycle is 0.9 in u)
  const G=city();
  const u=((t%2.4)/2.4)*.9;
  const J=S.ninja.timeline([[0,'pushup',{}]]);S.ninja.draw(ctx,S.ninja.pose(u,{J:J(u),pal:DOJO,x:W*.5+170,y:G+150,s:1.4}));
  // which panel is "live"
  const a1=t>=L[1][0]&&t<L[2][0]?1:t>=L[3][0]?.6:.25, a2=t>=L[2][0]&&t<L[3][0]?1:t>=L[3][0]?.6:.25;
  frame(P1.y,P1.h,a1,'#b49cff');frame(P2.y,P2.h,a2,'#3ee6ff');
  if(t<L[3][0])chip('1 · A 3D BODY DOES THE MOVE',W/2,P1.y+70,(t-L[1][0])/.3,'#b49cff','#12061f',52);
  if(t<L[3][0])chip('2 · THE SAME MOVE GOES ON MY NINJA',W/2,P2.y+70,(t-L[2][0])/.3,'#3ee6ff','#12061f',52);
  // centre caption between the panels
  const mid=(P1.y+P1.h+P2.y)/2;
  if(t<L[4][0]-0.05){chip('SAME MOTION. NEW CHARACTER.',W/2,mid,(t-L[3][0])/.3,'#ffffff','#12061f',60);}
  else{chip('LEARN HOW · LINK IN BIO',W/2,mid,(t-L[4][0])/.3,'#ff8a2b','#12061f',72);}
  // tiny brand
  ctx.save();ctx.font='600 30px HG';ctx.letterSpacing='8px';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillText('HABIT DOJO',W/2,1910-4);ctx.restore();
};
(async()=>{await document.fonts.load('800 100px BS');await document.fonts.load('600 40px HG');window.READY=true;})();
</script></body></html>
