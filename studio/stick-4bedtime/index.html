    shake: (i, t) => (i === 0 ? shk(t, T.eFail + .45, .3, 8) : 0) + (i === 1 ? shk(t, T.fFail, .3, 9) : 0) + (i === 2 ? shk(t, T.gSlam + .05, .35, 10) : 0) + (i === 3 ? shk(t, T.POWER, .3, 9) : 0),
    flash: (i, t) => i === 3 ? tri(t, T.POWER, T.POWER + .5) : 0,
  });
}
S.boot({ duration: T.dur, fps: 30, seek, ready: FP.ready });
