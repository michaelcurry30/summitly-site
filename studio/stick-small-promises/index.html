<!doctype html>
<html><head><meta charset="utf-8"><title>Keep Small Promises</title>
<script src="variant.js"></script>
<script src="kit/stick.js"></script>
</head>
<body><div id="stage"></div>
<script>
// STICK NINJA — "KEEP SMALL PROMISES" (planner channel). Short (≈15.95 s). Built from gen_short.py template. Ending: lesson + FOLLOW FOR MORE (no planner card).
const EC0 = 14.4, DUR = 15.95;
const A = {"hook": 0, "prob": 3.43, "roof": 6.45, "fix": 7.75, "pay": 11.88};
const K = {"TH": 7.35, "land": 6.58, "EC0": 14.4, "DUR": 15.95, "h1": 1.7, "pk": 5.63, "f1": 8.25, "f2": 9.95};
const SCENES = { hook: [0, A.prob], prob: [A.prob, A.roof], roof: [A.roof, A.fix], fix: [A.fix, A.pay], pay: [A.pay, DUR] };
const S = Stick, { seg, oC, io, oBack, lerp, clamp, tri, hash } = S;
const stage = S.stage();
const E = { e1: S.env(stage, 'bedroom'), e2: S.env(stage, 'hall'), roof: S.env(stage, 'rooftop'), e4: S.env(stage, 'library', { day: true }), mtn: S.env(stage, 'mountain') };
const W = S.world(stage);
const hookH = S.kin(stage, '<div data-max="130">“I’LL START MONDAY.”</div><div data-max="140">THEN MONDAY <i class="pk">COMES.</i></div>', { top: 262 });
const probH = S.kin(stage, '<div data-max="130">BREAK ENOUGH PROMISES,</div><div data-max="130">YOU STOP <i class="pk">TRUSTING</i> <i class="pk">YOURSELF.</i></div>', { top: 262 });
const ninH = S.kin(stage, '<div data-max="190"><i class="cy">ENOUGH.</i></div>', { top: 262 });
const fixH = S.kin(stage, '<div data-max="130">ONE SMALL PROMISE TODAY.</div><div data-max="140"><i class="cy">KEEP</i> <i class="cy">IT.</i> THEN ANOTHER.</div>', { top: 262 });
const pay1 = S.kin(stage, '<div data-max="140">DISCIPLINE IS KEEPING</div>', { top: 290 });
const pay2 = S.kin(stage, '<div data-max="160"><i class="or">SMALL</i> <i class="or">PROMISES.</i></div>', { top: 450 });
const follow = S.chip(stage, 'FOLLOW FOR <b>MORE</b>', { top: 640, cls: 'dark', size: 48 });
S.safeGuide(stage);
const D = S.ninja.draw, nin = (t, J, o) => S.ninja.pose(t, Object.assign({ J }, o));
const sk = n => S.ninja.skel(n), W2 = (n, p) => S.ninja.toWorld(n, p), hand = n => W2(n, sk(n).armF[2]);
function glow(ctx, x, y, r, col, k) {
  if (k <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col.replace('A', (.5 * k).toFixed(3))); g.addColorStop(1, col.replace('A', '0'));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
const EW = { color: '#ff9ec7', color2: '#ff6fae', side: '#6a1736', depth: 16 };
const HA = -64, TS = K.TH - S.ninja.SLASH.uAt(HA);
const roofTr = S.track([[A.roof, 160, 1500, 1.2, 0], [K.land, 200, 1500, 1.2, 0], [TS - .02, 200, 1500, 1.2, 0], [TS + .62, 640, 1500, 1.2, 260], [99, 640, 1500, 1.2, 0]]);
const roofTL = S.ninja.timeline([[A.roof, 'jump', { ph: .5 }], [K.land, 'crouch', {}, .1], [TS, 'slash', {}, .08], [TS + 1.25, 'ready', {}, .25]]);
const hitN = nin(K.TH, roofTL(K.TH), roofTr(K.TH)), RC = S.ninja.reach(hitN);
const WC = S.wordcut(Object.assign({ text: 'EXCUSES', x: RC.cx + RC.R * Math.cos(HA * Math.PI / 180), y: RC.cy + RC.R * Math.sin(HA * Math.PI / 180), size: 150, angle: HA + 90, seed: 7 }, EW));
const payTL = S.ninja.timeline([[A.pay, 'walk'], [A.pay + .5, 'idle', {}, .2], [A.pay + .6, 'flourish', { aim: -8 }, .1], [12.63 + .4, 'proud', {}, .25], [EC0, 'wave', {}, .2]]);
const payTr = S.track([[A.pay, 250, 1500, 1.15, 0], [A.pay + .5, 470, 1500, 1.15, 0]]);

function xmark(ctx, x, y, r, p) { if (p <= 0) return; ctx.save(); ctx.strokeStyle = '#ff4f8b'; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.beginPath();
  const a = Math.min(1, p * 2), b = Math.max(0, p * 2 - 1); ctx.moveTo(x - r, y - r); ctx.lineTo(x - r + 2 * r * a, y - r + 2 * r * a);
  if (b > 0) { ctx.moveTo(x + r, y - r); ctx.lineTo(x + r - 2 * r * b, y - r + 2 * r * b); } ctx.stroke(); ctx.restore(); }
const hookTL = S.ninja.timeline([[0, 'point', { ang: -30 }], [1.0, 'proud', {}, .15], [K.h1, 'hide', { face: 'x' }, .15]]);
function drawHook(ctx, t) { S.calPage(ctx, 800, 1060 + 30 * oC(seg(t, K.h1 - .2, K.h1)), .6 * oBack(seg(t, .3, .6), 2), 'MON', { rot: 6 });
  D(ctx, nin(t, hookTL(t), { x: 440, y: 1500, s: 1 })); }
const probTL = S.ninja.timeline([[A.prob, 'shrug'], [A.prob + 1.0, 'slump', {}, .2], [K.pk, 'facepalm', {}, .12]]);
function drawProb(ctx, t) { ['MON', 'TUE', 'WED'].forEach((w, i) => { const a = A.prob + .2 + i * .5, k = oBack(seg(t, a, a + .2), 2); if (k <= 0) return;
    const x = 640 + i * 140, y = 1040 + (i % 2) * 90; S.calPage(ctx, x, y, .45 * k, w, { rot: (i - 1) * 6, col: '#ff6fae' }); xmark(ctx, x, y + 10, 48, seg(t, a + .2, a + .45)); });
  D(ctx, nin(t, probTL(t), { x: 330, y: 1500, s: 1 })); }
const fixTL = S.ninja.timeline([[A.fix, 'point', { ang: -30 }], [K.f1 + .6, 'pump', {}, .12], [K.f2 + .2, 'cheer', {}, .12]]);
function drawFix(ctx, t) { glow(ctx, 800, 1150, 260, 'rgba(62,230,255,A)', .3 + .4 * seg(t, K.f1, K.f2));
  [0, 1].forEach(i => { const a = K.f1 + i * .9, k = oBack(seg(t, a, a + .25), 2); if (k <= 0) return; const x = 700 + i * 170, y = 1060 + i * 40;
    S.note(ctx, x, y, .55 * k, (i ? 6 : -6), '', { col: '#ffe36b' }); S.check(ctx, x, y, .45, seg(t, a + .4, a + .7)); });
  D(ctx, nin(t, fixTL(t), { x: 420, y: 1500, s: 1 }));
  S.sparks(ctx, t, K.f2, 860, 1060, { n: 12, seed: 14, speed: 500, dir: -Math.PI / 2, spread: 2.4, life: .4, g: 900 }); }

const span = (k, a, b) => seg(k, a, b);
const SC = [
  { a: 0, b: A.prob, env: E.e1, envOpt: () => ({ lamp: .6 }), cam: t => ({ x: lerp(560, 620, seg(t, 0, A.prob)), y: 1150, z: lerp(1.3, 1.42, io(seg(t, 0, A.prob))) + .03 * tri(t, K.h1, K.h1 + .3) }), draw: drawHook },
  { a: A.prob, b: A.roof, env: E.e2, whip: 'left', envOpt: () => ({}), cam: t => ({ x: lerp(540, 600, seg(t, A.prob, A.roof)), y: 1120, z: lerp(1.18, 1.28, io(seg(t, A.prob, A.roof))) + .04 * tri(t, K.pk, K.pk + .3), r: -1.5 }), draw: drawProb },
  { a: A.roof, b: A.fix, env: E.roof, whip: 'up', cam: t => { const push = io(seg(t, A.roof + .1, K.TH)) * .07, punch = .05 * tri(t, K.TH, K.TH + .25);
      return { x: lerp(545, 575, seg(t, A.roof, A.fix)), y: lerp(900, 880, seg(t, A.roof, A.fix)), z: 1.2 + push + punch }; },
    draw(ctx, t) { WC.draw(ctx, t, { in: A.roof + .05, mode: 'drop', h: 240, cut: K.TH, wob: .6, kick: 1.2, fadeAt: A.fix - .1 }); D(ctx, nin(t, roofTL(t), Object.assign({ ground: 1500 }, roofTr(t)))); } },
  { a: A.fix, b: A.pay, env: E.e4, whip: 'left', envOpt: () => ({}), cam: t => ({ x: lerp(560, 620, seg(t, A.fix, A.pay)), y: 1120, z: lerp(1.25, 1.33, io(seg(t, A.fix, A.pay))) + .03 * tri(t, K.f2, K.f2 + .3) }), draw: drawFix },
  { a: A.pay, b: DUR + 1, env: E.mtn, whip: 'left', cam: t => ({ x: 540, y: lerp(960, 985, seg(t, A.pay, DUR)), z: lerp(1.16, 1.24, io(seg(t, A.pay, DUR))) + .03 * tri(t, 12.63, 12.63 + .3) }),
    envOpt: t => ({ rise: .3 + .6 * io(seg(t, A.pay, EC0 - .2)) }),
    draw(ctx, t) { D(ctx, nin(t, payTL(t), Object.assign({ vx: t < A.pay + .5 ? 300 : 0 }, payTr(t)))); S.sparks(ctx, t, 12.63, 470, 1000, { n: 14, seed: 9, speed: 700, dir: -Math.PI / 2, spread: 2.6, life: .5, g: 900 }); } },
];
function seek(t) {
  const sh = WC.shake(t, K.TH), imp = (a, amp) => t >= a && t < a + .22 ? Math.round(amp * (1 - (t - a) / .22) * Math.sin(t * 120)) : 0;
  W.seek(t, SC, { shake: [sh[0], sh[1] + imp(K.pk, 6) + imp(K.f2, 4)], flash: WC.flash(t, K.TH), flashColor: '#ff6fae' });
  S.kinShow(hookH, t, 0, A.prob - .15, { hold0: true, beats: [0, 0, 0, 2.08, 2.41, 2.73] });
  S.kinShow(probH, t, 3.55, A.roof - .3, { beats: [3.55, 3.92, 4.3, 4.67, 5.05, 5.42, 5.8] });
  S.kinShow(ninH, t, 6.67, K.TH + -0.1, { beats: [6.67], style: 'slam' });
  S.kinShow(fixH, t, 7.97, A.pay - .15, { beats: [7.97, 8.41, 8.86, 9.3, 9.75, 10.19, 10.64, 11.08] });
  S.kinShow(pay1, t, 12.10, DUR + 1, { beats: [12.1, 12.21, 12.33], style: 'slam' });
  S.kinShow(pay2, t, 12.63, DUR + 1, { beats: [12.63, 12.93], style: 'slam' });
  S.show(follow, t, EC0, DUR + 1, { pop: true });
  S.hideInvisible(stage);
}
S.boot({ duration: DUR, fps: 30, seek });
</script></body></html>
