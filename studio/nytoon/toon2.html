<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BS;src:url(../kit/fonts/big-shoulders-display-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:HG;src:url(../kit/fonts/hanken-grotesk-latin-600-normal.woff2);font-weight:600}
html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// NAH-YOU TOONS v2: our own simple character (round head, bean body in a Nah-You tee, thin stick limbs),
// warm spotlit rooms, X-ray / meter / evidence-board cutaways, one word on screen at a time.
const C=document.getElementById('c'),g=C.getContext('2d');const W=1080,H=1920;
const NY_W='#f2efe6',NY_G='#7ee35a',INK='#1a1410';
let TL=null;const EP=new URLSearchParams(location.search).get('ep')||'nv01';
const ss=(a,b,v)=>{const x=Math.min(1,Math.max(0,(v-a)/(b-a)));return x*x*(3-2*x)};const lerp=(a,b,u)=>a+(b-a)*u;
const R=(s=>()=>(s=(s*16807)%2147483647)/2147483647);
function drip(txt,x,y,size,col,seed=1,n=8){g.save();g.font=`800 ${size}px BS`;g.textAlign='center';g.textBaseline='alphabetic';const w=g.measureText(txt).width;g.fillStyle=col;g.fillText(txt,x,y);
  const r=R(seed*997);g.strokeStyle=col;g.lineCap='round';for(let i=0;i<n;i++){const dx=x-w/2+w*(.06+.88*r()),len=size*(.12+.42*r()),lw=Math.max(2,size*.07);g.lineWidth=lw;g.beginPath();g.moveTo(dx,y-size*.08);g.lineTo(dx,y+len);g.stroke();g.beginPath();g.arc(dx,y+len,lw*.75,0,7);g.fill();}g.restore();}
function printArt(kind,cx,cy,w){if(!kind)return;const s=w/300;g.save();g.translate(cx,cy);g.scale(s,s);
  if(kind==='talkless'){drip('TALK LESS',0,-10,62,NY_W,7,7);drip('BALL MORE',0,62,62,NY_G,9,7);}
  else if(kind==='next'){drip("YOU'RE",0,-20,60,NY_W,3,6);drip('NEXT',0,62,92,NY_G,5,7);}
  else if(kind==='built'){drip('BUILT',0,-10,70,NY_W,11,6);drip('DIFFERENT',0,58,52,NY_W,13,7);}
  else if(kind==='mark'){drip('NAH-YOU',0,30,86,NY_W,21,7);}
  g.restore();}
function cam(z,cx,cy){g.translate(W/2,H/2);g.scale(z,z);g.translate(-cx,-cy);}
const LN=i=>TL.lines[i];
const sh=i=>{const a=i?LN(i).s-.09:-1,b=i<TL.lines.length-1?LN(i+1).s-.09:1e9;return T0>=a&&T0<b;};let T0=0;
function talkAmt(i,t){const L=LN(i);if(t<L.s||t>L.e)return 0;return .3+.4*Math.abs(Math.sin(t*18))+.2*Math.abs(Math.sin(t*6.7));}
function blinkAt(t,seed=0){const p=(t+seed)%3.4;return p<.13?Math.sin(p/.13*Math.PI):0;}

// ---------------- character ----------------
// origin = between the feet. head r=118 centred at y=-600. o:{skin,hair,shirt,print,face,talk,blink,armL,armR,pose,xray,look,bob}
const KEV={skin:'#c98d62',hair:'curly',hairCol:'#231812',shirt:'#2f8f5b',print:null};
const CAST={
 DRE:{skin:'#8a5534',hair:'twists',hairCol:'#1a120c',shirt:'#2d6cdf',print:null},
 JAY:{skin:'#5e3a24',hair:'buzz',hairCol:'#120c08',shirt:'#e07b24',print:null},
 KEV:KEV,
 RIO:{skin:'#e8c09a',hair:'messy',hairCol:'#15151c',shirt:'#7d4cc2',print:null},
 TASHA:{skin:'#7b4a2c',hair:'braids',hairCol:'#1a110b',shirt:'#d94f8a',print:null}};
function lineup(t){g.fillStyle='#222';g.fillRect(0,0,W,H);spot(540,900,800,.4);const n=Object.keys(CAST);n.forEach((k,i)=>{const x=110+i*215;kev(x,i%2?1650:1000,.55,{...CAST[k],face:['calm','smug','grin','shock','calm'][i]},t);g.fillStyle='#fff';g.font='800 50px BS';g.textAlign='center';g.fillText(k,x,(i%2?1650:1000)+70);});}
function limb(pts,w,col){g.save();g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(const p of pts.slice(1))g.lineTo(p[0],p[1]);g.stroke();g.restore();}
function arm(sx,sy,a1,a2,len,side,o){ // a1 shoulder angle from straight-down, a2 elbow bend
  const ex=sx+Math.sin(a1)*len*side,ey=sy+Math.cos(a1)*len,hx=ex+Math.sin(a1+a2)*len*side,hy=ey+Math.cos(a1+a2)*len;
  if(o.xray){limb([[sx,sy],[ex,ey],[hx,hy]],22,'rgba(140,205,255,.55)');return;}
  limb([[sx,sy],[ex,ey],[hx,hy]],20,INK);g.fillStyle=o.skin;g.strokeStyle=INK;g.lineWidth=6;g.beginPath();g.arc(hx,hy,19,0,7);g.fill();g.stroke();}
function face(o,t){const f=o.face||'calm',bl=o.blink||0,lx=(o.look||0)*14;g.save();g.translate(lx,0);g.strokeStyle=INK;g.fillStyle=INK;g.lineCap='round';
  const brow=(x,y,a,len=46)=>{g.lineWidth=13;g.beginPath();g.moveTo(x-len/2*Math.cos(a),y-len/2*Math.sin(a));g.lineTo(x+len/2*Math.cos(a),y+len/2*Math.sin(a));g.stroke();};
  if(f==='sleep'){g.lineWidth=9;for(const s of[-1,1]){g.beginPath();g.arc(s*44,-612,20,.15*Math.PI,.85*Math.PI);g.stroke();}g.lineWidth=7;g.beginPath();g.arc(0,-548,13,.1*Math.PI,.9*Math.PI);g.stroke();}
  else if(f==='shock'){g.lineWidth=8;for(const s of[-1,1]){g.fillStyle='#fff';g.beginPath();g.arc(s*44,-612,30,0,7);g.fill();g.stroke();g.fillStyle=INK;g.beginPath();g.arc(s*44,-610,10,0,7);g.fill();}
    brow(-46,-668,-.25,40);brow(46,-668,.25,40);g.lineWidth=8;g.beginPath();g.moveTo(-34,-540);for(let i=0;i<=6;i++)g.lineTo(-34+i*11.3,-540+(i%2?-9:9));g.stroke();}
  else if(f==='grin'){g.beginPath();g.ellipse(-44,-612,13,20,0,0,7);g.ellipse(44,-612,13,20,0,0,7);g.fill();g.fillStyle='#fff';g.lineWidth=8;g.beginPath();g.moveTo(-62,-562);g.quadraticCurveTo(0,-485,62,-562);g.closePath();g.fill();g.stroke();
    g.lineWidth=4;for(const x of[-28,-9,10,29]){g.beginPath();g.moveTo(x,-560);g.lineTo(x,-540);g.stroke();}}
  else{ // calm / smug / tired (half-lidded eyes + heavy brows)
    const smug=f==='smug',tired=f==='tired';const open=Math.max(.08,(smug?.55:tired?.35:1)*(1-bl));
    for(const s of[-1,1]){g.save();g.beginPath();g.ellipse(s*44,-610,15,22*open,0,0,7);g.fill();g.restore();}
    if(smug){brow(-44,-650,.12);brow(44,-660,-.32);}else if(tired){brow(-44,-646,.2);brow(44,-646,-.2);}else{brow(-44,-654,-.06);brow(44,-654,.06);}
    const ta=o.talk||0;g.lineWidth=8;if(ta>.05){g.fillStyle='#3a1414';g.beginPath();g.ellipse(smug?8:0,-548,22,8+22*ta,0,0,7);g.fill();g.stroke();}
    else{g.beginPath();if(smug){g.moveTo(-14,-546);g.quadraticCurveTo(14,-542,30,-560);}else{g.moveTo(-20,-548);g.lineTo(20,-548);}g.stroke();}}
  g.restore();}
function hair(o){const k=o.hair||'curly';g.save();g.fillStyle=o.hairCol;g.strokeStyle=INK;g.lineWidth=7;
  if(k==='curly'){const pts=[[-112,-640,40],[-92,-690,44],[-55,-722,46],[-10,-736,46],[38,-728,46],[80,-702,44],[108,-660,38]];
    g.beginPath();for(const [x,y,r] of pts){g.moveTo(x+r,y);g.arc(x,y,r,0,7);}g.fill();g.beginPath();g.arc(0,-600,118,Math.PI*1.08,Math.PI*1.92);g.lineTo(108,-640);g.fill();
    g.beginPath();for(const [x,y,r] of pts){g.moveTo(x+r,y);g.arc(x,y,r,Math.PI*0.95,Math.PI*2.05);}g.stroke();}
  else if(k==='buzz'){g.beginPath();g.arc(0,-600,121,Math.PI*1.06,Math.PI*1.94);g.quadraticCurveTo(0,-668,-116,-628);g.closePath();g.fill();g.stroke();}
  else if(k==='twists'){g.beginPath();g.arc(0,-600,124,Math.PI*1.04,Math.PI*1.96);g.quadraticCurveTo(0,-660,-118,-632);g.closePath();g.fill();g.stroke();
    g.lineCap='round';for(let i=-5;i<=5;i++){const x=i*21,top=-722+Math.abs(i)*i*i*.35+Math.abs(i)*6;g.lineWidth=22;g.strokeStyle=INK;g.beginPath();g.moveTo(x,-660);g.lineTo(x*1.08,top-22);g.stroke();g.lineWidth=14;g.strokeStyle=o.hairCol;g.beginPath();g.moveTo(x,-660);g.lineTo(x*1.08,top-22);g.stroke();}}
  else if(k==='messy'){g.beginPath();g.moveTo(-124,-610);const sp=[[-130,-690],[-90,-700],[-80,-760],[-30,-725],[0,-780],[30,-728],[80,-765],[90,-700],[132,-690],[124,-610]];
    for(const [x,y] of sp)g.lineTo(x,y);g.quadraticCurveTo(40,-650,-20,-680);g.quadraticCurveTo(-60,-640,-124,-610);g.closePath();g.fill();g.stroke();}
  else if(k==='braids'){g.beginPath();g.arc(0,-600,124,Math.PI*1.02,Math.PI*1.98);g.quadraticCurveTo(10,-670,-122,-620);g.closePath();g.fill();g.stroke();
    for(const sx of[-1,1]){for(let j=0;j<7;j++){g.beginPath();g.ellipse(sx*(118+j*2),-600+j*42,22,26,0,0,7);g.fill();g.stroke();}
      g.strokeStyle='#e9c25a';g.lineWidth=7;g.beginPath();g.arc(sx*112,-540,20,0,7);g.stroke();g.strokeStyle=INK;g.lineWidth=7;}}
  g.restore();}
function kev(x,y,s,o,t=0){o={...KEV,...o};g.save();g.translate(x,y+(o.bob||0));g.scale(s,s);
  const sit=o.pose==='sit';const hipY=-170;
  // legs
  if(o.legs!==false){const L=sit?[[[-38,hipY],[-110,hipY+40],[-100,0]],[[38,hipY],[110,hipY+40],[100,0]]]:[[[-36,hipY],[-46,-85],[-52,0]],[[36,hipY],[46,-85],[52,0]]];
    for(const l of L){limb(l,o.xray?22:20,o.xray?'rgba(140,205,255,.55)':INK);if(!o.xray)limb([l[2],[l[2][0]+(l[2][0]<0?-26:26),l[2][1]]],22,INK);}}
  // body (bean)
  g.save();g.beginPath();g.moveTo(-82,-470);g.bezierCurveTo(-112,-380,-104,-210,-70,-160);g.quadraticCurveTo(0,-128,70,-160);g.bezierCurveTo(104,-210,112,-380,82,-470);g.quadraticCurveTo(0,-500,-82,-470);
  if(o.xray){g.fillStyle='rgba(110,180,255,.28)';g.fill();g.strokeStyle='#9fd8ff';g.lineWidth=9;g.stroke();}
  else{g.fillStyle=o.shirt;g.fill();g.strokeStyle=INK;g.lineWidth=9;g.stroke();g.clip();
    const sh=g.createLinearGradient(-110,0,110,0);sh.addColorStop(0,'rgba(255,255,255,.08)');sh.addColorStop(.5,'rgba(255,255,255,0)');sh.addColorStop(1,'rgba(0,0,0,.25)');g.fillStyle=sh;g.fillRect(-120,-520,240,400);
    printArt(o.print,0,-340,150);}
  g.restore();
  const a=o.armL||[.25,.15],b=o.armR||[.25,.15];arm(-84,-440,a[0],a[1],118,-1,o);arm(84,-440,b[0],b[1],118,1,o);
  // neck + head
  g.save();g.translate(0,0);if(o.tilt){g.translate(0,-600);g.rotate(o.tilt);g.translate(0,600);}
  if(o.xray){g.beginPath();g.arc(0,-600,118,0,7);g.fillStyle='rgba(110,180,255,.28)';g.fill();g.strokeStyle='#9fd8ff';g.lineWidth=9;g.stroke();brain(0,-625,1,t,o.glow||0);
    // glowing nerve down the spine
    g.save();g.strokeStyle=`rgba(255,226,120,${.55+.35*Math.sin(t*6)})`;g.lineWidth=9;g.shadowColor='#ffd76a';g.shadowBlur=24;g.beginPath();g.moveTo(10,-560);g.lineTo(0,-470);g.lineTo(-6,-180);g.stroke();g.restore();}
  else{const hg=g.createRadialGradient(-40,-650,20,0,-600,130);hg.addColorStop(0,'#fff1dc');hg.addColorStop(.25,o.skin);hg.addColorStop(1,o.skin);
    g.beginPath();g.arc(0,-600,118,0,7);g.fillStyle=o.skin;g.fill();g.fillStyle='rgba(255,240,220,.18)';g.beginPath();g.arc(-30,-630,70,0,7);g.fill();g.beginPath();g.arc(0,-600,118,0,7);g.strokeStyle=INK;g.lineWidth=9;g.stroke();
    face(o,t);hair(o);}
  g.restore();g.restore();}
function brain(x,y,s,t,glow){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#e98fb0';g.strokeStyle='#7a2f4c';g.lineWidth=6;
  g.beginPath();const lobes=[[-48,-6,40],[-20,-30,40],[18,-30,40],[48,-6,38],[30,22,36],[-6,26,38],[-38,20,34]];for(const [a,b,r] of lobes){g.moveTo(a+r,b);g.arc(a,b,r,0,7);}g.fill();
  g.beginPath();for(const [a,b,r] of lobes){g.moveTo(a+r*.6,b);g.arc(a,b,r*.6,0,Math.PI*1.4);}g.stroke();
  if(glow>0){g.save();g.globalAlpha=glow;g.shadowColor='#ffe27a';g.shadowBlur=40;g.fillStyle='#fff6c8';g.beginPath();g.arc(0,8,22,0,7);g.fill();g.restore();
    g.save();g.globalAlpha=glow;g.strokeStyle='#5a3b00';g.lineWidth=4;g.beginPath();g.arc(0,8,16,0,7);g.stroke();const a=t*2.2;g.beginPath();g.moveTo(0,8);g.lineTo(Math.sin(a)*12,8-Math.cos(a)*12);g.moveTo(0,8);g.lineTo(Math.sin(a/12)*8,8-Math.cos(a/12)*8);g.stroke();g.restore();}
  g.restore();}

// ---------------- places ----------------
function spot(cx,cy,r,a=.55){const sg=g.createRadialGradient(cx,cy,10,cx,cy,r);sg.addColorStop(0,`rgba(255,214,150,${a})`);sg.addColorStop(1,'rgba(255,214,150,0)');g.fillStyle=sg;g.fillRect(cx-r,cy-r,2*r,2*r);}
function vignette(a=.7){const vg=g.createRadialGradient(W/2,H*.48,H*.25,W/2,H*.5,H*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,`rgba(0,0,0,${a})`);g.fillStyle=vg;g.fillRect(0,0,W,H);}
function bedroom(t,clock){ // dark green walls, wood floor with a ringed rug, lamp spotlight, moon window, nightstand clock
  const wg=g.createLinearGradient(0,0,0,1000);wg.addColorStop(0,'#141b19');wg.addColorStop(1,'#24302b');g.fillStyle='#141b19';g.fillRect(-600,-800,W+1200,900);g.fillStyle=wg;g.fillRect(-600,0,W+1200,1000);
  g.save();g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=5;for(let x=-60;x<W;x+=200)g.strokeRect(x+30,280,150,560);g.restore();
  g.fillStyle='#3b2817';g.fillRect(-600,990,W+1200,H);g.save();g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=4;for(let i=0;i<14;i++){const y=990+i*i*6;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}g.restore();
  g.fillStyle='#1a120b';g.fillRect(0,976,W,22);
  // ringed rug
  g.save();g.translate(540,1420);g.scale(1,.32);for(let i=7;i>=0;i--){g.fillStyle=i%2?'#c89660':'#4a2c18';g.beginPath();g.arc(0,0,90+i*80,0,7);g.fill();}g.restore();
  // window with moon
  g.save();g.translate(150,430);g.fillStyle='#0b1424';g.fillRect(-90,-130,180,260);const mg=g.createRadialGradient(30,-50,5,30,-50,90);mg.addColorStop(0,'rgba(220,230,255,.5)');mg.addColorStop(1,'rgba(220,230,255,0)');g.fillStyle=mg;g.fillRect(-90,-130,180,260);
  g.fillStyle='#e9eef8';g.beginPath();g.arc(30,-50,30,0,7);g.fill();g.fillStyle='#0b1424';g.beginPath();g.arc(44,-60,26,0,7);g.fill();g.strokeStyle='#5b3b22';g.lineWidth=14;g.strokeRect(-90,-130,180,260);g.beginPath();g.moveTo(0,-130);g.lineTo(0,130);g.moveTo(-90,0);g.lineTo(90,0);g.lineWidth=8;g.stroke();g.restore();
  // hanging bulb
  g.strokeStyle='#111';g.lineWidth=4;g.beginPath();g.moveTo(540,-800);g.lineTo(540,150);g.stroke();g.fillStyle='#ffe9b0';g.shadowColor='#ffd27a';g.shadowBlur=60;g.beginPath();g.arc(540,170,24,0,7);g.fill();g.shadowBlur=0;
  spot(540,820,760,.42);
  // nightstand + clock
  window.CLK=[clock,t];}
function nightstand(x,y,clock,t){g.save();g.translate(x,y);g.fillStyle='#5a3820';g.strokeStyle=INK;g.lineWidth=7;g.fillRect(-110,0,220,200);g.strokeRect(-110,0,220,200);g.strokeRect(-90,40,180,60);
  if(clock){const ring=clock.ring?Math.sin(t*60)*5:0;g.translate(ring,0);g.fillStyle='#1d1d1d';g.beginPath();g.roundRect(-85,-95,170,95,18);g.fill();g.stroke();
    g.font='800 64px BS';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#ff3b30';g.shadowColor='#ff3b30';g.shadowBlur=18;g.fillText(clock.txt,0,-46);g.shadowBlur=0;
    if(clock.ring){g.strokeStyle='#fff';g.lineWidth=7;for(const s of[-1,1]){g.beginPath();g.arc(s*110,-60,30,s<0?Math.PI*.7:-Math.PI*.3,s<0?Math.PI*1.3:Math.PI*.3);g.stroke();g.beginPath();g.arc(s*110,-60,55,s<0?Math.PI*.7:-Math.PI*.3,s<0?Math.PI*1.3:Math.PI*.3);g.stroke();}}}
  g.restore();}
function bed(x,y,front){ // headboard behind; blanket drawn by bedFront()
  g.save();g.translate(x,y);g.fillStyle='#6b4325';g.strokeStyle=INK;g.lineWidth=9;g.beginPath();g.roundRect(-330,-560,660,560,40);g.fill();g.stroke();
  g.fillStyle='rgba(0,0,0,.18)';for(let i=-2;i<=2;i++)g.fillRect(i*120-14,-500,28,440);
  g.fillStyle='#e8e2d4';g.beginPath();g.roundRect(-230,-330,460,150,70);g.fill();g.stroke();g.restore();}
function bedFront(x,y,top){g.save();g.translate(x,y);g.fillStyle='#3e5f86';g.strokeStyle=INK;g.lineWidth=9;g.beginPath();g.moveTo(-360,top);g.quadraticCurveTo(0,top-40,360,top);g.lineTo(380,300);g.lineTo(-380,300);g.closePath();g.fill();g.stroke();
  g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=10;for(let i=1;i<4;i++){g.beginPath();g.moveTo(-370,top+i*70);g.quadraticCurveTo(0,top+i*70-30,370,top+i*70);g.stroke();}
  g.fillStyle='#6b4325';g.strokeStyle=INK;g.lineWidth=9;g.fillRect(-390,280,780,90);g.strokeRect(-390,280,780,90);g.restore();if(window.CLK)nightstand(x+330,y+150,window.CLK[0],window.CLK[1]);}
function zzz(x,y,t){g.save();g.font='800 70px BS';g.fillStyle='rgba(230,240,255,.85)';for(let i=0;i<3;i++){const u=((t*.6+i/3)%1);g.globalAlpha=Math.sin(u*Math.PI);g.fillText('Z',x+u*80+i*10,y-u*220);}g.restore();}
function xrayRoom(t){g.fillStyle='#07101c';g.fillRect(0,0,W,H);g.save();g.globalAlpha=.25;g.strokeStyle='#2c5a8a';g.lineWidth=2;for(let x=0;x<W;x+=60){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}for(let y=0;y<H;y+=60){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}g.restore();
  const sy=(t*420)%H;const sg=g.createLinearGradient(0,sy-120,0,sy+20);sg.addColorStop(0,'rgba(120,200,255,0)');sg.addColorStop(1,'rgba(120,200,255,.18)');g.fillStyle=sg;g.fillRect(0,sy-120,W,140);}
function tag(x,y,txt,col='#ffe27a',size=58){g.save();g.font=`800 ${size}px BS`;g.textAlign='center';g.textBaseline='middle';const w=g.measureText(txt).width+44;g.fillStyle='rgba(10,14,22,.85)';g.strokeStyle=col;g.lineWidth=5;g.beginPath();g.roundRect(x-w/2,y-size*.62,w,size*1.24,14);g.fill();g.stroke();g.fillStyle=col;g.fillText(txt,x,y+2);g.restore();}
function sleepMeter(t,u){ // u: 0 deep -> 1 awake
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#2d6f78');bg.addColorStop(.35,'#1c3f58');bg.addColorStop(.7,'#1b1f48');bg.addColorStop(1,'#0c0a22');g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.save();g.globalAlpha=.15;for(let i=0;i<9;i++){g.fillStyle='#bfe8ff';g.beginPath();g.moveTo(120+i*120+Math.sin(t+i)*20,0);g.lineTo(80+i*120,H*.8);g.lineTo(130+i*120,H*.8);g.fill();}g.restore();
  const lv=[['AWAKE',300],['LIGHT SLEEP',760],['DEEP SLEEP',1300]];g.save();g.setLineDash([22,16]);g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=4;
