    F.bubble(ctx, q.x0 + 330, q.y0 + 470, 'ONE MORE TAB!', seg(t, 5.0, 6.6), { size: 36, rot: .04 });
    if (live && t > T.gSleep + .3) { F.zzz(ctx, hc[0] + 20, Math.max(q.labBot + 150, hc[1] - 40), t, 1, z1);
      ctx.save(); ctx.translate(q.x0 + 365, q.labBot + 165); ctx.rotate(t * 6); ctx.strokeStyle = '#3fa9ff'; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, 0, 34, 0, 4.4); ctx.stroke(); ctx.restore(); }
    if (live && t > 6.0 && t < T.gSleep) F.sweat(ctx, hc, t, .6, 0, z1);
  }
  if (i === 3) {
    const JX = [q.x0 + 315, q.x0 + 440], JY = [q.fl - 236, q.fl];
    const got = [0, 0, 0, 0];
    for (let k = 0; k < T.pN; k++) if (live && t > T.pCoin(k) + .35) got[k % 4]++;
    for (let d = 0; d < 7; d++) if (live && t > T.day(d) + .25) { got[d % 3]--; got[3]++; }
    const cols = ['#3fa9ff', '#4dff9a', '#ff7ab8', '#b26bff'];
    for (let j = 0; j < 4; j++) jar(ctx, JX[j % 2], JY[j >> 1], z * .48, Math.max(0, got[j]), cols[j], j);
    // payday envelope in hand + coins flying into jars
    if (live && t > T.pPay && t < 5.6) envelope(ctx, hand[0] + 6, hand[1], z * .8, -.2, false);
    for (let k = 0; k < T.pN; k++) { const a = T.pCoin(k), u = seg(t, a, a + .35), j = k % 4; if (live && u > 0 && u < 1) coin(ctx, lerp(hand[0], JX[j % 2], u), lerp(hand[1], JY[j >> 1] - 120 * z * .48, u) - 80 * Math.sin(PI * u), z * .6); }
    // each day: a coin leaves its job jar -> the thing it pays for, and one goes to savings
    for (let d = 0; d < 7; d++) { const a = T.day(d), j = d % 3;
      const u = seg(t, a + .25, a + .6); if (live && u > 0 && u < 1) coin(ctx, lerp(JX[j % 2], hand[0], u), lerp(JY[j >> 1] - 120 * z * .48, hand[1], u) - 60 * Math.sin(PI * u), z * .6);
      if (live && t > a + .6 && t < a + 1.05) jobIcon(ctx, hand[0] + 10, hand[1] - 30, j, z * .9 * oBack(seg(t, a + .6, a + .8)), cols[j]);
      if (t > a + .6 && t < a + 1.6) F.tick(ctx, hc[0] + 10, hc[1] - 70, seg(t, a + .6, a + 1.6), z * .9); }
    F.bubble(ctx, q.x0 + 330, q.y0 + 480, 'PAYDAY!', seg(t, T.go + .1, T.go + 1.4), { size: 46, rot: .05 });
    F.power(ctx, q, n.x, q.fl, t, T.POWER, RS, z);
  }
}
function seek(t) {
  FP.frame(t, {
    glow: glowOf, draw,
    shake: (i, t) => (i === 0 ? shk(t, T.cSnap, .4, 11) : 0) + (i === 1 ? shk(t, T.bBill + .1, .35, 10) + shk(t, T.bFaint + .35, .3, 8) : 0) + (i === 2 ? shk(t, T.gSleep + .2, .3, 6) : 0) + (i === 3 ? shk(t, T.POWER, .3, 9) : 0),
    flash: (i, t) => i === 3 ? tri(t, T.POWER, T.POWER + .5) : 0,
  });
}
S.boot({ duration: T.dur, fps: 30, seek, ready: FP.ready });
