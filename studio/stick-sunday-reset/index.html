<!doctype html>
<html><head><meta charset="utf-8"><title>The Sunday Reset</title>
<script src="variant.js"></script>
<script src="kit/stick.js"></script>
</head>
<body><div id="stage"></div>
<script>
// STICK NINJA — "THE SUNDAY RESET" (planner channel). Short (≈15.0 s). Built from gen_short.py template. Ending: lesson + endCardPlanner (CTA a).
const EC0 = 11.6, DUR = 15.0;
const A = {"hook": 0, "prob": 2.6, "roof": 5.55, "fix": 6.85, "pay": 9.6};
const K = {"TH": 6.45, "land": 5.68, "EC0": 11.6, "DUR": 15.0, "h1": 1.3, "pk": 4.5, "f1": 7.75, "f2": 8.95};
const SCENES = { hook: [0, A.prob], prob: [A.prob, A.roof], roof: [A.roof, A.fix], fix: [A.fix, A.pay], pay: [A.pay, DUR] };
const S = Stick, { seg, oC, io, oBack, lerp, clamp, tri, hash } = S;
const stage = S.stage();
const E = { e1: S.env(stage, 'bedroom'), e2: S.env(stage, 'kitchen'), roof: S.env(stage, 'rooftop'), e4: S.env(stage, 'library', { day: true }), mtn: S.env(stage, 'mountain') };
const W = S.world(stage);
const hookH = S.kin(stage, '<div data-max="130">MONDAY HITS, AND YOU’RE</div><div data-max="150">ALREADY <i class="pk">BEHIND?</i></div>', { top: 262 });
const probH = S.kin(stage, '<div data-max="130">MESSY ROOM. NO PLAN.</div><div data-max="130">EVERY WEEK, THE SAME <i class="pk">CHAOS.</i></div>', { top: 262 });
const ninH = S.kin(stage, '<div data-max="170"><i class="cy">NOT</i> <i class="cy">THIS</i> <i class="cy">WEEK.</i></div>', { top: 262 });
const fixH = S.kin(stage, '<div data-max="130">SUNDAY NIGHT: TIDY UP</div><div data-max="140">AND PLAN <i class="cy">THREE</i> <i class="cy">WINS.</i></div>', { top: 262 });
const pay1 = S.kin(stage, '<div data-max="150">RESET ON SUNDAY.</div>', { top: 290 });
const pay2 = S.kin(stage, '<div data-max="160"><i class="or">WIN</i> <i class="or">THE</i> <i class="or">WEEK.</i></div>', { top: 470 });
S.safeGuide(stage);
const endCard = S.endCardPlanner(stage, { dur: +(DUR - EC0).toFixed(2), head: '<div data-max="160"><i class="cy">START</i></div><div data-max="160">TONIGHT</div>', beats: [0.35, 0.7], chip: '<span class="chip dark" style="font-size:40px">FREE TRACKER · LINK IN <b>BIO</b></span>' });
const D = S.ninja.draw, nin = (t, J, o) => S.ninja.pose(t, Object.assign({ J }, o));
const sk = n => S.ninja.skel(n), W2 = (n, p) => S.ninja.toWorld(n, p), hand = n => W2(n, sk(n).armF[2]);
function glow(ctx, x, y, r, col, k) {
  if (k <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col.replace('A', (.5 * k).toFixed(3))); g.addColorStop(1, col.replace('A', '0'));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
const EW = { color: '#ff9ec7', color2: '#ff6fae', side: '#6a1736', depth: 16 };
const HA = -64, TS = K.TH - S.ninja.SLASH.uAt(HA);
const roofTr = S.track([[A.roof, 160, 1500, 1.2, 0], [K.land, 200, 1500, 1.2, 0], [TS - .02, 200, 1500, 1.2, 0], [TS + .62, 640, 1500, 1.2, 260], [99, 640, 1500, 1.2, 0]]);
const roofTL = S.ninja.timeline([[A.roof, 'jump', { ph: .5 }], [K.land, 'crouch', {}, .1], [TS, 'slash', {}, .08], [TS + 1.25, 'ready', {}, .25]]);
const hitN = nin(K.TH, roofTL(K.TH), roofTr(K.TH)), RC = S.ninja.reach(hitN);
const WC = S.wordcut(Object.assign({ text: 'CHAOS', x: RC.cx + RC.R * Math.cos(HA * Math.PI / 180), y: RC.cy + RC.R * Math.sin(HA * Math.PI / 180), size: 170, angle: HA + 90, seed: 7 }, EW));
const payTL = S.ninja.timeline([[A.pay, 'walk'], [A.pay + .5, 'idle', {}, .2], [A.pay + .6, 'flourish', { aim: -8 }, .1], [10.35 + .4, 'proud', {}, .25]]);
const payTr = S.track([[A.pay, 250, 1500, 1.15, 0], [A.pay + .5, 470, 1500, 1.15, 0]]);

const hookTL = S.ninja.timeline([[0, 'run'], [K.h1, 'crushed', { k: .7 }, .08], [K.h1 + .7, 'facepalm', {}, .15]]);
const hookTr = S.track([[0, 160, 1500, 1, 0], [K.h1, 420, 1500, 1, 0]]);
function drawHook(ctx, t) { const k = oBack(seg(t, .3, .7), 2);
  if (k > 0) S.calPage(ctx, 760, 1000 + 40 * oC(seg(t, K.h1 - .2, K.h1)), .7 * k, 'MON', { rot: 6 });
  D(ctx, nin(t, hookTL(t), Object.assign({ vx: t < K.h1 ? 300 : 0 }, hookTr(t))));
  S.sparks(ctx, t, K.h1, 420, 1040, { n: 10, seed: 3, speed: 400, dir: -Math.PI / 2, spread: 2.4, life: .3, g: 900 }); }
const probTL = S.ninja.timeline([[A.prob, 'slump'], [A.prob + 1.0, 'shrug', {}, .15], [K.pk, 'facepalm', {}, .12]]);
function drawProb(ctx, t) {
  [.4, .8, 1.2].forEach((o, i) => { const k = oBack(seg(t, A.prob + o, A.prob + o + .25), 2); if (k <= 0) return; const x = 640 + i * 150, y = 1230;
    if (i === 0) S.chips(ctx, x, y, .9 * k, -12); else if (i === 1) S.mug(ctx, x, y + 20, .9 * k); else S.mail(ctx, x, y - 10, .9 * k, 10); });
  [0, 1, 2, 3].forEach(i => S.note(ctx, 620 + i * 120, 1470 - (i % 2) * 14, .45, -20 + i * 17, '', { col: ['#ffe36b', '#9ee7ff', '#ffb3d1', '#c9ffb3'][i] }));
  D(ctx, nin(t, probTL(t), { x: 330, y: 1500, s: 1 })); }
const fixTL = S.ninja.timeline([[A.fix, 'sweep'], [K.f1, 'point', { ang: -30 }, .15], [K.f2 + .2, 'cheer', {}, .12]]);
function drawFix(ctx, t) {
  [0, 1, 2].forEach(i => { const a = K.f1 + i * .35, k = oBack(seg(t, a, a + .25), 2); if (k <= 0) return;
    S.note(ctx, 700 + i * 120, 1020 + (i % 2) * 70, .55 * k, (i - 1) * 7, '', { col: '#ffe36b' }); S.check(ctx, 700 + i * 120, 1020 + (i % 2) * 70, .45, seg(t, K.f2 + i * .12, K.f2 + i * .12 + .3)); });
  D(ctx, nin(t, fixTL(t), { x: 420, y: 1500, s: 1 }));
  S.sparks(ctx, t, A.fix + .3, 560, 1300, { n: 10, seed: 15, speed: 400, dir: -Math.PI / 2, spread: 2.4, life: .35, g: 900, cols: ['#fff', '#3ee6ff'] });
  S.sparks(ctx, t, K.f2, 820, 1040, { n: 12, seed: 14, speed: 500, dir: -Math.PI / 2, spread: 2.4, life: .4, g: 900 }); }

const span = (k, a, b) => seg(k, a, b);
const SC = [
  { a: 0, b: A.prob, env: E.e1, envOpt: () => ({ lamp: .6 }), cam: t => ({ x: lerp(560, 620, seg(t, 0, A.prob)), y: 1150, z: lerp(1.3, 1.42, io(seg(t, 0, A.prob))) + .03 * tri(t, K.h1, K.h1 + .3) }), draw: drawHook },
  { a: A.prob, b: A.roof, env: E.e2, whip: 'left', envOpt: () => ({}), cam: t => ({ x: lerp(540, 600, seg(t, A.prob, A.roof)), y: 1120, z: lerp(1.18, 1.28, io(seg(t, A.prob, A.roof))) + .04 * tri(t, K.pk, K.pk + .3), r: -1.5 }), draw: drawProb },
  { a: A.roof, b: A.fix, env: E.roof, whip: 'up', cam: t => { const push = io(seg(t, A.roof + .1, K.TH)) * .07, punch = .05 * tri(t, K.TH, K.TH + .25);
      return { x: lerp(545, 575, seg(t, A.roof, A.fix)), y: lerp(900, 880, seg(t, A.roof, A.fix)), z: 1.2 + push + punch }; },
    draw(ctx, t) { WC.draw(ctx, t, { in: A.roof + .05, mode: 'drop', h: 240, cut: K.TH, wob: .6, kick: 1.2, fadeAt: A.fix - .1 }); D(ctx, nin(t, roofTL(t), Object.assign({ ground: 1500 }, roofTr(t)))); } },
  { a: A.fix, b: A.pay, env: E.e4, whip: 'left', envOpt: () => ({}), cam: t => ({ x: lerp(560, 620, seg(t, A.fix, A.pay)), y: 1120, z: lerp(1.25, 1.33, io(seg(t, A.fix, A.pay))) + .03 * tri(t, K.f2, K.f2 + .3) }), draw: drawFix },
  { a: A.pay, b: DUR + 1, env: E.mtn, whip: 'left', cam: t => ({ x: 540, y: lerp(960, 985, seg(t, A.pay, EC0)), z: lerp(1.16, 1.24, io(seg(t, A.pay, EC0))) + .03 * tri(t, 10.35, 10.35 + .3) }),
    envOpt: t => ({ rise: .3 + .6 * io(seg(t, A.pay, EC0 - .2)) }),
    draw(ctx, t) { D(ctx, nin(t, payTL(t), Object.assign({ vx: t < A.pay + .5 ? 300 : 0 }, payTr(t)))); S.sparks(ctx, t, 10.35, 470, 1000, { n: 14, seed: 9, speed: 700, dir: -Math.PI / 2, spread: 2.6, life: .5, g: 900 }); } },
];
function seek(t) {
  const sh = WC.shake(t, K.TH), imp = (a, amp) => t >= a && t < a + .22 ? Math.round(amp * (1 - (t - a) / .22) * Math.sin(t * 120)) : 0;
  W.seek(t, SC, { shake: [sh[0], sh[1] + imp(K.pk, 6) + imp(K.f2, 4)], flash: WC.flash(t, K.TH), flashColor: '#ff6fae' });
  S.kinShow(hookH, t, 0, A.prob - .15, { hold0: true, beats: [0, 0, 0, 0, 1.01, 1.66] });
  S.kinShow(probH, t, 2.72, A.roof - .3, { beats: [2.72, 3.03, 3.34, 3.65, 3.96, 4.27, 4.58, 4.89, 5.2] });
  S.kinShow(ninH, t, 5.77, K.TH + .1, { beats: [5.77, 6.1, 6.43], style: 'slam' });
  S.kinShow(fixH, t, 7.02, A.pay - .15, { beats: [7.02, 7.29, 7.56, 7.83, 8.1, 8.37, 8.64, 8.91] });
  S.kinShow(pay1, t, 9.82, EC0 - .3, { beats: [9.82, 9.94, 10.05], style: 'slam' });
  S.kinShow(pay2, t, 10.35, EC0 - .3, { beats: [10.35, 10.5, 10.65], style: 'slam' });
  endCard(t, EC0);
  S.hideInvisible(stage);
}
S.boot({ duration: DUR, fps: 30, seek });
</script></body></html>
