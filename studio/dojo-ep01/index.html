<!doctype html>
<html><head><meta charset="utf-8"><title>Habit Dojo Ep 1</title>
<script src="kit/stick.js"></script>
</head>
<body><div id="stage"></div>
<script>
// HABIT DOJO — THE SERIES. Episode 1: THE SCROLL GOBLIN. Cliffhanger -> Ep 2: THE SNOOZE OGRE.
const DUR = 27.8;
const SCENES = { hook: [0, 2.4], train: [2.4, 4.45], pop: [4.45, 6.05], hours: [6.05, 8.15], shock: [8.15, 9.6], master: [9.6, 13.2],
  move: [13.2, 15.25], yank: [15.25, 16.5], cut: [16.5, 17.65], calm: [17.65, 20.8], cliff: [20.8, 24.4], end: [24.4, DUR] };
const S = Stick, { seg, oC, iC, io, oBack, lerp, clamp, tri, hash } = S;
const T = { land: .55, buzz: 3.7, gob: 4.6, TH: 17.0, put: 14.35, close: 14.6 };
const stage = S.stage();
const E = { roof: S.env(stage, 'rooftop'), bed: S.env(stage, 'bedroom'), hall: S.env(stage, 'hall'), libD: S.env(stage, 'library', { day: true }),
  spirit: S.env(stage, 'void', { bg: '#1a0f08', glow: '#ff8a2b' }), dark: S.env(stage, 'void', { bg: '#12061f', glow: '#8a5cff' }),
  mtn: S.env(stage, 'mountain'), ogre: S.env(stage, 'void', { bg: '#0a0710', glow: '#ff3b3b' }) };
const W = S.world(stage);
const epK = S.kicker(stage, 'HABIT DOJO · EPISODE 1', { top: 250 });
const hookH = S.kin(stage, '<div data-max="150">THE <i class="pk">SCROLL</i></div><div data-max="170"><i class="pk">GOBLIN</i></div>', { top: 318 });
const trainH = S.kin(stage, '<div data-max="140">MIDNIGHT.</div><div data-max="120">ONE MORE ROUND…</div>', { top: 262 });
const popH = S.kin(stage, '<div data-max="130">“JUST ONE MORE</div><div data-max="150"><i class="pk">VIDEO…”</i></div>', { top: 262 });
const hoursH = S.kin(stage, '<div data-max="130">ONE VIDEO BECAME</div><div data-max="160"><i class="or">TWO</i> <i class="or">HOURS.</i></div>', { top: 262 });
const shockH = S.kin(stage, '<div data-max="140">“WHAT TIME</div><div data-max="160"><i class="or">IS</i> <i class="or">IT?!”</i></div>', { top: 262 });
const m1 = S.kin(stage, '<div data-max="120">“YOU CANNOT OUT-FIGHT</div><div data-max="140">THE GOBLIN.</div>', { top: 262 });
const m2 = S.kin(stage, '<div data-max="140">TAKE AWAY</div><div data-max="160"><i class="or">ITS</i> <i class="or">HOME.”</i></div>', { top: 262 });
const moveH = S.kin(stage, '<div data-max="140"><i class="cy">PHONE.</i></div><div data-max="140">OTHER ROOM.</div><div data-max="140">DOOR CLOSED.</div>', { top: 262 });
const yankH = S.kin(stage, '<div data-max="170"><i class="pk">“NO!</i></div><div data-max="130">JUST ONE MORE!”</div>', { top: 262 });
const cutH = S.kin(stage, '<div data-max="170"><i class="cy">NOT</i> <i class="cy">TONIGHT.</i></div>', { top: 262 });
const calmH = S.kin(stage, '<div data-max="130">THE GOBLIN IS WEAK…</div><div data-max="120">WHEN THE PHONE IS</div><div data-max="140"><i class="cy">FAR</i> <i class="cy">AWAY.</i></div>', { top: 262 });
const cl1 = S.kin(stage, '<div data-max="130">“YOU WON TONIGHT.</div><div data-max="140">BUT AT <i class="or">DAWN…</i></div>', { top: 262 });
const cl2 = S.kin(stage, '<div data-max="130">THE <i class="pk">SNOOZE</i> <i class="pk">OGRE</i></div><div data-max="150">WAKES UP.”</div>', { top: 262 });
const endK = S.kicker(stage, 'NEXT · EPISODE 2', { top: 250 });
const endH = S.kin(stage, '<div data-max="150">THE <i class="pk">SNOOZE</i></div><div data-max="170"><i class="pk">OGRE</i></div>', { top: 318 });
const endC = S.chip(stage, 'FOLLOW SO YOU DON’T <b>MISS IT</b>', { top: 660, size: 44, cls: 'dark' });
S.safeGuide(stage);

// ------------------------------------------------------------ characters
const DOJO = { ink: '#17785a', ink2: '#11593f', rim: '#ffb36b', tail: '#ff8a2b', belt: '#ff8a2b', scab: '#0d3b2c', band: '#ff8a2b', band2: '#c9661b', mouth: '#0d3b2c', mouthIn: '#05060a' };
const SPIRIT = { ink: '#ffcf8a', ink2: '#ffb36b', rim: '#fff2d6', tail: '#fff2d6', belt: '#fff2d6', scab: '#d08a3a', band: '#fff2d6', band2: '#ffd79a', mouth: '#a8662a', mouthIn: '#5a3010' };
const D = S.ninja.draw, nin = (t, J, o) => S.ninja.pose(t, Object.assign({ J, pal: DOJO }, o));
const sk = n => S.ninja.skel(n), W2 = (n, p) => S.ninja.toWorld(n, p), hand = n => W2(n, sk(n).armF[2]);
function glow(ctx, x, y, r, col, k) {
  if (k <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col.replace('A', (.55 * k).toFixed(3))); g.addColorStop(1, col.replace('A', '0'));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
/* THE SNOOZE OGRE (silhouette or lit). x,y = feet centre, ~720*s tall */
function ogre(ctx, x, y, s, t, o = {}) {
  const lit = o.lit || 0, eye = o.eye == null ? 1 : o.eye, br = 1 + .025 * Math.sin(t * 1.6);
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s * br);
  const body = lit ? '#4a5a8a' : '#07040c', dark = lit ? '#34406a' : '#07040c';
  ctx.fillStyle = dark; [-1, 1].forEach(k => { ctx.beginPath(); ctx.roundRect(k * 90 - 60, -200, 120, 200, 40); ctx.fill(); });
  ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, -360, 260, 230, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = dark; [-1, 1].forEach(k => { ctx.beginPath(); ctx.ellipse(k * 280, -330, 70, 170, k * .25, 0, Math.PI * 2); ctx.fill(); });
  ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, -600, 160, 140, 0, 0, Math.PI * 2); ctx.fill();
  // nightcap
  ctx.fillStyle = lit ? '#7a5aa8' : '#0b0612'; ctx.beginPath(); ctx.moveTo(-150, -650); ctx.quadraticCurveTo(0, -860, 230, -780); ctx.lineTo(150, -660); ctx.closePath(); ctx.fill();
  ctx.fillStyle = lit ? '#fff' : '#120a1c'; ctx.beginPath(); ctx.arc(240, -780, 34, 0, Math.PI * 2); ctx.fill();
  // eyes
  if (eye > 0) { [-1, 1].forEach(k => { glow(ctx, k * 60, -610, 70, 'rgba(255,59,59,A)', eye);
    ctx.fillStyle = '#ff3b3b'; ctx.globalAlpha = eye; ctx.beginPath(); ctx.ellipse(k * 60, -610, 26, 12 * (o.open == null ? 1 : o.open) + 2, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }); }
  ctx.restore();
}
function clockChip(ctx, x, y, s, txt, k) {
  if (k <= 0) return; ctx.save(); ctx.translate(x, y); ctx.scale(s * oBack(k, 2), s * oBack(k, 2));
  ctx.fillStyle = '#0b1026'; ctx.beginPath(); ctx.roundRect(-150, -60, 300, 120, 24); ctx.fill(); ctx.strokeStyle = '#ff5a4f'; ctx.lineWidth = 6; ctx.stroke();
  ctx.fillStyle = '#ff5a4f'; ctx.font = '800 84px BS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, 0, 4); ctx.restore();
}

// ------------------------------------------------------------ timelines
const hookTL = S.ninja.timeline([[0, 'jump', { ph: .55 }], [T.land, 'crouch', {}, .08], [T.land + .3, 'ready', {}, .2]]);
const hookTr = S.track([[0, 300, 1380, 1.1, 0], [T.land, 380, 1500, 1.1, 0], [9, 380, 1500, 1.1, 0]]);
const trainTL = S.ninja.timeline([[2.4, 'kick'], [2.95, 'ready', {}, .1], [3.15, 'kick'], [3.7, 'look', {}, .15]]);
const popTL = S.ninja.timeline([[4.45, 'look'], [5.2, 'reach', { x: 170, y: -120, face: 'g' }, .25]]);
const hoursTL = S.ninja.timeline([[0, 'scroll', { swipes: [6.2, 6.5, 6.8, 7.1, 7.4, 7.7, 8.0].map(v => v - 6.05) }]]);
const shockTL = S.ninja.timeline([[8.15, 'scroll', { swipes: [] }], [8.3, 'facepalm', {}, .1]]);
const kneelTL = S.ninja.timeline([[0, 'crouch']]);
const spiritTL = S.ninja.timeline([[9.6, 'idle'], [11.2, 'point', { ang: 30, face: 'n' }, .3]]);
const moveTL = S.ninja.timeline([[13.2, 'carry', { dx: 118, dy: -262 }], [14.1, 'reach', { x: 170, y: -40, face: 'd' }, .15], [14.7, 'ready', {}, .2]]);
const moveTr = S.track([[13.2, 80, 1500, 1, 0], [14.1, 480, 1500, 1, 0]]);
const calmTL = S.ninja.timeline([[0, 'read', { sit: true, face: 'f' }]]);
const HA = -64, TS = T.TH - S.ninja.SLASH.uAt(HA);
const roofTr = S.track([[16.5, 160, 1500, 1.15, 0], [16.62, 200, 1500, 1.15, 0], [TS - .02, 200, 1500, 1.15, 0], [TS + .62, 600, 1500, 1.15, 240], [99, 600, 1500, 1.15, 0]]);
const roofTL = S.ninja.timeline([[16.5, 'crouch'], [TS, 'slash', {}, .08], [TS + 1.25, 'ready', {}, .25]]);
const hitN = nin(T.TH, roofTL(T.TH), roofTr(T.TH)), RC = S.ninja.reach(hitN);
const WC = S.wordcut({ text: 'ONE MORE', x: RC.cx + RC.R * Math.cos(HA * Math.PI / 180), y: RC.cy + RC.R * Math.sin(HA * Math.PI / 180), size: 120, angle: HA + 90, seed: 4,
  color: '#ff9ec7', color2: '#ff6fae', side: '#6a1736', depth: 16 });
const endTL = S.ninja.timeline([[24.4, 'ready'], [25.2, 'flourish', { aim: -8 }, .1], [26.3, 'ready', {}, .3]]);

const SC = [
  { a: 0, b: SCENES.hook[1], env: E.roof, cam: t => ({ x: lerp(560, 600, seg(t, 0, 2.4)), y: 1120, z: lerp(1.15, 1.25, io(seg(t, 0, 2.4))) + .04 * tri(t, T.land, T.land + .3) }),
    draw(ctx, t) {
      const eo = .5 + .5 * Math.sin(t * 3);
      [[880, 1240], [940, 1240]].forEach(([x, y]) => { glow(ctx, x, y, 40, 'rgba(255,227,107,A)', eo); ctx.fillStyle = '#ffe36b'; ctx.globalAlpha = eo; ctx.beginPath(); ctx.ellipse(x, y, 12, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; });
      D(ctx, nin(t, hookTL(t), Object.assign({ vx: 200 }, hookTr(t))));
      S.sparks(ctx, t, T.land, 380, 1500, { n: 10, seed: 2, speed: 500, dir: -Math.PI / 2, spread: 2.8, life: .35, g: 1200 });
    } },
  { a: SCENES.train[0], b: SCENES.train[1], env: E.roof, whip: 'right', cam: t => ({ x: lerp(520, 600, seg(t, 2.4, 4.45)), y: 1110, z: lerp(1.25, 1.35, seg(t, 2.4, 4.45)), r: 2 }),
    draw(ctx, t) {
      const bz = seg(t, T.buzz, T.buzz + .1) * (1 - seg(t, 4.4, 4.5));
      S.phone(ctx, 800, 1478, .55, 90, { glow: bz }); S.buzz(ctx, 800, 1460, t, bz);
      D(ctx, nin(t, trainTL(t), { x: 380, y: 1500, s: 1.05 }));
    } },
  { a: SCENES.pop[0], b: SCENES.pop[1], env: E.dark, whip: 'cut', cam: t => ({ x: 600, y: 1150, z: lerp(1.3, 1.42, io(seg(t, 4.45, 6.05))) + .05 * tri(t, T.gob, T.gob + .3) }),
    draw(ctx, t) {
      ctx.fillStyle = '#0a0414'; ctx.fillRect(-600, 1500, 2400, 400);
      S.phone(ctx, 760, 1478, .6, 90, { glow: 1 });
      const k = oBack(seg(t, T.gob, T.gob + .45), 2.2);
      if (k > 0) S.goblin.draw(ctx, { x: 760, y: 1470, s: 1.15 * k, t, face: 'grin', fx: -1, armL: [-130, -230 + 30 * Math.sin(t * 9)], armR: [110, -150] });
      S.sparks(ctx, t, T.gob, 760, 1420, { n: 14, seed: 6, speed: 600, dir: -Math.PI / 2, spread: 2.2, life: .4, g: 900, cols: ['#c77dff', '#ffffff', '#ffe36b'] });
      D(ctx, nin(t, popTL(t), { x: 330, y: 1500, s: 1, look: [8, -2] }));
    } },
  { a: SCENES.hours[0], b: SCENES.hours[1], env: E.bed, whip: 'left', envOpt: () => ({ lamp: .35 }), cam: t => ({ x: lerp(600, 640, seg(t, 6.05, 8.15)), y: 1130, z: lerp(1.25, 1.33, io(seg(t, 6.05, 8.15))) }),
    draw(ctx, t) {
      S.wallClock(ctx, 760, 980, .9, t, { speed: 3.2 });
      S.goblin.draw(ctx, { x: 860, y: 1262 - 24 * Math.abs(Math.sin(t * 7)), s: .7, t, face: 'grin', fx: -1 });
      const n = nin(t, hoursTL(t), { x: 470, y: 1500, s: 1, glow: 1, face: 'g' }); D(ctx, n);
    } },
  { a: SCENES.shock[0], b: SCENES.shock[1], env: E.bed, whip: 'cut', envOpt: () => ({ lamp: .3 }), cam: t => ({ x: 500, y: 1040, z: lerp(1.7, 1.85, oC(seg(t, 8.15, 9.0))) + .05 * tri(t, 8.3, 8.6) }),
    draw(ctx, t) {
      D(ctx, nin(t, shockTL(t), { x: 470, y: 1500, s: 1, face: 'x' }));
      clockChip(ctx, 700, 1040, .55, '2:00 AM', seg(t, 8.45, 8.75));
    } },
  { a: SCENES.master[0], b: SCENES.master[1], env: E.spirit, whip: 'up', cam: t => ({ x: 540, y: lerp(1000, 960, seg(t, 9.6, 13.2)), z: lerp(1.05, 1.12, io(seg(t, 9.6, 13.2))) }),
    draw(ctx, t) {
      ctx.fillStyle = '#140a04'; ctx.fillRect(-600, 1500, 2400, 400);
      glow(ctx, 640, 1100, 520, 'rgba(255,170,90,A)', .8 + .2 * Math.sin(t * 2));
      ctx.save(); ctx.globalAlpha = .82 * seg(t, 9.6, 10.2); D(ctx, S.ninja.pose(t, { J: spiritTL(t), pal: SPIRIT, x: 680, y: 1500, s: 1.6 })); ctx.restore();
      for (let i = 0; i < 14; i++) { const p = ((t * .25 + hash(i)) % 1); ctx.fillStyle = '#ffd79a'; ctx.globalAlpha = .6 * Math.sin(Math.PI * p); ctx.beginPath(); ctx.arc(300 + hash(i * 3) * 700, 1500 - p * 900, 3 + hash(i) * 4, 0, Math.PI * 2); ctx.fill(); }
      ctx.globalAlpha = 1;
      D(ctx, nin(t, kneelTL(t), { x: 260, y: 1500, s: .85, face: 'w' }));
    } },
  { a: SCENES.move[0], b: SCENES.move[1], env: E.hall, whip: 'right', cam: t => ({ x: lerp(480, 620, seg(t, 13.2, 15.25)), y: 1110, z: lerp(1.2, 1.26, seg(t, 13.2, 15.25)) }),
    draw(ctx, t) {
      const n = nin(t, moveTL(t), Object.assign({ vx: t < 14.1 ? 400 : 0 }, moveTr(t)));
      S.box(ctx, 700, 1500, .9, t < T.close ? 1 : 1 - seg(t, T.close, T.close + .2));
      D(ctx, n);
      if (t < T.put) { const h = hand(n); S.phone(ctx, h[0] + 10, h[1] + 10, .55, 0, { glow: .6 }); }
      else if (t < T.close) S.phone(ctx, 700, lerp(1400, 1470, seg(t, T.put, T.close)), .5, 90, { glow: .5 });
      S.sparks(ctx, t, T.close + .2, 700, 1430, { n: 10, seed: 13, speed: 400, dir: -Math.PI / 2, spread: 2.4, life: .35, g: 900 });
    } },
  { a: SCENES.yank[0], b: SCENES.yank[1], env: E.dark, whip: 'left', cam: t => ({ x: 560, y: 1160, z: 1.35 + .04 * Math.sin(t * 30) * seg(t, 15.3, 15.5) }),
    draw(ctx, t) {
      ctx.fillStyle = '#0a0414'; ctx.fillRect(-600, 1500, 2400, 400);
      const p = io(seg(t, 15.4, 16.4)), x = lerp(600, 1300, p);
      for (let i = 0; i < 6; i++) { ctx.strokeStyle = '#c77dff'; ctx.globalAlpha = .4; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x + 40, 1200 + i * 50); ctx.lineTo(x - 300, 1200 + i * 50); ctx.stroke(); }
      ctx.globalAlpha = 1;
      S.goblin.draw(ctx, { x, y: 1480, s: 1.1, t, face: 'shock', fx: -1, squash: -.25 * p, armL: [-150, -260], armR: [-160, -170] });
    } },
  { a: SCENES.cut[0], b: SCENES.cut[1], env: E.roof, whip: 'up', cam: t => { const push = io(seg(t, 16.55, T.TH)) * .07, punch = .05 * tri(t, T.TH, T.TH + .25);
      return { x: lerp(545, 575, seg(t, 16.5, 17.65)), y: lerp(900, 880, seg(t, 16.5, 17.65)), z: 1.2 + push + punch }; },
    draw(ctx, t) { WC.draw(ctx, t, { in: 16.5, mode: 'pop', cut: T.TH, wob: .6, kick: 1.2, fadeAt: 17.55 }); D(ctx, nin(t, roofTL(t), Object.assign({ ground: 1500 }, roofTr(t)))); } },
  { a: SCENES.calm[0], b: SCENES.calm[1], env: E.libD, whip: 'left', cam: t => ({ x: lerp(560, 600, seg(t, 17.65, 20.8)), y: 1120, z: lerp(1.22, 1.3, io(seg(t, 17.65, 20.8))) }),
    draw(ctx, t) {
      glow(ctx, 520, 1250, 260, 'rgba(255,179,107,A)', .7);
      ctx.fillStyle = '#2a2f55'; ctx.fillRect(400, 1390, 150, 18); ctx.fillRect(420, 1408, 16, 92); ctx.fillRect(514, 1408, 16, 92);
      const gs = lerp(.6, .22, io(seg(t, 18.2, 20.2)));
      S.goblin.draw(ctx, { x: 860, y: 1500, s: gs, t, face: 'sad', fx: -1, op: 1 - seg(t, 20.2, 20.7) });
      D(ctx, nin(t, calmTL(t), { x: 470, y: 1500, s: 1 }));
    } },
  { a: SCENES.cliff[0], b: SCENES.cliff[1], env: E.mtn, whip: 'right', envOpt: t => ({ rise: .1 + .3 * seg(t, 20.8, 24.4) }), cam: t => ({ x: 560, y: lerp(1060, 1000, seg(t, 20.8, 24.4)), z: lerp(1.05, 1.15, io(seg(t, 20.8, 24.4))) + .04 * tri(t, 22.9, 23.3) }),
    draw(ctx, t) {
      const r = io(seg(t, 22.4, 23.6));
      ogre(ctx, 640, 1500 + 520 * (1 - r), .85, t, { eye: seg(t, 23.0, 23.3), open: .6 });
      ctx.fillStyle = '#0c0a18'; ctx.fillRect(-600, 1440, 2400, 500);
      S.goblin.draw(ctx, { x: 300, y: 1440, s: .9, t, face: 'grin' });
    } },
  { a: SCENES.end[0], b: DUR + 1, env: E.ogre, whip: 'cut', cam: t => ({ x: 540, y: 1000, z: lerp(1.0, 1.06, io(seg(t, 24.4, DUR))) }),
    draw(ctx, t) {
      ogre(ctx, 640, 1560, .62, t, { eye: 1, open: .5 + .5 * tri(t, 25.6, 26.4) });
      ctx.fillStyle = '#07040c'; ctx.fillRect(-600, 1500, 2400, 400);
      D(ctx, nin(t, endTL(t), { x: 330, y: 1500, s: .95 }));
    } },
];

function seek(t) {
  const sh = WC.shake(t, T.TH), imp = (a, amp) => t >= a && t < a + .22 ? Math.round(amp * (1 - (t - a) / .22) * Math.sin(t * 120)) : 0;
  W.seek(t, SC, { shake: [sh[0], sh[1] + imp(T.land, 7) + imp(T.gob, 6) + imp(8.3, 6) + imp(23.0, 9)], flash: WC.flash(t, T.TH), flashColor: '#ff8a2b' });
  S.show(epK, t, 0, 2.15, { hold0: true });
  S.kinShow(hookH, t, 0, 2.15, { hold0: true, beats: [0, 0, 0] });
  S.kinShow(trainH, t, 2.55, 4.3, { beats: [2.55, 3.35, 3.55, 3.8] });
  S.kinShow(popH, t, 4.62, 5.9, { beats: [4.62, 4.8, 4.95, 5.3] });
  S.kinShow(hoursH, t, 6.2, 8.0, { beats: [6.2, 6.4, 6.6, 7.3, 7.6], style: 'slam' });
  S.kinShow(shockH, t, 8.3, 9.3, { beats: [8.3, 8.6, 8.9, 9.05], style: 'slam' });
  S.kinShow(m1, t, 9.75, 11.45, { beats: [9.75, 9.95, 10.2, 10.75, 11.0] });
  S.kinShow(m2, t, 11.75, 13.05, { beats: [11.75, 12.0, 12.4, 12.6], style: 'slam' });
  S.kinShow(moveH, t, 13.4, 15.1, { beats: [13.4, 13.95, 14.15, 14.55, 14.75], style: 'slam' });
  S.kinShow(yankH, t, 15.38, 16.2, { beats: [15.38, 15.7, 15.85, 16.0] });
  S.kinShow(cutH, t, 16.65, 17.5, { beats: [16.65, 16.95], style: 'slam' });
  S.kinShow(calmH, t, 17.8, 20.6, { beats: [17.8, 18.0, 18.2, 18.4, 19.0, 19.2, 19.4, 19.6, 19.9, 20.1] });
  S.kinShow(cl1, t, 21.05, 22.45, { beats: [21.05, 21.3, 21.6, 22.0, 22.2, 22.4] });
  S.kinShow(cl2, t, 22.75, 24.25, { beats: [22.75, 22.95, 23.25, 23.6, 23.8], style: 'slam' });
  S.show(endK, t, 24.6, DUR + 1);
  S.kinShow(endH, t, 24.9, DUR + 1, { beats: [24.9, 25.1, 25.4], style: 'slam' });
  S.show(endC, t, 25.9, DUR + 1, { pop: true });
  S.hideInvisible(stage);
}
S.boot({ duration: DUR, fps: 30, seek });
</script></body></html>
