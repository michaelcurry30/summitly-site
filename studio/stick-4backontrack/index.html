<script>
// "4 WAYS TO GET BACK ON TRACK. ONLY 1 WORKS." — FOURPANEL_BIBLE.md format, no VO, loops.
const S = Stick, F = FourPanel, { seg, oC, iC, io, oBack, lerp, clamp, tri, hash } = S;
const PI = Math.PI, TAU = 2 * PI;
const T = {
  dur: 22.3, go: 1.0, POWER: 15.0,
  // wait for Monday: arms crossed, the calendar fills with X, a beard grows, Monday alarm, snooze, falls asleep
  mDay: k => 1.0 + k * .95, mSay: 1.4, mWatch: 3.6, mTap: 5.0, mYawn: 7.0, mRing: 8.2, mFall: 9.0,
  // all at once: juggles more and more habits, everything crashes down on him
  aAdd: k => 1.0 + k * .9, aN: 8, aPanic: 6.4, aCrash: 8.6,
  // give up: crumples the missed calendar page, tosses it, "WHATEVER", lies down, rain cloud, zap
  gLook: 1.0, gCrum: 1.8, gToss: 2.8, gShrug: 3.8, gLie: 5.0, gCloud: 6.0, gRain: 7.0, gZap: 9.6,
  // tiny bit today: one tiny squat, tick the calendar, again
  day: k => 1.0 + k * 1.1, tGo: 13.2,
  stamps: [15.94, 16.41, 16.88, 17.34], hookOut: 17.55, les0: 17.81, cta: 19.4, lesOut: 21.55, reset: 21.57, hookIn: 21.8,
};
const FP = F.create({
  labels: ['WAIT FOR|MONDAY', 'DO IT ALL|AT ONCE', 'JUST|GIVE UP', 'DO A|TINY BIT'], s: 1.15,
  hook: ['4 WAYS TO GET BACK ON TRACK.', '<i class="fp-hl" style="font-style:normal">ONLY 1</i> WORKS.'], hookMax: [82, 100],
  lesson: ['JUST DO', '<i class="fp-hl">A TINY BIT</i> TODAY.'], lessonMax: [100, 100], T,
  cta: 'FOLLOW FOR <b>MORE</b>',
});
const Q = FP.Q, s = FP.s, z = s / .8, RS = T.reset;
const TL = S.ninja.timeline, W2 = (n, p) => S.ninja.toWorld(n, p), resetK = FP.resetK, shk = F.shk;
const H0 = -172, st = o => Object.assign({ hip: [0, H0], lean: .04, tilt: 0, hr: [22, -150], hl: [-12, -152], fr: [24, 0], fl: [-24, 0], tail: .3, face: 'n' }, o);
// juggling: hands alternate up and down in front
S.ninja.POSE.bJug = (u, a) => { const r = a.rate || 9, c = Math.sin(u * r), j = a.jit ? Math.sin(u * 47) * 4 : 0;
  return st({ hip: [j, H0 + 2 * Math.abs(c)], lean: -.04, hr: [110 + j, -300 - 50 * c], hl: [70 - j, -300 + 50 * c], fr: [40, 0], fl: [-40, 0], face: a.face || 'h', tail: .5 }); };
// tap foot, arms crossed, impatient
S.ninja.POSE.bTap = (u, a) => { const b = Math.max(0, Math.sin(u * 14));
  return st({ hip: [0, H0], lean: -.03, hr: [36, -186], hl: [-36, -188], fr: [44, -16 * b], fl: [-40, 0], face: a.face || 'm', front: 1, elbowOut: 1 }); };
// look at the wrist (watch)
S.ninja.POSE.bWatch = (u, a) => st({ lean: .06, hr: [60, -250], hl: [70, -232], fr: [40, 0], fl: [-36, 0], face: a.face || 'w' });
// yawn, arms stretched up
S.ninja.POSE.bYawn = u => st({ lean: -.08, tilt: -.3, hr: [50, -420], hl: [-30, -420], fr: [40, 0], fl: [-40, 0], face: 'z', tail: .3 });
// holding a page in front, looking at it
S.ninja.POSE.bHold = (u, a) => st({ lean: .08, tilt: .2, hr: [110, -270], hl: [80, -264], fr: [40, 0], fl: [-36, 0], face: a.face || 'w' });
const SAD = { face: 'w' };
const tl = [
  TL([[0, 'qCross', { face: 'n' }], [T.go, 'bTap', { face: 'm' }, .2], [T.mSay + .9, 'point', { ang: -10, face: 'h' }, .2], [T.mWatch - .4, 'bTap', { face: 'm' }, .2], [T.mWatch, 'bWatch', {}, .2], [T.mTap, 'bTap', { face: 'b' }, .2],
      [6.2, 'bWatch', { face: 'b' }, .2], [T.mYawn, 'bYawn', {}, .25], [T.mRing - .2, 'bTap', { face: 'z' }, .2], [T.mFall, 'fall', {}, .1], [T.mFall + .4, 'qLie', { face: 'z' }, .15], [RS, 'qCross', { face: 'n' }, .45]]),
  null,
  TL([[0, 'qCross', { face: 'n' }], [T.gLook, 'bHold', { face: 'w' }, .2], [T.gCrum, 'bHold', { face: 'd' }, .1], [T.gToss, 'throw', {}, .1], [T.gShrug, 'shrug', {}, .2],
      [T.gLie, 'qLie', { face: 'b' }, .3], [T.gRain, 'qLie', { face: 'w' }, .2], [T.gZap, 'qLie', { face: 'x' }, .05], [RS, 'qCross', { face: 'n' }, .45]]),
  null,
];
{ const k = [[0, 'qCross', { face: 'n' }], [T.go - .1, 'bJug', { rate: 8, face: 'h' }, .15], [3.8, 'bJug', { rate: 11, face: 'd' }, .2], [T.aPanic, 'bJug', { rate: 16, face: 's', jit: 1 }, .2],
    [T.aCrash, 'qWreck', {}, .1], [RS, 'qCross', { face: 'n' }, .45]]; tl[1] = TL(k); }
{ const k = [[0, 'qCross', { face: 'n' }]];
  for (let d = 0; d < 11; d++) { const a = T.day(d); k.push([a, 'qSquat', { rate: 9, face: 'h' }, .12], [a + .72, 'qTick', { x: 175, y: -360, per: 9 }, .12]); }
  k.push([T.tGo, 'qJack', { rate: 11, face: 'h' }, .15], [T.POWER - .1, 'qCross', {}, .12], [T.stamps[0], 'qFlex', {}, .15], [17.4, 'qCross', {}, .3], [18.9, 'qFlex', {}, .2], [20.0, 'qCross', {}, .3], [21.0, 'qFlex', {}, .2], [RS, 'qCross', { face: 'n' }, .4]);
  tl[3] = TL(k); }
const failT = [T.mFall, T.aCrash, T.gZap];
const glowOf = (i, t) => FP.glow(i, t, { fail: failT[i], power: T.POWER, build: [2, 13] });

// ---- props
const COLS = ['#ff7ab8', '#3fa9ff', '#ffd23f', '#4dff9a', '#ff9a3f', '#cfd6ff'];
function habitProp(ctx, x, y, kind, zz, rot = 0) {   // dumbbell, book, apple, water bottle, broom-ish brush, guitar pick (centred)
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(zz, zz);
  switch (kind % 8) {
    case 0: ctx.fillStyle = '#9aa0bf'; ctx.fillRect(-26, -4, 52, 8); ctx.fillStyle = '#3a3f5c'; F.rr(ctx, -40, -16, 16, 32, 4); ctx.fill(); F.rr(ctx, 24, -16, 16, 32, 4); ctx.fill(); break;
    case 1: ctx.fillStyle = '#ff7a59'; F.rr(ctx, -26, -20, 52, 40, 4); ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.fillRect(-20, -14, 40, 6); break;
    case 2: ctx.fillStyle = '#ff3b4e'; ctx.beginPath(); ctx.arc(-8, 2, 18, 0, TAU); ctx.arc(8, 2, 18, 0, TAU); ctx.fill(); ctx.fillStyle = '#4dff9a'; ctx.beginPath(); ctx.ellipse(6, -20, 10, 5, -.5, 0, TAU); ctx.fill(); break;
    case 3: ctx.fillStyle = '#3fa9ff'; F.rr(ctx, -13, -28, 26, 56, 8); ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.fillRect(-7, -38, 14, 10); break;
    case 4: ctx.fillStyle = '#4dff9a'; F.rr(ctx, -30, -10, 60, 20, 8); ctx.fill(); ctx.fillStyle = '#2ed27a'; ctx.beginPath(); ctx.arc(-14, -12, 10, 0, TAU); ctx.arc(4, -14, 12, 0, TAU); ctx.arc(18, -10, 9, 0, TAU); ctx.fill(); break;
    case 5: ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(-28, -20); ctx.lineTo(28, -20); ctx.lineTo(18, 22); ctx.lineTo(-18, 22); ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.fillRect(-28, -26, 56, 8); break;
    case 6: ctx.fillStyle = '#cfd6ff'; F.rr(ctx, -24, -18, 48, 36, 6); ctx.fill(); ctx.fillStyle = '#3a4060'; F.rr(ctx, -18, -12, 36, 22, 4); ctx.fill(); break;
    default: ctx.fillStyle = '#ff9a3f'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.fill(); ctx.strokeStyle = '#12131c'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(20, 0); ctx.moveTo(0, -20); ctx.lineTo(0, 20); ctx.stroke();
  }
  ctx.restore();
}
function beard(ctx, hc, k, zz, flip = 1) {      // grey beard under the face that grows with k
  if (k <= 0) return; ctx.save(); ctx.translate(hc[0], hc[1]); ctx.scale(flip, 1); ctx.fillStyle = '#c9cce0'; ctx.globalAlpha = .95;
  const L = (20 + 120 * k) * zz; ctx.beginPath(); ctx.moveTo(-26 * zz, 22 * zz); ctx.quadraticCurveTo(-10 * zz, 36 * zz + L * .6, 10 * zz, 30 * zz + L); ctx.quadraticCurveTo(30 * zz, 30 * zz + L * .5, 40 * zz, 16 * zz); ctx.closePath(); ctx.fill(); ctx.restore();
}
function rainCloud(ctx, x, y, zz, k, rain, t, dark) {
  if (k <= 0) return; const e = oBack(clamp(k));
  ctx.save(); ctx.translate(x, y + Math.sin(t * 2) * 4); ctx.scale(e * zz, e * zz);
  if (rain > 0) { ctx.strokeStyle = '#8fd0ff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let i = 0; i < 12; i++) { const h = hash(i * 3.7), p = (t * 1.8 + h) % 1; ctx.globalAlpha = rain * (1 - p * .6); const px = (h - .5) * 150, py = 30 + p * 260;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - 4, py + 20); ctx.stroke(); } ctx.globalAlpha = 1; }
  ctx.fillStyle = dark ? '#3a3d52' : '#6a6e88'; [[-50, 0, 36], [-14, -20, 44], [30, -12, 40], [58, 8, 30], [0, 12, 36]].forEach(([px, py, r]) => { ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.fill(); });
  ctx.restore();
}
function bolt(ctx, x0, y0, x1, y1, a) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#fff36b'; ctx.lineWidth = 10; ctx.lineJoin = 'miter'; ctx.beginPath(); ctx.moveTo(x0, y0);
  for (let k = 1; k < 6; k++) ctx.lineTo(lerp(x0, x1, k / 6) + (k % 2 ? 22 : -22), lerp(y0, y1, k / 6)); ctx.lineTo(x1, y1); ctx.stroke(); ctx.restore();
}
function bin(ctx, x, y, zz) { ctx.save(); ctx.translate(x, y); ctx.scale(zz, zz); ctx.fillStyle = '#3a3f5a'; ctx.beginPath(); ctx.moveTo(-34, -80); ctx.lineTo(34, -80); ctx.lineTo(26, 0); ctx.lineTo(-26, 0); ctx.fill();
  ctx.fillStyle = '#4a5072'; F.rr(ctx, -40, -88, 80, 12, 4); ctx.fill(); ctx.restore(); }
function missedPage(ctx, x, y, zz, rot, crumple) {  // a calendar page with red X marks
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(zz, zz);
  if (crumple < .5) { const w = lerp(90, 40, crumple * 2), h = lerp(100, 44, crumple * 2); ctx.fillStyle = '#f4f2ff'; F.rr(ctx, -w / 2, -h / 2, w, h, 6); ctx.fill(); ctx.fillStyle = '#ff3b4e'; ctx.fillRect(-w / 2, -h / 2, w, 16);
    ctx.strokeStyle = '#ff3b4e'; ctx.lineWidth = 5; ctx.lineCap = 'round'; for (let k = 0; k < 4; k++) { const cx = -w / 4 + (k % 2) * w / 2, cy = -h / 2 + 16 + (h - 16) * (k < 2 ? .3 : .72), m = 10 * (1 - crumple);
      ctx.beginPath(); ctx.moveTo(cx - m, cy - m); ctx.lineTo(cx + m, cy + m); ctx.moveTo(cx + m, cy - m); ctx.lineTo(cx - m, cy + m); ctx.stroke(); } }
  else { ctx.fillStyle = '#f1efff'; ctx.beginPath(); for (let k = 0; k < 9; k++) { const a = k / 9 * TAU, r = 22 + 6 * hash(k * 1.7); ctx.lineTo(r * Math.cos(a), r * Math.sin(a)); } ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#ff3b4e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-10, -6); ctx.lineTo(4, 4); ctx.moveTo(4, -8); ctx.lineTo(-6, 6); ctx.stroke(); }
  ctx.restore();
}

function draw(ctx, i, t, q) {
  const Gl = glowOf(i, t), J = tl[i](t), r = resetK(t), live = t < RS;
  const o = { seed: i * .7 };
  let pos = { x: q.x0 + 170, y: q.fl, s, fx: 1 };

    const mon = live && t > T.mRing;
    F.calendar(ctx, CX0, CY0, CW, CH, 4, 3, k => k < nx ? 'x' : (k === 11 && mon ? 'v' : ''), k => k < 8 ? seg(t, T.mDay(k), T.mDay(k) + .3) : seg(t, T.mRing, T.mRing + .3), { col: '#ffd23f' });
    if (live && t > T.mRing - .4 && t < T.mFall + .5) F.clock(ctx, q.x0 + 385, CY0 + CH + 110, z * .45, 7, t > T.mRing && t < T.mFall + .6 ? 1 : 0, t);

  }
  if (i === 1) pos.x = q.x0 + 140;
  if (i === 1 && t >= T.aCrash && t < RS + .3) pos.x = q.x0 + 150;
  if (i === 2) {
    pos.x = q.x0 + 150;
    bin(ctx, q.x0 + 440, q.fl, z * .8);
    if (t >= T.gLie && t < RS + .3) pos.x = q.x0 + 170;
  }
  if (i === 3) {
    const nd = live ? Array.from({ length: 11 }, (_, k) => k).filter(k => t > T.day(k) + .8).length : 0;
    F.calendar(ctx, CX0, CY0, CW, CH, 5, 3, k => k < 3 ? 'x' : (k - 3 < nd ? 'v' : ''), k => k < 3 ? 1 : seg(t, T.day(k - 3) + .8, T.day(k - 3) + 1.1), { col: '#b26bff' });
  }
  const n = S.ninja.pose(t, Object.assign({ J }, pos));
  if (i === 0 && t >= T.mFall + .4 && t < RS + .3) n.y = q.fl - 6;
  if (i === 1 && t >= T.aCrash && t < RS + .3) { n.fx = -1; n.y = q.fl - 6; n.x = q.x0 + 300; }
  if (i === 2 && t >= T.gLie && t < RS + .3) n.y = q.fl - 6;
  const sk = S.ninja.skel(n), hand = W2(n, sk.armF[2]), handB = W2(n, sk.armB[2]), hc = W2(n, sk.hc);
  if (i === 3 && t >= T.POWER && t < RS) o.face = null;
  if (i === 1 && t >= T.aCrash && t < RS) o.face = 'x';
  F.neon(ctx, n, q, Gl, o);
  // ---- front
  if (i === 0) {
    const bk = live ? seg(t, 2.0, T.mFall) : 0;
    if (t < T.mFall + .1) beard(ctx, hc, bk, z * .8, 1);
    F.bubble(ctx, q.x0 + 320, q.y0 + 430, 'MONDAY!', seg(t, T.mSay, T.mSay + 1.6), { size: 50, rot: .05 });
    F.bubble(ctx, q.x0 + 330, q.y0 + 430, 'NEXT MONDAY...', seg(t, T.mFall + .5, T.mFall + 3.2), { size: 42, rot: .04, bg: '#ff3b4e', col: '#ffffff' });
    F.impact(ctx, hc[0], q.fl - 40, t, T.mFall + .4, '#ffffff', z, .4, 8);
    if (live && t > T.mFall + .6) F.zzz(ctx, hc[0] + 10, hc[1] - 40, t, 1, z);
  }
  if (i === 1) {
    const nIn = live ? Array.from({ length: T.aN }, (_, k) => k).filter(k => t > T.aAdd(k)).length : 0;
    const ox = q.x0 + 330, oy = q.y0 + 380, crash = t >= T.aCrash;
    if (live && !crash) {
      const sp = t < 3.8 ? 3.2 : t < T.aPanic ? 4.6 : 7;
      for (let k = 0; k < nIn; k++) { const a = t * sp + k * TAU / Math.max(nIn, 1), e = oBack(seg(t, T.aAdd(k), T.aAdd(k) + .3));
        const px = ox + Math.cos(a) * 130, py = oy + Math.sin(a) * 140 * (k % 2 ? .9 : 1);
        habitProp(ctx, px, py, k, z * .75 * e, a); }
      for (let k = 0; k < T.aN; k++) F.impact(ctx, ox + 140, oy - 120, t, T.aAdd(k), q.col, z * .5, .25, 6);
    }
    if (live && crash) for (let k = 0; k < T.aN; k++) { const u = oC(seg(t, T.aCrash + k * .04, T.aCrash + .3 + k * .04)), tx = q.x0 + 200 + (k % 4) * 60, ty = q.fl - 24 - Math.floor(k / 4) * 40;
      habitProp(ctx, lerp(ox + Math.cos(k) * 120, tx, u), lerp(oy - 100, ty, u), k, z * .75, k * .7 + u * 2); }
    F.bubble(ctx, q.x0 + 330, q.y0 + 210, 'ALL OF IT!', seg(t, T.go + .1, T.go + 1.7), { size: 46, rot: .05 });
    F.bubble(ctx, q.x0 + 330, q.y0 + 210, 'AAAH!', seg(t, T.aPanic + .4, T.aCrash), { size: 52, rot: -.05, bg: '#ff3b4e', col: '#ffffff' });

  }

    if (live && t >= T.gLook && t < T.gToss + .25) missedPage(ctx, hand[0] + 10, hand[1] - 50, z * .9, .1, oC(seg(t, T.gCrum, T.gCrum + .5)));
    { const u = seg(t, T.gToss + .25, T.gToss + .85); if (live && u > 0 && u < 1) missedPage(ctx, lerp(hand[0], q.x0 + 440, u), lerp(q.y0 + 420, q.fl - 90 * z * .8, u) - 160 * Math.sin(PI * u), z * .9, u * 8, 1); }
    F.impact(ctx, q.x0 + 440, q.fl - 90, t, T.gToss + .85, q.col, z * .6, .3, 6);
    F.bubble(ctx, q.x0 + 320, q.y0 + 300, 'WHATEVER.', seg(t, T.gShrug, T.gShrug + 1.5), { size: 46, rot: .05 });
    const ck = live ? seg(t, T.gCloud, T.gCloud + .4) : 0, rain = live ? seg(t, T.gRain, T.gRain + .4) : 0;
    const cx = clamp(hc[0] + 50, q.x0 + 150, q.x0 + 400); rainCloud(ctx, cx, q.y0 + 330, z * .9, ck, rain, t, t > T.gZap - .3);
    { const zf = live ? tri(t, T.gZap - .05, T.gZap + .35) : 0; bolt(ctx, cx, q.y0 + 380, hc[0], hc[1] - 30, zf);

    if (live && t > T.gZap + .2) for (let k = 0; k < 3; k++) { const p = (t * .8 + k / 3) % 1; ctx.save(); ctx.globalAlpha = .6 * (1 - p); ctx.fillStyle = '#8a8ea8'; ctx.beginPath(); ctx.arc(hc[0] - 10 + 10 * Math.sin(t * 3 + k), hc[1] - 50 - 90 * p, 12 + 14 * p, 0, TAU); ctx.fill(); ctx.restore(); }
  }
  if (i === 3) {
    F.bubble(ctx, q.x0 + 330, q.y0 + 450, 'JUST ONE.', seg(t, T.go + .1, T.go + 1.6), { size: 46, rot: .05 });
    for (let k = 0; k < 11; k++) { const d = T.day(k) + .8; if (t > d && t < d + 1) F.tick(ctx, hand[0] - 10, hand[1] + 50, seg(t, d, d + 1), z * .9); }
    if (t > T.tGo && t < T.POWER) F.sweat(ctx, hc, t, .5, 0, z);
    F.power(ctx, q, n.x, q.fl, t, T.POWER, RS, z);
  }
}
function seek(t) {
  FP.frame(t, {
    glow: glowOf, draw,
    shake: (i, t) => (i === 0 ? shk(t, T.mFall + .4, .35, 9) : 0) + (i === 1 ? shk(t, T.aCrash + .3, .4, 11) : 0) + (i === 2 ? shk(t, T.gZap, .4, 10) : 0) + (i === 3 ? shk(t, T.POWER, .3, 9) : 0),
    flash: (i, t) => i === 3 ? tri(t, T.POWER, T.POWER + .5) : 0,
  });
}
S.boot({ duration: T.dur, fps: 30, seek, ready: FP.ready });
