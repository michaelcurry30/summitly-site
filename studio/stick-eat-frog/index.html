/* frog(ctx, x, y(bottom), s, t, {mood:'smug'|'shock'|'cute', croak 0..1, label, fx, rot}) — THE TASK FROG, ~300*s tall */
function frog(ctx, x, y, s, t, o = {}) {
  const mood = o.mood || 'smug', cr = o.croak || 0, br = 1 + .02 * Math.sin(t * 2.4);
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || 0); ctx.scale(s * (o.fx || 1), s * br);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, 0, 190, 22, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2f9e57'; [-1, 1].forEach(sx => { ctx.beginPath(); ctx.ellipse(sx * 150, -40, 70, 44, sx * .3, 0, Math.PI * 2); ctx.fill(); });
  ctx.fillStyle = '#46c46f'; ctx.beginPath(); ctx.ellipse(0, -130, 180, 130, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#b8f2a6'; ctx.beginPath(); ctx.ellipse(0, -80, 120, 70, 0, 0, Math.PI * 2); ctx.fill();
  if (cr > 0) { ctx.fillStyle = '#e9ffd9'; ctx.beginPath(); ctx.ellipse(0, -150, 70 * cr, 55 * cr, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#2f9e57'; [-1, 1].forEach(sx => { ctx.beginPath(); ctx.ellipse(sx * 46, -24, 26, 34, 0, 0, Math.PI * 2); ctx.fill(); });
  [-1, 1].forEach(sx => { ctx.fillStyle = '#46c46f'; ctx.beginPath(); ctx.arc(sx * 82, -240, 56, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sx * 82, -244, 40, 0, Math.PI * 2); ctx.fill();
    const lid = mood === 'smug' ? .45 + .4 * (Math.sin(t * 1.3) > .96 ? 1 : 0) : (mood === 'shock' ? 0 : .15);
    ctx.fillStyle = '#10142a'; ctx.beginPath(); ctx.arc(sx * 82 + (o.look || 0) * 10, -238, mood === 'shock' ? 12 : 18, 0, Math.PI * 2); ctx.fill();
    if (lid > 0) { ctx.fillStyle = '#2f9e57'; ctx.beginPath(); ctx.rect(sx * 82 - 44, -290, 88, 92 * lid); ctx.fill(); } });
  ctx.strokeStyle = '#10142a'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath();
  if (mood === 'shock') { ctx.ellipse(0, -178, 26, 20, 0, 0, Math.PI * 2); } else { ctx.moveTo(-110, -186); ctx.quadraticCurveTo(0, mood === 'cute' ? -150 : -160, 110, -186 - (mood === 'smug' ? 18 : 0)); }
  ctx.stroke();
  if (o.label) { ctx.fillStyle = '#1d5a33'; ctx.font = '800 64px BS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(o.label, 0, -76); }
  ctx.restore();
}
function desk(ctx) {
  ctx.fillStyle = '#3a2440'; ctx.fillRect(500, 1262, 560, 22); ctx.fillStyle = '#ffb36b'; ctx.globalAlpha = .4; ctx.fillRect(500, 1262, 560, 5); ctx.globalAlpha = 1;
  ctx.fillStyle = '#24162c'; ctx.fillRect(530, 1284, 18, 216); ctx.fillRect(1010, 1284, 18, 216); ctx.fillRect(340, 1400, 150, 16); ctx.fillRect(354, 1416, 14, 84); ctx.fillRect(462, 1416, 14, 84);
}
function battery(ctx, x, y, s, k) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 10; ctx.beginPath(); ctx.roundRect(-70, -130, 140, 240, 22); ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.fillRect(-28, -152, 56, 20);
  const n = Math.round(4 * clamp(k)); for (let i = 0; i < n; i++) { ctx.fillStyle = '#5dffa8'; ctx.beginPath(); ctx.roundRect(-52, 50 - i * 56, 104, 44, 8); ctx.fill(); }
  ctx.restore();
}

const payTr = S.track([[21.6, 250, 1500, 1.15, 0], [22.1, 470, 1500, 1.15, 0]]);
const croakK = (t, a) => tri(t, a, a + .5);

const SC = [
  { a: 0, b: SCENES.hook[1], env: E.lib, cam: t => ({ x: lerp(640, 680, seg(t, 0, 2.4)), y: 1110, z: lerp(1.2, 1.28, io(seg(t, 0, 2.4))) + .05 * tri(t, T.land, T.land + .3) }),
    draw(ctx, t) {

      ctx.save(); ctx.translate(800, 1262 - 300 * (1 - p * p)); ctx.scale(2 - sq, sq); frog(ctx, 0, 0, .95, t, { mood: 'smug', croak: croakK(t, T.croak[0]), label: 'ESSAY' }); ctx.restore();
      S.sparks(ctx, t, T.land, 800, 1262, { n: 12, seed: 2, speed: 500, dir: -Math.PI / 2, spread: 2.8, life: .35, g: 1200 });
      D(ctx, nin(t, hookTL(t), { x: 330, y: 1500, s: 1, look: [6, -4] }));
    } },
  { a: SCENES.dodge[0], b: SCENES.dodge[1], env: E.lib, whip: 'cut', cam: t => ({ x: 560, y: 1080, z: lerp(1.05, 1.12, seg(t, 2.4, 4.3)) }),
    draw(ctx, t) {
      desk(ctx); const nx = dodgeTr(t).x;
      frog(ctx, 800, 1262, .95, t, { mood: 'smug', label: 'ESSAY', look: lerp(-1, 1, seg(nx, 120, 600)) });
      D(ctx, nin(t, dodgeTL(t), Object.assign({ vx: 160, face: 'w', look: [6, -6] }, dodgeTr(t))));
    } },
  { a: SCENES.mail[0], b: SCENES.mail[1], env: E.bed, whip: 'right', cam: t => ({ x: 640, y: 1090, z: lerp(1.42, 1.5, seg(t, 4.3, 5.9)), r: 3 }),
    envOpt: () => ({ lamp: .9 }),
    draw(ctx, t) { S.laptop(ctx, 720, 1262, 1, { on: true, lines: 5 }); D(ctx, nin(t, mailTL(t), { x: 455, y: 1500, s: 1 }));
      for (let i = 0; i < 6; i++) { const a = 4.5 + i * .2, p = seg(t, a, a + .6); if (p <= 0 || p >= 1) continue; S.mail(ctx, 760 + (hash(i * 3) - .2) * 380 * p, 1150 - 340 * oC(p) + 220 * p * p, .9, (hash(i) - .5) * 60 * p); }
      [5.0, 5.5].forEach((a, i) => S.check(ctx, 900, 1060, .45, seg(t, a, a + .3) * (1 - seg(t, a + .4, a + .5)))); } },
  { a: SCENES.notes[0], b: SCENES.notes[1], env: E.hall, whip: 'cut', cam: t => ({ x: 560, y: 1080, z: 1.5, r: -3 }),
    draw(ctx, t) { for (let i = 0; i < 4; i++) { const k = oBack(seg(t, 5.95 + i * .1, 6.1 + i * .1), 2.4); if (k > 0) { ctx.save(); ctx.translate(640 + (i % 2) * 120, 1020 + Math.floor(i / 2) * 120); ctx.scale(k, k); S.note(ctx, 0, 0, .8, (hash(i) - .5) * 14, ''); ctx.restore(); } }
      D(ctx, nin(t, notesTL(t), { x: 460, y: 1500, s: 1 })); } },
  { a: SCENES.snack[0], b: SCENES.snack[1], env: E.kit, whip: 'cut', cam: t => ({ x: 500, y: 1080, z: 1.55, r: 3 }),
    draw(ctx, t) { const n = nin(t, snackTL(t), { x: 470, y: 1500, s: 1 }); D(ctx, n); const hb = W2(n, sk(n).armB[2]); S.chips(ctx, hb[0] + 30, hb[1] - 30, .9, 12); } },
  { a: SCENES.sits[0], b: SCENES.sits[1], env: E.lib, whip: 'left', cam: t => ({ x: lerp(760, 740, seg(t, 7.1, 8.8)), y: 1140, z: lerp(1.5, 1.62, io(seg(t, 7.1, 8.8))) }),
    draw(ctx, t) { desk(ctx); S.wallClock(ctx, 560, 980, .9, 0, { t0: 10 + 6 * io(seg(t, 7.1, 8.8)) });
      frog(ctx, 820, 1262, .95, t, { mood: 'smug', label: 'ESSAY', croak: croakK(t, T.croak[1]), look: -1 });
      D(ctx, nin(t, sitsTL(t), { x: lerp(330, 420, io(seg(t, 7.3, 8.0))), y: 1500, s: 1, look: [6, -4] })); } },
  { a: SCENES.tonight[0], b: SCENES.tonight[1], env: E.hall, whip: 'right', cam: t => ({ x: lerp(560, 590, seg(t, 8.8, 10.4)), y: 1120, z: lerp(1.3, 1.36, seg(t, 8.8, 10.4)) }),
    draw(ctx, t) { ctx.fillStyle = '#2a2f55'; ctx.fillRect(330, 1400, 170, 100);
      wTon0.draw(ctx, t, { in: T.drop - .2, mode: 'drop', h: 380, wob: .4 });
      D(ctx, nin(t, tonTL(t), { x: 400, y: 1500, s: 1, look: [4, 2] })); } },
  { a: SCENES.night[0], b: SCENES.night[1], env: E.bed, whip: 'left', cam: t => ({ x: lerp(560, 600, seg(t, 10.4, 12.4)), y: 1110, z: lerp(1.2, 1.3, io(seg(t, 10.4, 12.4))) }),
    envOpt: () => ({ lamp: .25 }),
    draw(ctx, t) { const g = 1 + .25 * io(seg(t, 11.0, 12.0));
      frog(ctx, 820, 1262, .95 * g, t, { mood: 'smug', label: 'ESSAY', croak: croakK(t, T.croak[2]), look: -1 });
      const n = nin(t, nightTL(t), Object.assign({ vx: t < 11 ? 250 : 0, face: 'x' }, nightTr(t))); D(ctx, n);
      if (t > 11.2) { const hc = W2(n, sk(n).hc); ctx.save(); ctx.fillStyle = '#9fe9ff'; ctx.font = '800 50px BS'; ctx.globalAlpha = .8;
        for (let i = 0; i < 3; i++) { const p = ((t - 11.2) * .8 + i / 3) % 1; ctx.globalAlpha = Math.sin(Math.PI * p); ctx.fillText('z', hc[0] + 40 + 40 * p + i * 6, hc[1] - 50 - 120 * p); } ctx.restore(); } } },
  { a: SCENES.roof[0], b: SCENES.roof[1], env: E.roof, whip: 'up', cam: t => {
      const push = io(seg(t, 12.6, T.TH)) * .07, punch = .05 * tri(t, T.TH, T.TH + .25);
      return { x: lerp(545, 575, seg(t, 12.4, 14.2)), y: lerp(900, 880, seg(t, 12.4, 14.2)), z: 1.2 + push + punch }; },
    draw(ctx, t) { wTon.draw(ctx, t, { in: 12.5, mode: 'pop', cut: T.TH, wob: .6, kick: 1.2, fadeAt: 14.0 });
      D(ctx, nin(t, roofTL(t), Object.assign({ ground: 1500 }, roofTr(t)))); } },
  { a: SCENES.eat[0], b: SCENES.eat[1], env: E.libD, whip: 'left', cam: t => ({ x: lerp(560, 640, seg(t, 14.2, 17.2)), y: 1090, z: lerp(1.12, 1.2, io(seg(t, 14.2, 17.2))) + .04 * tri(t, T.toss, T.toss + .3) }),
    draw(ctx, t) {
      desk(ctx);
      const n = nin(t, eatTL(t), Object.assign({ vx: t < T.grab - .2 ? 400 : 0 }, eatTr(t)));
      if (t < T.grab) frog(ctx, 760, 1262, .8, t, { mood: t > 14.7 ? 'shock' : 'smug', label: 'ESSAY' });
      D(ctx, n);
      if (t >= T.grab && t < T.toss) { const h = hand(n); frog(ctx, h[0] + 10, h[1] + 60 + 120 * (1 - seg(t, T.grab, T.lift)), .55, t, { mood: 'shock', label: 'ESSAY' }); }
      if (t >= T.toss) { const p = seg(t, T.toss, T.toss + .8); if (p < 1) frog(ctx, lerp(500, 1300, p), lerp(1050, 600, p) + 500 * p * p, .55 * (1 - .4 * p), t, { mood: 'shock', label: 'ESSAY', rot: 8 * p }); }
      S.check(ctx, 760, 1120, .9, seg(t, 16.55, 16.95));
      S.sparks(ctx, t, 16.55, 760, 1120, { n: 14, seed: 5, speed: 600, life: .4, g: 500, cols: ['#5dffa8', '#ffffff'] });
    } },
  { a: SCENES.fresh[0], b: SCENES.fresh[1], env: E.mtn, whip: 'right', envOpt: () => ({ rise: .7 }), cam: t => ({ x: 560, y: 1070, z: lerp(1.3, 1.38, seg(t, 17.2, 19.0)) }),
    draw(ctx, t) { battery(ctx, 790, 1180, .9, seg(t, 17.4, 18.4));
      D(ctx, nin(t, freshTL(t), { x: 420, y: 1500, s: 1.05 }));
      S.sparks(ctx, t, 18.4, 790, 1080, { n: 12, seed: 7, speed: 500, life: .4, g: 300, cols: ['#5dffa8', '#ffffff'] }); } },
  { a: SCENES.rest[0], b: SCENES.rest[1], env: E.void, whip: 'left', cam: t => ({ x: 540, y: 1100, z: lerp(1.15, 1.22, seg(t, 19.0, 21.6)) }),
    draw(ctx, t) { ctx.fillStyle = '#0a1c28'; ctx.fillRect(-600, 1500, 2400, 400);
      [[19.3, 'mail'], [19.8, 'note'], [20.3, 'chips']].forEach(([a, k], i) => { const p = oBack(seg(t, a - .3, a), 2), x = 720 + (i - 1) * 0, y = 1300 - i * 150;

];

function seek(t) {
  const sh = wTon.shake(t, T.TH), imp = (a, amp) => t >= a && t < a + .22 ? Math.round(amp * (1 - (t - a) / .22) * Math.sin(t * 120)) : 0;

  W.seek(t, SC, { shake: [sh[0], sh[1] + imp(T.land, 8) + imp(lt, 5) + imp(T.toss + .3, 4)], flash: wTon.flash(t, T.TH), flashColor: '#3ee6ff' });
