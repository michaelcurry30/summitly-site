<!doctype html>
<html><head><meta charset="utf-8"><title>4 Ways To Build A Habit</title>
<script src="kit/stick.js"></script>
<script src="kit/fourpanel.js"></script>
</head>
<body><div id="stage"></div>
<script>
// "4 WAYS TO BUILD A HABIT. ONLY 1 STICKS." — FOURPANEL_BIBLE.md format, no VO, loops.
const S = Stick, F = FourPanel, { seg, oC, iC, io, oBack, lerp, clamp, tri, hash } = S;
const PI = Math.PI, TAU = 2 * PI;
const T = {
  dur: 22.3, go: 1.0, POWER: 15.0,
  // going all in
  aJack: 1.0, aCurl: 2.1, aPush: 3.1, aDone: 4.0, aDay2: 4.6, aGet: 6.0, aLimp: 6.8, aLift: 8.0, aDrop: 8.4, aQuit: 9.0, aX: [9.3, 9.75, 10.2, 10.65, 11.1, 11.55, 12.0, 12.45, 12.9],
  // waiting for motivation
  wIn: [1.2, 4.0], wOut: [2.5, 5.1], wFall: 5.2, wWeb: 6.4, wSleep: 9.6, wPass: 11.0,
  // no plan
  nSquat: 1.0, nShrug: 2.2, nJack: 3.4, nPhone: 4.6, nPalm: 6.8, nCurl: 7.6, nQuit: 9.2, nSit: 10.4,
  nCells: [['v', 1.9], ['gap', 2.6], ['gap', 3.2], ['v', 4.1], ['gap', 5.2], ['gap', 6.2], ['v', 8.3], ['gap', 9.6], ['gap', 11.2], ['gap', 12.6]],
  // start tiny: day k at 1.0 + k*1.25, check at +.9
  day: k => 1.0 + k * 1.25, tGo: 13.55,
  stamps: [15.94, 16.41, 16.88, 17.34], hookOut: 17.55, les0: 17.81, cta: 19.4, lesOut: 21.55, reset: 21.57, hookIn: 21.8,
};
const FP = F.create({
  labels: ['GOING ALL IN', 'WAITING FOR|MOTIVATION', 'NO PLAN', 'START TINY'], s: 1.15,
  hook: ['4 WAYS TO BUILD A HABIT.', '<i class="fp-hl" style="font-style:normal">ONLY 1</i> STICKS.'], hookMax: [86, 100],
  lesson: ['START <i class="fp-hl">SO SMALL</i>', 'YOU CAN\'T FAIL.'], lessonMax: [100, 100], T,
});
const Q = FP.Q, s = FP.s, z = s / .8, RS = T.reset;
const TL = S.ninja.timeline, W2 = (n, p) => S.ninja.toWorld(n, p), resetK = FP.resetK, shk = F.shk;
const tl = [
  TL([[0, 'idle'], [T.aJack, 'qJack', { rate: 15 }, .12], [T.aCurl, 'qCurl', { rate: 11 }, .15], [T.aPush, 'pushup', {}, .2], [T.aDone, 'pump', {}, .2],
      [T.aDay2, 'qWreck', {}, .1], [T.aGet, 'getup', {}, .2], [T.aLimp, 'qLimp', {}, .2], [T.aLift, 'reach', { x: 140, y: -40, face: 'x' }, .2], [T.aDrop, 'crushed', { k: .9 }, .08],
      [T.aQuit, 'shrug', {}, .2], [T.aQuit + .9, 'qLie', { face: 'b' }, .3], [RS, 'idle', {}, .45]]),
  TL([[0, 'qCouch'], [T.wIn[0], 'qCouch', { face: 'h' }, .15], [T.wOut[0], 'qCouch', { face: 'w' }, .15], [T.wIn[0] + 2.0, 'qCouch', { face: 'b' }, .2],
      [T.wIn[1], 'reachUp', { x: 120, y: -470, face: 'h' }, .2], [T.wFall, 'qCouch', { face: 'x' }, .1], [T.wFall + .8, 'qCouch', { face: 'b' }, .3],
      [T.wSleep, 'qCouch', { face: 'z' }, .4], [RS, 'qCouch', {}, .4]]),
  TL([[0, 'idle'], [T.nSquat, 'qSquat', { rate: 8, face: 'd' }, .15], [T.nShrug, 'shrug', {}, .2], [T.nJack, 'qJack', { rate: 12, face: 'd' }, .15],
      [T.nPhone, 'scroll', { sit: false, swipes: [.4, 1.0, 1.6] }, .25], [T.nPalm, 'facepalm', {}, .2], [T.nCurl, 'qCurl', { rate: 9, face: 'd' }, .15],
      [T.nQuit, 'shrug', {}, .2], [T.nSit, 'scroll', { sit: true, swipes: [.5, 1.3, 2.1, 2.9] }, .3], [RS, 'idle', {}, .45]]),
  null,
];
const tinyKeys = [[0, 'idle']];
for (let k = 0; k < 10; k++) { const d = T.day(k), mv = k < 3 ? ['qSquat', { rate: 5, face: 'h' }] : k < 6 ? ['qJack', { rate: 7, face: 'h' }] : k < 9 ? ['qCurl', { rate: 8, face: 'h' }] : ['qJack', { rate: 11, face: 'd' }];
  tinyKeys.push([d, mv[0], mv[1], .15], [d + .85, 'qTick', { x: 170, y: -300 }, .12]); }
tinyKeys.push([T.tGo, 'qJack', { rate: 13, face: 'd' }, .15], [T.POWER - .1, 'qCross', {}, .12], [T.stamps[0], 'qFlex', {}, .15], [17.4, 'qCross', {}, .3],
  [18.9, 'qFlex', {}, .2], [20.0, 'qCross', {}, .3], [21.0, 'qFlex', {}, .2], [RS, 'idle', {}, .3]);
tl[3] = TL(tinyKeys);
const failT = [T.aDay2 + 3.5, T.wSleep, T.nQuit];
const glowOf = (i, t) => FP.glow(i, t, { fail: failT[i], power: T.POWER, build: [2, 13] });
const pop = (t, a) => seg(t, a, a + .3);
const tinyDone = t => { let n = 0; for (let k = 0; k < 10; k++) if (t >= T.day(k) + .9) n++; return n; };
const dayOf = t => clamp(Math.floor((t - 1.0) / 1.25), 0, 9);

function strip(ctx, q, t, i) {          // 10-day calendar strip under the label
  const r = resetK(t), x = q.x0 + 30, y = q.labBot + 12, w = q.w - 60, h = 104;
  let state, pk;
  if (i === 0) { state = k => k === 0 ? 'v' : 'x'; pk = k => k === 0 ? pop(t, T.aDone) : pop(t, T.aX[k - 1]); }
  else if (i === 1) { state = () => 'gap'; pk = k => pop(t, 1.0 + (k + 1) * 1.25 - .2); }
  else if (i === 2) { state = k => T.nCells[k][0]; pk = k => pop(t, T.nCells[k][1]); }
  else { state = () => 'v'; pk = k => pop(t, T.day(k) + .9); }
  F.calendar(ctx, x, y, w, h, 10, 1, state, k => pk(k) * (1 - r), { col: q.col });
  // today's cell outline (time passing)
  if (t > 1.0 && t < 13.5 && !(i === 0 && t > T.aQuit) && !(i === 1 && t > T.wSleep)) { const k = i === 0 && t < T.aDay2 ? 0 : (i === 0 && t < T.aQuit ? 1 : dayOf(t)), cw = (w - 20) / 10;
    ctx.save(); ctx.strokeStyle = q.col; ctx.lineWidth = 4; ctx.globalAlpha = .7 + .3 * Math.sin(t * 8); F.rr(ctx, x + 10 + k * cw, y + 40, cw, h - 50, 6); ctx.stroke(); ctx.restore(); }
  if (i === 3 && t > T.POWER - .1 && t < RS) { ctx.save(); ctx.globalAlpha = tri(t, T.POWER - .05, T.POWER + .6); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 8; F.rr(ctx, x - 4, y - 4, w + 8, h + 8, 16); ctx.stroke(); ctx.restore(); }
}
function cobweb(ctx, x, y, R, k, flip = 1) {
  if (k <= 0) return; ctx.save(); ctx.globalAlpha = .7 * clamp(k); ctx.strokeStyle = '#d8dcf0'; ctx.lineWidth = 2.5; ctx.translate(x, y); ctx.scale(flip, 1);
  for (let a = 0; a <= 4; a++) { const an = a / 4 * PI / 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(an) * R * k, Math.sin(an) * R * k); ctx.stroke(); }
  for (let rI = 1; rI <= 3; rI++) { const rr2 = R * k * rI / 3.3; ctx.beginPath(); for (let a = 0; a <= 4; a++) { const an = a / 4 * PI / 2; ctx.lineTo(Math.cos(an) * rr2, Math.sin(an) * rr2); } ctx.stroke(); }
  ctx.restore();
}

function draw(ctx, i, t, q) {
  const Gl = glowOf(i, t), J = tl[i](t), r = resetK(t);
  strip(ctx, q, t, i);
  const o = { seed: i * .7 };
  let pos = { x: q.x0 + 200, y: q.fl, s, fx: 1 };
  if (i === 0) {
    if (t >= T.aPush && t < T.aDone) pos.x = q.x0 + 360;
    if (t >= T.aDay2 && t < T.aGet + .3) pos.x = q.x0 + 230;
    if (t >= T.aLimp && t < T.aLift) pos.x = q.x0 + lerp(250, 180, seg(t, T.aLimp, T.aLift));
    if (t >= T.aLift && t < T.aQuit) pos.x = q.x0 + 180;
    if (t >= T.aQuit + .9 && t < RS + .3) pos.x = q.x0 + 270;
    // dumbbells on the floor (when not held) + a towel
    const held = (t >= T.aCurl && t < T.aPush) || (t >= T.aLift && t < T.aDrop);
    if (!held) { F.dumbbell(ctx, q.x0 + 400, q.fl - 16 * z, z, 0); if (!(t >= T.aDrop && t < RS)) F.dumbbell(ctx, q.x0 + 440, q.fl - 16 * z, z, 0); }
    if (t > T.aDrop && t < RS) F.dumbbell(ctx, q.x0 + 330 + 30 * oC(seg(t, T.aDrop, T.aDrop + .3)), q.fl - 16 * z, z, .2 * (1 - seg(t, T.aDrop, T.aDrop + .4)));
    if (t > T.aQuit + 1.4 && t < RS) cobweb(ctx, q.x0 + 470, q.fl, 70, seg(t, T.aQuit + 1.4, T.aQuit + 4), -1);
  }
  if (i === 1) {
    pos.x = q.x0 + 150; F.couch(ctx, q.x0 + 180, q.fl, s * .95);
    if (t >= T.wIn[1] && t < T.wFall) pos.x = q.x0 + 210;
    cobweb(ctx, q.x0 + 14, q.fl - 175 * s, 90, seg(t, T.wWeb, T.wWeb + 4) * (1 - r), 1);
  }
  if (i === 2) { F.dumbbell(ctx, q.x0 + 420, q.fl - 16 * z, z, 0); }
  if (i === 3) {
    const g = lerp(clamp(tinyDone(t) / 10 + .25 * seg(t, T.tGo, T.POWER)), 0, r);
    F.plant(ctx, q.x0 + 400, q.fl, .82 * z, g, q.col, t);
    for (let k = 0; k < 10; k++) { const d = T.day(k); if (t > d && t < d + 1.0) {    // 2-minute timer ring next to the head
      const u = seg(t, d, d + .85), a = 1 - seg(t, d + .85, d + 1.0); ctx.save(); ctx.globalAlpha = a;
      S.timer(ctx, q.x0 + 330, q.y0 + 300, .32, u, {}); ctx.restore(); } }
  }
  const n = S.ninja.pose(t, Object.assign({ J }, pos));
  if (i === 0 && t >= T.aQuit + .9 && t < RS + .3) { n.fx = -1; n.y = q.fl - 6; }
  const sk = S.ninja.skel(n), hand = W2(n, sk.armF[2]), handB = W2(n, sk.armB[2]), hc = W2(n, sk.hc);
  // ---- behind the figure
  if (i === 1) {        // the motivation cloud: shows up, teases, leaves
    const c1 = seg(t, T.wIn[0], T.wIn[0] + .4), l1 = seg(t, T.wOut[0], T.wOut[0] + .5);
    if (t > T.wIn[0] && t < T.wOut[0] + .6) S.cloud(ctx, lerp(q.x1 + 160, q.x1 - 150, oBack(c1)) + 420 * iC(l1), q.y0 + 340 - 120 * l1, .5, t, { face: l1 > 0 ? 'wink' : 'smug' });
    const c2 = seg(t, T.wIn[1] - .3, T.wIn[1] + .1), g2 = seg(t, T.wOut[1] - .3, T.wOut[1] + .4);
    if (t > T.wIn[1] - .3 && t < T.wOut[1] + .5) S.cloud(ctx, q.x1 - 140, lerp(q.y0 + 120, q.y0 + 330, oBack(c2)), .5, t, { face: 'smug', grey: g2, op: 1 - seg(t, T.wOut[1] + .1, T.wOut[1] + .5) });
    const p3 = seg(t, T.wPass, T.wPass + 2.2);
    if (p3 > 0 && p3 < 1) S.cloud(ctx, lerp(q.x1 + 170, q.x0 - 170, p3), q.y0 + 330 + 20 * Math.sin(t * 3), .45, t, { face: 'wink' });
    if (t > T.wIn[1] - .2 && t < T.wFall) o.look = [3, -4];
  }
  if (i === 2 && ((t > T.nShrug && t < T.nJack) || (t > T.nQuit && t < T.nSit + .6))) S.qmark(ctx, hc[0] + 70, hc[1] - 80 - 8 * Math.sin(t * 6), .9, 1);
  if (i === 2 && t > T.nPhone + 2.2 && t < T.nPalm) S.qmark(ctx, hc[0] + 70, hc[1] - 80, .7, tri(t, T.nPhone + 2.2, T.nPalm));
  // ---- the figure + held things
  if (i === 0 && t >= T.aQuit + .9 && t < RS) o.face = 'b';
  if (i === 3 && t >= T.POWER && t < RS) o.face = null;
  const lit = (i === 2 && t > T.nPhone && t < T.nPalm) || (i === 2 && t > T.nSit + .3 && t < RS);
  if (lit) o.lit = 1;
  F.neon(ctx, n, q, Gl, o);
  if (i === 0 && ((t >= T.aCurl && t < T.aPush) || (t >= T.aLift && t < T.aDrop))) { F.dumbbell(ctx, hand[0], hand[1], z, 1.3); if (t < T.aPush) F.dumbbell(ctx, handB[0], handB[1], z, 1.3); }
  if (i === 2 && ((t >= T.nCurl && t < T.nQuit))) { F.dumbbell(ctx, hand[0], hand[1], z, 1.3); }
  if (i === 2 && lit) F.phone(ctx, W2(n, n.J.phone ? [n.J.phone.x, n.J.phone.y] : sk.armF[2])[0], W2(n, n.J.phone ? [n.J.phone.x, n.J.phone.y] : sk.armF[2])[1], -.35, 1, { held: 1, s: z });
  // ---- effects in front
  if (i === 0) {
    if (t > T.aJack && t < T.aDone) F.sweat(ctx, hc, t, 1, 0, z);
    F.bubble(ctx, q.x0 + 330, q.y0 + 250, '2 HOURS!', seg(t, T.aJack + .1, T.aJack + 2.2), { size: 50, rot: .05 });
    F.impact(ctx, hc[0], hc[1], t, T.aDone, q.col, z, .4, 8);
    if (t > T.aDay2 && t < T.aQuit) { F.sweat(ctx, hc, t, .8, .3, z); }
    F.impact(ctx, q.x0 + 330, q.fl - 20, t, T.aDrop + .05, '#ffffff', z, .35, 6);
    if (t > T.aDay2 - .05 && t < T.aDay2 + .3) { ctx.save(); ctx.globalAlpha = 1 - seg(t, T.aDay2, T.aDay2 + .3); ctx.fillStyle = '#ffffff'; ctx.fillRect(q.x0, q.labBot + 8, q.w, q.y1 - q.labBot - 8); ctx.restore(); }
  }
  if (i === 1 && t > T.wSleep + .3 && t < RS) F.zzz(ctx, hc[0] + 40, hc[1] - 30, t, seg(t, T.wSleep + .3, T.wSleep + .8), z);
  if (i === 1) F.impact(ctx, hc[0], hc[1] + 60, t, T.wFall + .1, q.col, z, .35, 6);
  if (i === 3) {
    for (let k = 0; k < 10; k++) { const d = T.day(k) + .85; if (t > d && t < d + 1) F.tick(ctx, hand[0] + 10, hand[1] - 40, seg(t, d, d + 1), z * .9); }
    if (t > T.tGo && t < T.POWER) F.sweat(ctx, hc, t, .5, 0, z);
    F.power(ctx, q, n.x, q.fl, t, T.POWER, RS, z);
  }
}
function seek(t) {
  FP.frame(t, {
    glow: glowOf, draw,
    shake: (i, t) => (i === 0 ? shk(t, T.aDay2, .25, 9) + shk(t, T.aDrop + .05, .25, 8) : 0) + (i === 1 ? shk(t, T.wFall + .1, .25, 7) : 0) + (i === 3 ? shk(t, T.POWER, .3, 9) : 0),
    flash: (i, t) => i === 3 ? tri(t, T.POWER, T.POWER + .5) : 0,
  });
}
S.boot({ duration: T.dur, fps: 30, seek, ready: FP.ready });
</script></body></html>
