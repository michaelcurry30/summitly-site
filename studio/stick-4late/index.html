    { const u = seg(t, T.pGrab, T.pGrab + .3); if (live && u > 0 && u < 1) { bag(ctx, lerp(q.x0 + 350, hc[0] - 70, u), lerp(q.fl - 112, hc[1] + 150, u) - 80 * Math.sin(PI * u), .8); keys(ctx, lerp(q.x0 + 400, hand[0], u), lerp(q.fl - 130, hand[1], u), .9); } }
    F.bubble(ctx, q.x0 + 150, q.labBot + 70, 'EARLY!', seg(t, T.pEarly, T.pEarly + 1.8), { size: 50, rot: .04, bg: '#4dff9a' });
    for (let k = 0; k < 4; k++) { const a = 10.6 + k * 1.1; if (live && t > a && t < a + 1) F.tick(ctx, hc[0] + 80, hc[1] - 50, seg(t, a, a + 1), z * .8); }
    F.power(ctx, q, n.x + 60, q.fl, t, T.POWER, RS, z);
  }
}
function seek(t) {
  FP.frame(t, {
    glow: glowOf, draw,
    shake: (i, t) => (i === 0 ? shk(t, T.rWreck, .35, 10) : 0) + (i === 1 ? shk(t, T.mPanic, .3, 7) : 0) + (i === 2 ? shk(t, T.kBury + .1, .35, 9) : 0) + (i === 3 ? shk(t, T.POWER, .3, 9) : 0),
    flash: (i, t) => i === 3 ? tri(t, T.POWER, T.POWER + .5) : 0,
  });
}
S.boot({ duration: T.dur, fps: 30, seek, ready: FP.ready });
