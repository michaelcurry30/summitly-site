<!doctype html>
<html><head><meta charset="utf-8"><title>Never Miss Twice</title>
<script src="variant.js"></script>
<script src="kit/stick.js"></script>
</head>
<body><div id="stage"></div>
<script>
// STICK NINJA — "NEVER MISS TWICE" (planner channel). Short (≈15.19 s). Built from gen_short.py template. Ending: lesson + endCardPlanner (CTA b).
const EC0 = 11.6, DUR = 15.19;
const A = {"hook": 0, "prob": 2.6, "roof": 5.55, "fix": 6.85, "pay": 9.6};
const K = {"TH": 6.45, "land": 5.68, "EC0": 11.6, "DUR": 15.19, "h1": 1.5, "pk": 4.4, "f1": 7.35, "f2": 8.75};
const SCENES = { hook: [0, A.prob], prob: [A.prob, A.roof], roof: [A.roof, A.fix], fix: [A.fix, A.pay], pay: [A.pay, DUR] };
const S = Stick, { seg, oC, io, oBack, lerp, clamp, tri, hash } = S;
const stage = S.stage();
const E = { e1: S.env(stage, 'bedroom'), e2: S.env(stage, 'hall'), roof: S.env(stage, 'rooftop'), e4: S.env(stage, 'library', { day: true }), mtn: S.env(stage, 'mountain') };
const W = S.world(stage);
const hookH = S.kin(stage, '<div data-max="130">MISSED ONE WORKOUT,</div><div data-max="130">SO YOU QUIT THE <i class="pk">WHOLE</i> <i class="pk">PLAN?</i></div>', { top: 262 });
const probH = S.kin(stage, '<div data-max="130">ONE MISS TURNS INTO A WEEK.</div><div data-max="150">THEN IT’S <i class="pk">OVER.</i></div>', { top: 262 });
const ninH = S.kin(stage, '<div data-max="180"><i class="cy">NO</i> <i class="cy">WAY.</i></div>', { top: 262 });
const fixH = S.kin(stage, '<div data-max="130">MISSING ONCE IS LIFE.</div><div data-max="140">JUST <i class="cy">NEVER</i> <i class="cy">MISS</i> <i class="cy">TWICE.</i></div>', { top: 262 });
const pay1 = S.kin(stage, '<div data-max="150">NEVER MISS</div>', { top: 290 });
const pay2 = S.kin(stage, '<div data-max="170"><i class="or">TWICE.</i></div>', { top: 470 });
S.safeGuide(stage);
const endCard = S.endCardPlanner(stage, { dur: +(DUR - EC0).toFixed(2), head: '<div data-max="140">DON’T WATCH IT.</div><div data-max="160"><i class="cy">TRACK</i> <i class="cy">IT.</i></div>', beats: [0.35, 0.5, 0.65, 1.15, 1.35], chip: '<span class="chip dark" style="font-size:46px">FREE TRACKER IN <b>BIO</b></span>' });
const D = S.ninja.draw, nin = (t, J, o) => S.ninja.pose(t, Object.assign({ J }, o));
const sk = n => S.ninja.skel(n), W2 = (n, p) => S.ninja.toWorld(n, p), hand = n => W2(n, sk(n).armF[2]);
function glow(ctx, x, y, r, col, k) {
  if (k <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col.replace('A', (.5 * k).toFixed(3))); g.addColorStop(1, col.replace('A', '0'));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
const EW = { color: '#ff9ec7', color2: '#ff6fae', side: '#6a1736', depth: 16 };
const HA = -64, TS = K.TH - S.ninja.SLASH.uAt(HA);
const roofTr = S.track([[A.roof, 160, 1500, 1.2, 0], [K.land, 200, 1500, 1.2, 0], [TS - .02, 200, 1500, 1.2, 0], [TS + .62, 640, 1500, 1.2, 260], [99, 640, 1500, 1.2, 0]]);
const roofTL = S.ninja.timeline([[A.roof, 'jump', { ph: .5 }], [K.land, 'crouch', {}, .1], [TS, 'slash', {}, .08], [TS + 1.25, 'ready', {}, .25]]);
const hitN = nin(K.TH, roofTL(K.TH), roofTr(K.TH)), RC = S.ninja.reach(hitN);
const WC = S.wordcut(Object.assign({ text: 'QUIT', x: RC.cx + RC.R * Math.cos(HA * Math.PI / 180), y: RC.cy + RC.R * Math.sin(HA * Math.PI / 180), size: 200, angle: HA + 90, seed: 7 }, EW));
const payTL = S.ninja.timeline([[A.pay, 'walk'], [A.pay + .5, 'idle', {}, .2], [A.pay + .6, 'flourish', { aim: -8 }, .1], [10.35 + .4, 'proud', {}, .25]]);
const payTr = S.track([[A.pay, 250, 1500, 1.15, 0], [A.pay + .5, 470, 1500, 1.15, 0]]);

const hookTL = S.ninja.timeline([[0, 'pushup'], [.9, 'flat', {}, .15], [K.h1, 'shrug', {}, .15]]);
function drawHook(ctx, t) { const k = oBack(seg(t, K.h1 - .3, K.h1), 2);
  if (k > 0) { S.calPage(ctx, 820, 1050, .6 * k, 'MON', { rot: 6 }); ctx.save(); ctx.strokeStyle = '#ff4f8b'; ctx.lineWidth = 16; ctx.lineCap = 'round'; const p = seg(t, K.h1, K.h1 + .25), r = 60;
    ctx.beginPath(); ctx.moveTo(820 - r, 1050 - r + 20); ctx.lineTo(820 - r + 2 * r * p, 1050 - r + 20 + 2 * r * p); ctx.stroke(); ctx.restore(); }
  D(ctx, nin(t, hookTL(t), { x: 520, y: 1500, s: 1 })); }
const probTL = S.ninja.timeline([[A.prob, 'sitBack'], [A.prob + 1.0, 'slump', {}, .2], [K.pk, 'facepalm', {}, .12]]);
function drawProb(ctx, t) {
  for (let i = 0; i < 5; i++) { const a = A.prob + .3 + i * .25, k = oBack(seg(t, a, a + .2), 2); if (k <= 0) continue;
    const x = 600 + (i % 3) * 140, y = 960 + Math.floor(i / 3) * 190; S.calPage(ctx, x, y, .45 * k, 'DAY ' + (i + 2), { rot: (i - 2) * 5, col: '#ff6fae' }); }
  D(ctx, nin(t, probTL(t), { x: 320, y: 1500, s: 1 })); }
const fixTL = S.ninja.timeline([[A.fix, 'pushup'], [A.fix + 1.1, 'jump', { ph: .5 }, .1], [A.fix + 1.5, 'pump', {}, .1], [K.f2 + .3, 'cheer', {}, .12]]);
function drawFix(ctx, t) {
  glow(ctx, 520, 1250, 260, 'rgba(62,230,255,A)', .3 + .4 * seg(t, K.f1, K.f2));
  S.calPage(ctx, 760, 1000, .5 * oBack(seg(t, A.fix, A.fix + .3), 2), 'MISS', { rot: -5, col: '#ff6fae' });
  S.calPage(ctx, 920, 1060, .5 * oBack(seg(t, K.f1, K.f1 + .3), 2), 'BACK', { rot: 6, col: '#3ee6ff' });
  S.check(ctx, 930, 1100, .55, seg(t, K.f2, K.f2 + .35));
  D(ctx, nin(t, fixTL(t), { x: 470, y: 1500, s: 1 }));
  S.sparks(ctx, t, K.f2, 930, 1080, { n: 12, seed: 14, speed: 500, dir: -Math.PI / 2, spread: 2.4, life: .4, g: 900 }); }

const span = (k, a, b) => seg(k, a, b);
const SC = [
  { a: 0, b: A.prob, env: E.e1, envOpt: () => ({ lamp: .6 }), cam: t => ({ x: lerp(560, 620, seg(t, 0, A.prob)), y: 1150, z: lerp(1.3, 1.42, io(seg(t, 0, A.prob))) + .03 * tri(t, K.h1, K.h1 + .3) }), draw: drawHook },
  { a: A.prob, b: A.roof, env: E.e2, whip: 'left', envOpt: () => ({}), cam: t => ({ x: lerp(540, 600, seg(t, A.prob, A.roof)), y: 1120, z: lerp(1.18, 1.28, io(seg(t, A.prob, A.roof))) + .04 * tri(t, K.pk, K.pk + .3), r: -1.5 }), draw: drawProb },
  { a: A.roof, b: A.fix, env: E.roof, whip: 'up', cam: t => { const push = io(seg(t, A.roof + .1, K.TH)) * .07, punch = .05 * tri(t, K.TH, K.TH + .25);
      return { x: lerp(545, 575, seg(t, A.roof, A.fix)), y: lerp(900, 880, seg(t, A.roof, A.fix)), z: 1.2 + push + punch }; },
    draw(ctx, t) { WC.draw(ctx, t, { in: A.roof + .05, mode: 'drop', h: 240, cut: K.TH, wob: .6, kick: 1.2, fadeAt: A.fix - .1 }); D(ctx, nin(t, roofTL(t), Object.assign({ ground: 1500 }, roofTr(t)))); } },
  { a: A.fix, b: A.pay, env: E.e4, whip: 'left', envOpt: () => ({}), cam: t => ({ x: lerp(560, 620, seg(t, A.fix, A.pay)), y: 1120, z: lerp(1.25, 1.33, io(seg(t, A.fix, A.pay))) + .03 * tri(t, K.f2, K.f2 + .3) }), draw: drawFix },
  { a: A.pay, b: DUR + 1, env: E.mtn, whip: 'left', cam: t => ({ x: 540, y: lerp(960, 985, seg(t, A.pay, EC0)), z: lerp(1.16, 1.24, io(seg(t, A.pay, EC0))) + .03 * tri(t, 10.35, 10.35 + .3) }),
    envOpt: t => ({ rise: .3 + .6 * io(seg(t, A.pay, EC0 - .2)) }),
    draw(ctx, t) { D(ctx, nin(t, payTL(t), Object.assign({ vx: t < A.pay + .5 ? 300 : 0 }, payTr(t)))); S.sparks(ctx, t, 10.35, 470, 1000, { n: 14, seed: 9, speed: 700, dir: -Math.PI / 2, spread: 2.6, life: .5, g: 900 }); } },
];
function seek(t) {
  const sh = WC.shake(t, K.TH), imp = (a, amp) => t >= a && t < a + .22 ? Math.round(amp * (1 - (t - a) / .22) * Math.sin(t * 120)) : 0;
  W.seek(t, SC, { shake: [sh[0], sh[1] + imp(K.pk, 6) + imp(K.f2, 4)], flash: WC.flash(t, K.TH), flashColor: '#ff6fae' });
  S.kinShow(hookH, t, 0, A.prob - .15, { hold0: true, beats: [0, 0, 0, 1.42, 1.55, 1.68, 1.81, 1.94, 2.07] });
  S.kinShow(probH, t, 2.72, A.roof - .3, { beats: [2.72, 2.94, 3.17, 3.39, 3.61, 3.83, 4.05, 4.28, 4.5] });
  S.kinShow(ninH, t, 5.77, K.TH + .1, { beats: [5.77, 6.22], style: 'slam' });
  S.kinShow(fixH, t, 7.02, A.pay - .15, { beats: [7.02, 7.29, 7.55, 7.82, 8.09, 8.36, 8.62, 8.89] });
  S.kinShow(pay1, t, 9.82, EC0 - .3, { beats: [9.82, 10.05], style: 'slam' });
  S.kinShow(pay2, t, 10.35, EC0 - .3, { beats: [10.35], style: 'slam' });
  endCard(t, EC0);
  S.hideInvisible(stage);
}
S.boot({ duration: DUR, fps: 30, seek });
</script></body></html>
