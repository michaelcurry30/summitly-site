<html><head><meta charset="utf-8"><title>4 Ways To Wake Up Early</title>
<script src="kit/stick.js"></script>

<body><div id="stage"></div>
<script>
// "4 WAYS TO WAKE UP EARLY. ONLY 1 WORKS." — FOURPANEL_BIBLE.md format, no VO, loops.
const S = Stick, F = FourPanel, { seg, oC, iC, io, oBack, lerp, clamp, tri, hash } = S;
const PI = Math.PI, TAU = 2 * PI;
const T = {
  dur: 22.3, go: 1.0, MORN: 9.0, POWER: 15.0,
  // snooze: alarm rings, slap, "5 MORE MIN"
  sRing: [2.0, 4.0, 6.0, 8.0], sLate: 9.6, sUp: 10.0, sTrip: 11.0,
  // phone in bed
  bPhone: 1.0, bDrop: 7.6, bZomb: 9.4,

  aPop: [], aUp: 9.0, aBack: 10.6,
  // sleep early
  eAway: 1.0, eLie: 1.9, eWake: 9.1, eUp: 9.6, eJack: 10.6, eTicks: [11.4, 12.4, 13.4],

for (let k = 0; k < 10; k++) T.aPop.push(1.1 + k * .78);
const FP = F.create({
  labels: ['SNOOZE', 'PHONE IN BED', '10 ALARMS', 'SLEEP EARLY'],

// extra lying poses (same frame as qLie)

const LIE = { face: 'z' };
const tl0 = [[0, 'qLie', LIE]];
T.sRing.forEach(r => tl0.push([r + .3, 'qLieSlap', {}, .08], [r + .6, 'qLie', { face: 'c' }, .2]));
tl0.push([T.sLate, 'qLie', { face: 's' }, .05], [T.sUp, 'qPanic', {}, 0], [T.sUp + .5, 'run', {}, .15], [T.sTrip, 'qWreck', {}, .1], [RS, 'qLie', LIE, 0]);

const tl3 = [[0, 'qLie', LIE], [T.eAway, 'qLie', { face: 'c' }, .1], [T.eLie, 'qLie', LIE, .2], [T.eWake, 'qLie', { face: 'h' }, .1], [T.eUp, 'stretch', {}, 0],
  [T.eJack, 'qJack', { rate: 11, face: 'h' }, .15], [T.eTicks[0], 'qTick', { x: 150, y: -310 }, .12], [T.eTicks[0] + .7, 'qJack', { rate: 12, face: 'h' }, .12],
  [T.eTicks[1], 'qTick', { x: 150, y: -310 }, .12], [T.eTicks[1] + .7, 'qSquat', { rate: 8, face: 'h' }, .12], [T.eTicks[2], 'qTick', { x: 150, y: -310 }, .12], [T.eTicks[2] + .7, 'pump', {}, .15],
  [T.POWER - .1, 'qCross', {}, .12], [T.stamps[0], 'qFlex', {}, .15], [17.4, 'qCross', {}, .3], [18.9, 'qFlex', {}, .2], [20.0, 'qCross', {}, .3], [21.0, 'qFlex', {}, .2], [RS, 'qLie', LIE, 0]];
const tl = [TL(tl0), TL(tl1), TL(tl2), TL(tl3)];
const failT = [T.sLate, T.bZomb, T.aBack];
const glowOf = (i, t) => FP.glow(i, t, { fail: failT[i], power: T.POWER, build: [3, 13] });
// clock per panel: night 10 pm → 6 am at MORN; the losers keep going to 9:30
const hours = (i, t) => { const r = resetK(t); let h = 22 + 8 * io(seg(t, T.go, T.MORN));
  if (i !== 3) h += 3.5 * io(seg(t, T.MORN, T.MORN + .6)); if (i === 1) h = 22 + 4 * io(seg(t, T.go, T.bDrop)) + 7.5 * io(seg(t, T.bDrop + .5, T.bZomb - .2)); return lerp(h, 22, r); };

function alarm(ctx, x, y, k, t, ring, rot = 0) {     // small bedside alarm clock
  if (k <= 0) return; const e = oBack(clamp(k), 2.2), j = ring ? Math.sin(t * 70 + x) * 5 : 0;
  ctx.save(); ctx.translate(x + j, y); ctx.rotate(rot + j * .03); ctx.scale(e, e);

  ctx.fillStyle = '#ff3b4e'; ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.fill(); ctx.fillStyle = '#f4f2ff'; ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#12131c'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -16); ctx.moveTo(0, 0); ctx.lineTo(12, 4); ctx.stroke();

const aSpots = k => { const q = Q[2]; return [[q.x0 + 70, q.y0 + 300], [q.x0 + 440, q.y0 + 420], [q.x0 + 250, q.y0 + 250], [q.x0 + 120, q.fl - 30], [q.x0 + 450, q.fl - 30],
  [q.x0 + 330, q.y0 + 360], [q.x0 + 170, q.y0 + 380], [q.x0 + 300, q.fl - 30], [q.x0 + 430, q.y0 + 280], [q.x0 + 70, q.y0 + 450]][k]; };

function draw(ctx, i, t, q) {
  const Gl = glowOf(i, t), J = tl[i](t), r = resetK(t), mo = i === 1 && t < T.bZomb ? 0 : morning(t);
  if (mo > 0) { ctx.save(); ctx.globalAlpha = .1 * mo; ctx.fillStyle = '#ffcf7a'; ctx.fillRect(q.x0, q.y0, q.w, q.h); ctx.restore(); }
  F.window2(ctx, q.x0 + 40, q.labBot + 30, 140, 100, 1 - mo);
  const ring0 = i === 0 ? Math.max(...T.sRing.map(a => tri(t, a - .05, a + .7)), tri(t, T.sLate - .1, T.sUp + .4)) : i === 1 ? tri(t, T.bZomb - .6, T.bZomb + .3) : i === 3 ? tri(t, T.MORN - .1, T.eWake + .3) : 0;
  F.clock(ctx, q.x1 - 100, q.y0 + 190, .8, hours(i, t), ring0, t);
  if (i === 0 && t > T.sLate - .1 && t < T.sUp + .6) { ctx.save(); ctx.globalAlpha = tri(t, T.sLate - .1, T.sUp + .6) * .8; ctx.strokeStyle = '#ff3b4e'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(q.x1 - 100, q.y0 + 190, 78, 0, TAU); ctx.stroke(); ctx.restore(); }
  const bedOn = inBed(i, t);
  F.bed(ctx, q.x0 + 46, q.fl, s * .9);
  let pos = bedOn ? { x: q.x0 + 232, y: q.fl - 50, s: s * .92, fx: -1 } : { x: q.x0 + 260, y: q.fl, s: s * .9, fx: 1 };
  if (i === 0 && !bedOn) { if (t >= T.sUp + .5 && t < T.sTrip) pos.x = q.x0 + lerp(260, 400, seg(t, T.sUp + .5, T.sTrip)); if (t >= T.sTrip) { pos.x = q.x0 + 330; pos.fx = -1; } }
  if (i === 1 && !bedOn) pos.x = q.x0 + lerp(250, 330, seg(t, T.bZomb, RS));
  if (i === 3 && !bedOn) pos.x = q.x0 + 200;

  if (i === 2) T.aPop.forEach((a, k) => { const [x, y] = aSpots(k); alarm(ctx, x, y, seg(t, a, a + .3) * (1 - seg(t, RS - .1, RS + .15)), t, t > a && t < RS && !(t > T.aBack + .3 && k % 2), (hash(k) - .5) * .5); });
  // purple: phone parked on the shelf, far from the bed
  if (i === 3) { const u = seg(t, T.eAway, T.eAway + .5) * (1 - r); ctx.fillStyle = '#2b3048'; F.rr(ctx, q.x1 - 150, q.y0 + 330, 110, 12, 4); ctx.fill();
    F.phone(ctx, lerp(q.x0 + 260, q.x1 - 95, io(u)), lerp(q.fl - 150, q.y0 + 304, io(u)) - 80 * Math.sin(PI * u), 0, .15, { s: z * .8 }); }
  const n = S.ninja.pose(t, Object.assign({ J }, pos));

  const o = { seed: i * .7 };

    ph = [lerp(hand[0], hc[0], u), lerp(hand[1] - 10, hc[1] - 6, u)]; if (t < T.bDrop) o.lit = 1;
    if (o.lit) { ctx.save(); ctx.globalAlpha = .22; ctx.fillStyle = '#8fe9ff'; ctx.beginPath(); ctx.moveTo(ph[0], ph[1]); ctx.lineTo(hc[0] - 50, hc[1] + 10); ctx.lineTo(hc[0] + 40, hc[1] + 10); ctx.fill(); ctx.restore(); } }

    F.zzz(ctx, hc[0] + 10, hc[1] - 40, t, t < T.sRing[0] ? seg(t, .1, .6) : 0, z);
    if (t > T.sLate && t < T.sTrip) F.sweat(ctx, hc, t, 1, .2, z);

    F.zzz(ctx, hc[0] + 10, hc[1] - 40, t, t > T.bDrop + 1 && t < T.bZomb - .6 ? 1 : 0, z);
    if (t > T.bZomb && t < RS) { ctx.save(); ctx.strokeStyle = '#6a5a9a'; ctx.lineWidth = 4; [-1, 1].forEach(sx => { ctx.beginPath(); ctx.arc(hc[0] + sx * 12 * z + 6, hc[1] + 10, 9 * z, .2, PI - .2); ctx.stroke(); }); ctx.restore();
      F.sweat(ctx, hc, t, .5, .3, z); }
  }
  if (i === 2) {
    if (t > T.aPop[3] && t < T.aUp) F.sweat(ctx, hc, t, .8, 0, z);

      [[-70, 18, 44], [-20, -14, 56], [44, -6, 52], [74, 26, 40], [10, 30, 46]].forEach(([x, y, r2]) => { ctx.beginPath(); ctx.arc(dx + x * k, dy + y * k, r2 * k, 0, TAU); ctx.fill(); });

      F.sparkle(ctx, dx + [-30, 20, 50][ph2], dy + [10, -10, 14][ph2], 40 * oBack(seg(u, 0, .25)), ['#ffd23f', '#b26bff', '#3fa9ff'][ph2], k);
